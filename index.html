ningen uppfyller tillämpliga tekniska krav och är godkänd. Sådana transporter ska vara godkända av CF eller den CF utser.","note":false},{"text":"Godkänd utrustning innebär antingen att det finns ett kompletterande typcertifikat (STC) eller är en mindre- eller större ändring (OEM minor or major change) och att detta ingår i typunderlaget för luftfartyget. Reservdelar som klassificeras som farligt gods och som inte anses falla in under lättnaden ovan ska iordningsställas och transporteras enligt bestämmelserna.","note":true}]},{"num":"1.3","title":"Ansvarsförhållanden innan transport","level":2,"paras":[]},{"num":"1.3.1","title":"Transporttjänstbeställarens ansvar","level":3,"paras":[{"text":"De förband, enheter eller organisationer som beställer en transporttjänst ansvarar för att:","note":false},{"text":"1. Tillhandahålla de uppgifter som är nödvändiga för diplomatiskt tillstånd och för ansökan om avsteg hos FSI.","note":false},{"text":"2. Det finns en behörig avsändare som iordningsställer godset för transport med det ansvar som åligger avsändaren enligt 1.3.2 Avsändarens ansvar (sida 15).","note":false},{"text":"3. Det finns en behörig godskontrollant som genomför acceptanskontroll med det ansvar som åligger godskontrollanten enligt 1.3.3 Godskontrollantens ansvar (sida 15).","note":false},{"text":"4. Det, vid transport av passagerare, utses en transportchef som får tillräckligt med information och kunskap för att uppfylla de åtaganden och ansvar som anges i 1.3.4 Transportchefens ansvar (sida 15).","note":false},{"text":"5. Det färdigställs en NOTOC för den försändelse som accepterats av godskontrollanten, NOTOC ska färdigställas av personal som erhållit utbildning enligt krav för någon av de personalkategorier som anges i Tabell 1:1 (sida 16).","note":false},{"text":"6. Färdigställda transporthandlingar i form av godsdeklaration, checklista för acceptanskontroll och NOTOC överlämnas till verksamhetsutövaren innan transporten påbörjas.","note":false},{"text":"För ansökan om nödvändiga tillstånd ska transporttjänstbeställaren samverka med verksamhetsutövaren.","note":true}]},{"num":"1.3.2","title":"Avsändarens ansvar","level":3,"paras":[{"text":"Avsändaren ansvarar för att godset är klassificerat, förpackat, märkt, etiketterat och dokumenterat enligt dessa bestämmelser. Avsändaren ansvarar också för att den personal som varit involverad i förberedande av transporten erhållit relevant utbildning enligt 1.5 Utbildning (sida 16).","note":false}]},{"num":"1.3.3","title":"Godskontrollantens ansvar","level":3,"paras":[{"text":"Godskontrollanten ansvarar för att acceptanskontroll utförs enligt 9.2 Acceptanskontroll (sida 65) och att denna kontroll verifieras genom färdigställd checklista.","note":false}]},{"num":"1.3.4","title":"Transportchefens ansvar","level":3,"paras":[{"text":"Vid transport av passagerare ansvarar utsedd transportchef för att passagerare och materiel uppfyller tillämpliga bestämmelser i 2.3 Farligt gods i personliga tillhörigheter och utrustning som tas ombord av besättning eller passagerare (sida 20) respektive 2.4 Transport under särskilda förhållanden (sida 21).","note":false}]},{"num":"1.4","title":"Verksamhetsutövarens ansvar","level":2,"paras":[{"text":"Verksamhetsutövaren ansvarar för att:","note":false},{"text":"1. Besättningen har erhållit utbildning enligt tillämpliga krav i 1.5 Utbildning (sida 16).","note":false},{"text":"2. Luftfartyget lastas på lämpligt sätt och med hänsyn till farligt gods ombord.","note":false},{"text":"3. Det utsetts en lastningsansvarig i besättningen ombord på luftfartyget, vilken har till uppgift att:","note":false},{"text":"i. kontrollera att endast godkända och oskadade kollin ingår i lasten,","note":false},{"text":"ii. säkerställa att godset har lastats enligt bestämmelserna, samt","note":false},{"text":"iii. tillse att tillämplig dokumentation delges befälhavaren innan flygtransporten påbörjas.","note":false},{"text":"4. Godkänna markpersonal som iordningsställer lastbärare, vilken har till uppgift att:","note":false},{"text":"i. kontrollera att endast godkända och oskadade kollin ingår i lasten, och","note":false},{"text":"ii. säkerställa att tillämpliga bestämmelser i 9.3 Farligt gods i lastbärare ombord på luftfartyg (sida 65) eller 9.4 Farligt gods i hängande last (sida 67) är uppfyllda.","note":false},{"text":"5. Det finns implementerade rutiner för åtgärder i händelse av nödsituationer och olyckshändelser med farligt gods.","note":false},{"text":"6. Luftfartygen utrustats med lämplig skydds- och räddningsutrustning för olyckor och tillbud med farligt gods.","note":false},{"text":"7. Rutiner för rapportering av olyckor och tillbud med farligt gods är införda.","note":false}]},{"num":"1.5","title":"Utbildning","level":2,"paras":[]},{"num":"1.5.1","title":"Krav på utbildning av personal","level":3,"paras":[{"text":"Personal tillhörande personalkategorier uppräknade i Tabell 1:1 (sida 16) ska ha genomgått utbildning inom det eller de arbetsområden för vilka de berörs. Personal tillhörande personalkategorier 1-4 ska genomgå repetitionsutbildning senast innan utgången av kalenderåret som inträffar 24 månader från tidigare utbildningstillfälle. Personal tillhörande personalkategori 5 ska genomföra en grundutbildning och därefter åligger ansvaret på verksamhetsutövaren att hålla personal uppdaterad på ändringar i regelverket.","note":false}]},{"num":"1.5.2","title":"Utbildningsprogram","level":3,"paras":[{"text":"Utbildningen ska minst omfatta det eller de ämnesområden som redovisas i Tabell 1:1 (sida 16) för respektive personalkategori. Kunskapsnivån ska verifieras genom intyg som erhålls efter avlagt kunskapsprov med godkänt resultat.","note":false}]},{"num":"1.5.3","title":"Registrering av genomförd utbildning","level":3,"paras":[{"text":"Varje verksamhetsutövare eller förband som utför uppdrag åt en beställare av transporttjänster ska föra register över personal som utbildats enligt dessa bestämmelser. Registrering av personal ska minst innehålla följande uppgifter:","note":false},{"text":"1. Namn på innehavaren av intyget,","note":false},{"text":"2. datum för senast avlagt kunskapsprov","note":false},{"text":"3. examinator eller instruktör, samt","note":false},{"text":"4. uppgift om utbildningens innehåll. Tabell 1:1 Utbildningskrav för olika personalkategorier. Ämnesområden inom vilka den enskilde ska ha erforderliga kunskaper Personalkategori 1 2 3 4 5 Allmän kännedom om risker med farligt gods x x x x x Ansvar och befogenheter x x x x x Begränsningar x x x x x Klassificering x x Identifiering och risker x x x x x Undantag och avsteg från föreskrifterna x x x x x Farligt gods som bärs av passagerare x x x x Ämnesområden inom vilka den enskilde ska ha erforderliga kunskaper Personalkategori 1 2 3 4 5 Packning x x x Märkning av kolli x x x x x Godsdeklaration x x x x x NOTOC x x x x x Acceptans (kontroll av försändelser) x x x Lastning och stuvning av luftfartyg x x x x Nödåtgärder vid olycka eller tillbud x x x x Personalkategorier","note":false},{"text":"1. Avsändare.","note":false},{"text":"2. Godskontrollant som genomför acceptanskontroll av farligt gods.","note":false},{"text":"3. Personal som ansvarar för lastning och lossning av luftfartyg (lastningsansvarig) inklusive personal som iordningsställer lastbärare för flygtransport.","note":false},{"text":"4. Piloter.","note":false},{"text":"5. Övriga besättningsmedlemmar som inte återfinns i kategori 3 eller 4.","note":false},{"text":"(a) Utbildningskraven gäller även personal som inte är anställd av Försvarsmakten. (b) en som genomgått utbildning enligt kategori 2 anses uppfylla utbildningskraven för övriga kategorier. (c) Den som utsetts till transportchef omfattas inte av utbildningskrav men ska ha fått tillräcklig information för att kunna fullgöra sina åtaganden enligt 1.3.4 Transportchefens ansvar (sida 15)","note":true}]}]},{"num":"2","title":"Begränsningar","sections":[{"num":"2","title":"Begränsningar","level":1,"paras":[]},{"num":"2.1","title":"Farligt gods som är förbjudet eller kräver tillstånd","level":2,"paras":[]},{"num":"2.1.1","title":"Farligt gods som är förbjudna under alla omständigheter","level":3,"paras":[{"text":"Ämnen och föremål som beskrivs i IATA-DGR, 2.1.1 är förbjudet under alla omständigheter.","note":false},{"text":"Ämnen och föremål som är förbjudna under alla omständigheter är sådana vilka i den stund de avses transporteras, samtidigt är benägna att explodera, farligt reagera, framkalla flammor eller utveckla värme, eller avge giftiga, korrosiva eller brännbara gaser eller ångor under de förhållanden som normalt råder under transport.","note":true}]},{"num":"2.1.2","title":"Farligt gods som endast får transporteras efter tillstånd","level":3,"paras":[{"text":"Vissa ämnen och föremål får endast transporteras efter tillstånd i enlighet med de villkor som anges i tillämplig särbestämmelse (se 4.4 Särbestämmelser (Special Provisions) (sida 38). Tillstånd ska erhållas från den tillståndsgivare som är utpekad i särbestämmelsen.","note":false}]},{"num":"2.1.3","title":"Farligt gods som endast får transporteras efter avsteg","level":3,"paras":[{"text":"Ämnen och föremål som tilldelats särbestämmelse SP3 (se 4.4 Särbestämmelser (Special Provisions) (sida 38)) får endast transporteras efter avsteg från FSI. Även SP8, 39, 46, 70, 73 och 74 kan kräva avsteg från FSI.","note":false}]},{"num":"2.1.4","title":"Ansökan om avsteg eller tillstånd från bestämmelser","level":3,"paras":[{"text":"Vid avsteg eller tillstånd ska följande uppgifter beaktas:","note":false},{"text":"1. Namn och kontaktperson hos både verksamhetsutövare och beställaren av transporttjänst.","note":false},{"text":"2. Verksamhetsutövare och typ/typer av luftfartyg som ska användas för transporten.","note":false},{"text":"3. Planerade datum för flygtransporten samt avsedd destinationsort/orter (om möjligt reservationsnummer för flygtransporten). Om ansökan avser ett antal transporter inom en tidsperiod, ska tidsomfattningen då tillståndet önskas tillämpas anges.","note":false},{"text":"4. Geografiskt område som avses. Kan vara en avsedd transportsträcka med definierade avgångs-, transit- och destinationsorter, men kan också utgöra ett missions- eller övningsområde.","note":false},{"text":"5. Uppgifter om allt farligt som ingår i lasten. Både sådant som är packat som frakt och sådant som bärs ombord eller finns i särskild utrustning. Uppgifterna ska bestå av UNnummer, Proper Shipping Name, Klass, eventuell förpackningsgrupp, antal och typ av förpackning samt mängd.","note":false},{"text":"6. Särskilda uppgifter om hur godset avses transporteras (bäras, placeras i eller på fordon, luftburen försörjning etc.).","note":false},{"text":"7. Uppgift om passagerare ska vara med under transporten och i så fall hur många.","note":false},{"text":"8. En riskutredning som anger acceptabel risknivå och hur transporten kan genomförs för att uppfylla denna nivå.","note":false}]},{"num":"2.2","title":"Begränsningar för farligt gods som frakt","level":2,"paras":[{"text":"Farligt gods som överlämnas som frakt ska iordningsställas enligt begränsningarna i 4.2 Ämnesförteckning farligt gods (sida 36). I de fall ett ämne eller föremål inte finns upptaget i ämnesförteckningen i 4.2 Ämnesförteckning farligt gods (sida 36) ska begränsningarna i IATA-DGR, 4.2 följas.","note":false}]},{"num":"2.3","title":"Farligt gods i personliga tillhörigheter och utrustning som tas ombord av besättning eller passagerare","level":2,"paras":[{"text":"Farligt gods i personliga tillhörigheter och utrustning får tas ombord och medfölja flygtransporter enligt de villkor som anges i 2.3.1 Kontroll inför transport (sida 20) och 2.3.2 Begränsningar (sida 21). Farligt gods som omfattas av detta avsnitt är undantaget från övriga krav i HFFG.","note":false}]},{"num":"2.3.1","title":"Kontroll inför transport","level":3,"paras":[{"text":"Transportchef ska inför en transport kontrollera att passagerare håller sig till de begränsningar som framgår i 2.3.2 Begränsningar (sida 21). Transportchefen ska även i samband med ombordstigning informera lastningsansvarig om att sådan kontroll är genomförd och att passagerarna uppfyller gällande begränsningar. Befälhavaren ansvarar för motsvarande kontroll av besättningens personliga tillhörigheter och utrustning. Kontroller enligt ovanstående ska företas så att det finns möjlighet för omhändertagande av ämnen och föremål som inte är tillåtna.","note":false}]},{"num":"2.3.2","title":"Begränsningar","level":3,"paras":[{"text":"Bestämmelserna i detta avsnitt får endast tillämpas enligt de begränsningar och villkor som anges i Bilaga 2 Farligt gods som får bäras ombord av passagerare eller besättning (sida 81) eller de begränsningar och villkor som anges i IATA-DGR, 2.3. Farligt gods som inte finns nämnt i denna bilaga ska iordningsställas som frakt eller tas ombord enligt avsnitt 2.4 Transport under särskilda förhållanden (sida 21). Varje person som medför farligt gods ombord är ansvarig för att begränsningarna enligt detta avsnitt efterföljs. Vid tillämpning av Bilaga 2 Farligt gods som får bäras ombord av passagerare eller besättning (sida 81) gäller följande:","note":false},{"text":"1. Vissa ämnen och föremål får endast tas ombord enligt detta avsnitt om syftet är att materielen ska användas, eller har använts, i ett beordrat uppdrag eller övning till vilken flygtransporten kan hänföras. Denna begränsning anges med ett ”x” i kolumn 2 (endast tillåtet vid uppdrag).","note":false},{"text":"2. Det farliga godset ska vara placerat enligt de bestämmelser som anges i kolumn 4 (övriga villkor). Bestämmelser för placering delas in i följande kategorier:","note":false},{"text":"i. Intill personen avser att det farliga godset är placerat i fickor, packning eller utrustning så att det är inom räckhåll vid ett eventuellt tillbud.","note":false},{"text":"ii. Avskild packning i separat lastutrymme innebär att det farliga godset kan förvaras i packning som placeras utom direkt övervakning och räckhåll för passagerare och besättning","note":false},{"text":"iii. På plats som anvisas av lastningsansvarig innebär att det ska placeras på den plats som beslutats av lastningsansvarig. Ett sådant beslut ska baseras på typ av luftfartyg, typ av flyguppdrag, det farliga godsets egenskaper och övrig last. I det fall begränsningarna anger att placering endast kan ske enligt anvisningar från lastningsansvarig eller då befälhavaren måste vara informerad så ska passageraren, innan ombordstigning, söka samband med lastningsansvarig så att denne kan identifiera det farliga godset och fatta beslut om placering samt, om tillämpligt, informera befälhavaren.","note":false}]},{"num":"2.4","title":"Transport under särskilda förhållanden","level":2,"paras":[]},{"num":"2.4.1","title":"Tillämpning","level":3,"paras":[{"text":"I samband med insatser och övningar kan vissa transporter innebära att materiel, utrustning och gods måste iordningställas för uppdraget eller övningen och att det därför kan krävas undantag eller avsteg från bestämmelserna i kap 5-9. Dessa transporter innebär en ökad risk för samtliga inblandade och 2.4 Transport under särskilda förhållanden (sida 21) innehåller därför de krav som helt eller delvis kan tillämpas utifrån den avvägning som utsedda befattningshavare, enligt 2.4.2 Beslut om tillämpning (sida 22), gör för den eller de transporter som avses. Avsnitt 2.4 är avsedd att tillämpas för transporter som utförs kortast möjliga sträcka till och från platser som INTE möjliggör tillämpning av HFFG i sin helhet. Bestämmelserna som anges i 2.4.3 Buren utrustning (sida 22) – 2.4.9 Övervakning och säkerhet under transport (sida 24) ska tillämpas i den omfattning som anges i beslutet från utsedd befattningshavare. Den totala mängden farligt gods ska begränsas till den mängd som uppdraget eller övningen kräver.","note":false}]},{"num":"2.4.2","title":"Beslut om tillämpning","level":3,"paras":[{"text":"Beslut om tillämpning av detta delavsnitt fattas av CF eller den som CF utser. Vid nödsituationer äger befälhavaren rätt att fatta beslut om tillämpning av detta delavsnitt. Ett beslut om tillämpning ska ske i samråd med personal som har erforderlig kompetens i dessa bestämmelser och villkoren för transporten ska anpassas så att man upprätthåller en acceptabel säkerhetsnivå.","note":false},{"text":"Personal med erforderlig kompetens kan vara personal som genomgått utbildning för godskontrollant eller motsvarande.","note":true},{"text":"Personal som medföljer transporter enligt detta delavsnitt anses delta i fastställd verksamhet eller en övning som föregår denna och ska därför inte betraktas som passagerare vad avser de begränsningar som gäller för passagerarflyg.","note":true}]},{"num":"2.4.3","title":"Buren utrustning","level":3,"paras":[{"text":"Personlig utrustning får tas ombord enligt de begränsningar som anges i 2.3 Farligt gods i personliga tillhörigheter och utrustning som tas ombord av besättning eller passagerare (sida 20). I de fall utrustningen innehåller ämnen eller föremål som inte finns upptagna i 2.3 Farligt gods i personliga tillhörigheter och utrustning som tas ombord av besättning eller passagerare (sida 20) så ska det säkerställas att de kan tas ombord på ett säkert sätt och att inkompatibla ämnen och föremål i största möjliga mån hållas åtskilda enligt Tabell 9:3 (sida 72) och Tabell 9:4 (sida 73). Transportchef ska innan ombordstigning:","note":false},{"text":"1. Kontrollera att utrustningen bärs på ett så säkert sätt som möjligt, enligt gällande krav för utrustningens användning, att risken för oavsiktlig initiering minimerats samt att den enskilde har möjlighet att hantera utrustningen rätt vid olycka eller tillbud.","note":false},{"text":"2. Informera lastningsansvarig att kontroll är genomförd och, om tillämpligt, ge information om personer/packning/utrustning ska hållas åtskilda från varandra med avseende på separationskraven i Tabell 9:3 (sida 72) och Tabell 9:4 (sida 73).","note":false}]},{"num":"2.4.4","title":"Förpackat farligt gods","level":3,"paras":[{"text":"Kraven i nr. 1 (sida 23) till nr. 3 (sida 23) nedan ska beaktas vad gäller farligt gods som är förpackat och lastas som kollin:","note":false},{"text":"1. Godset ska vara förpackat för att klara normala transportpåkänningar och, om möjligt, uppfylla kraven enligt 5 Förpackningskrav (sida 39).","note":false},{"text":"2. Kollin bör vara märkta med UN-nummer och faroetikett alternativt med märkning för lastbärare enligt 9.3.3 Märkning av lastbärare (sida 66).","note":false},{"text":"3. Mängden farligt gods per kolli ska begränsas till de gränsvärden som gäller för fraktflyg (CAO).","note":false}]},{"num":"2.4.5","title":"Last i lastbärare","level":3,"paras":[{"text":"Beställaren av transport ansvarar för att förpackat farligt gods endast lastas i lastbärare om följande krav är uppfyllda:","note":false},{"text":"1. Förpackningar ska vara kontrollerade att de uppfyller kraven enligt 2.4.4 Förpackat farligt gods (sida 23).","note":false},{"text":"2. Lastbäraren ska vara i god kondition och godset ska vara lastsäkrat.","note":false},{"text":"3. Lastbäraren ska vara märkt med UN-nummer och faroetikett alternativt med märkning för lastbärare enligt 9.3.3 Märkning av lastbärare (sida 66).","note":false}]},{"num":"2.4.6","title":"Dokumentation","level":3,"paras":[{"text":"Beställaren av transport ansvarar för att dokumenterad information motsvarande det som krävs på NOTOC, överlämnas innan transport av förpackat farligt gods. Informationen kan lämnas på manifest eller liknande. Av informationen ska det framgå om det farliga godset är förpackat, om det är placerat i lastbärare eller om materielen bärs intill kroppen eller i stridspackning/motsvarande. Vid transport där en fysisk överlämning av dokument inte är möjlig (t.ex. vid hänglast med helikopter) ska befälhavaren åtminstone få muntlig information om det farliga godsets egenskaper (vilken klassificering som gäller) samt uppgift om mängden.","note":false}]},{"num":"2.4.7","title":"Kontroll inför transport","level":3,"paras":[{"text":"Vid transport av passagerare och förpackat farligt gods ska transportchefen kontrollera att kollin eller lastbärare med farligt gods överensstämmer med NOTOC. Om endast materiel ska hämtas ska lastningsansvarig genomföra motsvarande kontroll. För buren materiel ska transportchef företa kontroller enligt 2.4.3 Buren utrustning (sida 22).","note":false}]},{"num":"2.4.8","title":"Lastkonfiguration","level":3,"paras":[{"text":"Lastningsansvarig ska tillse att ämnen och föremål som kräver separation enligt Tabell 9:3 (sida 72) eller Tabell 9:4 (sida 73), separeras med största möjliga avstånd ombord på luftfar2 Begränsningar tyget. Om fler än ett luftfartyg omfattas av transporten ska, om det praktiskt är möjligt, inkompatibla ämnen/föremål placeras på separata luftfartyg. Sprängkapslar (gäller inte 1.4S) ska placeras så långt från sprängämnen, övrig ammunition och andra explosiva ämnen och föremål som möjligt. Pyrotekniska föremål, rök- och lysammunition ska placeras så att det kan nödfällas. Farligt gods ska hållas åtskilda från värmekällor och föremål som kan alstra gnista eller underlätta antändning.","note":false}]},{"num":"2.4.9","title":"Övervakning och säkerhet under transport","level":3,"paras":[{"text":"Materiel får endast lastas så att besättning eller passagerare har möjlighet att omhänderta denna vid olycka eller tillbud.","note":false}]},{"num":"2.5","title":"Transport av farligt gods som tillhör verksamhetsutövaren","level":2,"paras":[]},{"num":"2.5.1","title":"Undantag från bestämmelserna","level":3,"paras":[{"text":"Ämnen och föremål som är klassificerade som farligt gods och som tillhör verksamhetsutövaren är undantagna enligt 1.2.6 Undantag för utrustning installerad i luftfartyg (sida 14).","note":false}]},{"num":"2.5.2","title":"Transport av reservdelar","level":3,"paras":[{"text":"Reservdelar som klassificeras som farligt gods måste iordningsställas bestämmelserna såvida de inte bedömts ingå som extra utrustning för ett särskilt transportuppdrag och där beslut fattats att de kan omfattas av motsvarande undantag som ordinarie utrustning (se villkor i 1.2.6 Undantag för utrustning installerad i luftfartyg (sida 14)). Transportemballage som konstruerats och godkänts för en specifik reservdel behöver inte typgodkännas enligt kapitel 6 Godkända förpackningar, tankar och IBC-behållare (sida 43) om förpackningen bedömts ha motsvarande prestanda som krävs för att förpacka avsedd artikel enligt IATA-DGR.","note":false}]},{"num":"2.6","title":"Farligt gods som reducerad mängd (Excepted Quantity)","level":2,"paras":[]},{"num":"2.6.1","title":"Tillämpning och begränsningar","level":3,"paras":[{"text":"Reducerad mängd (excepted quantity) avser farligt gods som tillåts transporteras enligt de begränsningar som framgår av IATA-DGR, 2.6. I detta avsnitt återges en sammanfattad beskrivning om de krav som gäller vid transport som reducerad mängd (excepted quantity). Om ett ämne, och i så fall i vilka mängder, tillåts transporteras som reducerad mängd framgår av den ”E-kod” som angetts för ämnet enligt kolumn F i ämnesförteckningen 4.2 Ämnesförteckning farligt gods (sida 36). Tabell 2:1 Mängdbegränsningar vid reducerad mängd. Kod Max nettomängd per innerförpackning (mL eller gram) Max nettomängd per komplett förpackning (mL eller gram) E0 Ej tillåtet som reducerad mängd E1 30 1 000 E2 30 500 E3 30 300 E4 1 500 E5 1 300 Farligt gods som omfattas av detta avsnitt är undantaget från övriga krav i HFFG.","note":false}]},{"num":"2.6.2","title":"Förpackningskrav för reducerade mängder","level":3,"paras":[{"text":"Gods som iordningsställs som reducerad mängd (excepted quantity) kräver sammansatta förpackningar bestående av:","note":false},{"text":"• innerförpackning,","note":false},{"text":"• mellanförpackning, och","note":false},{"text":"• ytterförpackning. Detaljerade förpackningskrav samt krav på absorbtionsmedel är beskrivet i IATA DGR, avsnitt 2.6.5 och 2.6.6. Det ställs inget krav på typgodkända förpackningar men avsändaren ska försäkra sig om att den kompletta förpackningen klarar:","note":false},{"text":"1. ett fallprov på 1,8 meter mot en hård horisontell yta,","note":false},{"text":"2. stapelprov, 3 meter hög stapel i 24 timmar.","note":false}]},{"num":"2.6.3","title":"Märkningskrav för reducerade mängder","level":3,"paras":[{"text":"Kollin iordningsställda som reducerad mängd (excepted quantity) omfattas inte av bestämmelserna i 7 Märkning och etikettering (sida 47) beträffande märkning och faroetiketter. Däremot ska varje förpackning vara försedd med märkning enligt Bild 2:1 (sida 26). Märkningen ska innehålla uppgift om ämnets faroklass samt uppgift om avsändare eller mottagare. Uppgift om avsändare eller mottagare får alternativt anges på annat ställe på kollit. I de fall förpackningar placeras i overpack, där märkningen inte syns utifrån så ska märkningen ”overpack” anges på utsidan tillsammans med märkning enligt Bild 2:1 (sida 26).","note":false}]},{"num":"2.6.4","title":"Dokumentationskrav för reducerade mängder","level":3,"paras":[{"text":"Det krävs ingen godsdeklaration för dessa sändningar förberedda som reducerad mängd (excepted quantity). Det finns heller inget krav att det ska tas upp på NOTOC.","note":false}]},{"num":"2.6.5","title":"Transportbestämmelser för reducerade mängder","level":3,"paras":[{"text":"Vid transport som reducerad mängd (excepted quantity) gäller följande bestämmelser i 9 Hantering, lastning och transport (sida 65).","note":false},{"text":"1. 9.1 Kontoll innan lastning (sida 65) beträffande kontroll innan lastning.","note":false},{"text":"2. 9.5 Allmänna krav vid lastning och lossning av luftfartyg (sida 69) beträffande allmäna krav vid lastning och lossning av luftfartyg.","note":false},{"text":"3. 9.12 Säkerhetsrutiner ombord (sida 75) beträffande säkerhetsrutiner ombord","note":false},{"text":"4. 9.13 Nödfällning av farligt gods (sida 75) beträffande nödfällning av farligt gods","note":false},{"text":"5. 9.14 Rapportering (sida 76) beträffande rapportering av olycka, tillbud och avvikelse. Bild 2:1 Märkning reducerad mängd.","note":false}]},{"num":"2.7","title":"Farligt gods som begränsad mängd (Limited Quantity)","level":2,"paras":[]},{"num":"2.7.1","title":"Allmänt","level":3,"paras":[{"text":"Begränsad mängd (limited quantity) avser farligt gods som tillåts transporteras enligt de begränsningar som framgår av IATA-DGR, 2.7. Transport som begränsad mängd innebär att man ska förpacka godset och följa begränsningarna som anges för avsett ämne eller föremål i kolumn G och H i ämnesförteckningen. Lättnaderna att transportera gods som begränsad mängd ligger i att godset kan packas i en förpackning som inte är typgodkänd, men i övrigt gäller alla övriga krav i dessa bestämmelser. Detta avsnitt återger en sammanfattad beskrivning om de krav som gäller vid transport som begränsad mängd (limited quantity)","note":false}]},{"num":"2.7.2","title":"Förpackningskrav för begränsade mängder","level":3,"paras":[{"text":"Gods ska förpackas enligt den förpackningsinstruktion som anges i kolumn G för avsett ämne. Förpackningsinstruktioner för begränsade mängder anges alltid med prefixet ”Y”. Begränsade mängder måste alltid förpackas i sammansatta förpackningar som består av både innerförpackning och ytterförpackning. Bruttovikten på kollit får aldrig överstiga 30 kg. Det ställs inget krav på typgodkända förpackningar men avsändaren ska försäkra sig om att den kompletta förpackningen klarar:","note":false},{"text":"1. ett fallprov på 1,2 meter mot en hård horisontell yta,","note":false},{"text":"2. stapelprov, 3 meter hög stapel i 24 timmar.","note":false}]},{"num":"2.7.3","title":"Märkningskrav för begränsade mängder","level":3,"paras":[{"text":"Kollin ska märkas med all den märkning och de etiketter som krävs för ämnet eller föremålet i enlighet med 7 Märkning och etikettering (sida 47) i dessa bestämmelser. Kollin förberedda för begränsad mängd (limited quantity) ska dessutom förses med märkning enligt Bild 2:2 (sida 27).","note":false}]},{"num":"2.7.4","title":"Dokumentationskrav för begränsade mängder","level":3,"paras":[{"text":"Sändningar med farligt gods som begränsad mängd (limited quantity) omfattas av bestämmelserna i 8 Dokumentation (sida 53) rörande godsdeklaration, acceptanskontroll och NOTOC.","note":false}]},{"num":"2.7.5","title":"Transportbestämmelser för begränsade mängder","level":3,"paras":[{"text":"Farligt gods som begränsad mängd (limited quantity) ska följa alla tillämpliga krav i 9 Hantering, lastning och transport (sida 65). Bild 2:2 Märkning begränsad mängd.","note":false}]}]},{"num":"3","title":"Klassificering","sections":[{"num":"3","title":"Klassificering","level":1,"paras":[]},{"num":"3.1","title":"Allmänna bestämmelser för klassificering","level":2,"paras":[{"text":"Farligt gods klassificeras utifrån sina faroegenskaper enligt klassificeringskriterierna i IATADGR, section 3.","note":false}]},{"num":"3.1.1","title":"Faroklasser och divisioner","level":3,"paras":[{"text":"Tabell 3:1 Farligt gods delas in i följande klasser och divisioner.. Klass eller divisionBeskrivning 1 Explosiva ämnen och föremål 2 Gaser 3 Brandfarliga vätskor","note":false}]},{"num":"3.1.2","title":"Farograd och förpackningsgrupper","level":3,"paras":[{"text":"Inom varje faroklass finns ett system för att gradera faran. När det gäller klass 1 och klass 2 så delas ämnen och föremål in i divisioner (för klass 1 så benämns dessa för riskgrupper på svenska) vilka sedan har en inbördes rangordning när det gäller grad av fara. För klasserna 3, 4.1, 4.2, 4.3, 5.1, 6.1, 8 och 9 graderas faran för ämnen genom så kallade förpackningsgrupper, vilka har följande betydelse: Förpackningsgrupp (PG) I Mycket farliga ämnen Förpackningsgrupp (PG) II Farliga ämnen Förpackningsgrupp (PG) III Mindre farliga ämnen Inom division 5.2 (organiska peroxider) så graderas faran genom gruppering av samlingsbenämningar från typ A till typ G och för division 6.2 och klass 7 tillämpas en indelning i kategorier beroende på grad av fara.","note":false}]},{"num":"3.1.3","title":"Klassificering av föremål som innehåller farligt gods","level":3,"paras":[{"text":"Vissa föremål har tilldelats ett eget UN-nummer och benämning och utifrån sina faror indelats i en klass eller division. För de föremål som inte har en officiell transportbenämning ska klassificering ske enligt kriterierna i IATA-DGR, 3.12. Detta avser dock inte föremål i klass 1, division 6.2 eller klass 7. Med föremål avses i detta sammanhang även maskiner, utrustning eller annan apparatur som innehåller en eller flera typer av farligt gods (eller rester därav) som är en integrerad del av föremålet, nödvändigt för dess funktion och som inte kan avlägsnas vid transport. En innerförpackning ska inte betraktas som ett föremål. Om mängden farligt gods inte överskrider begränsningarna i förpackningsinstruktion 962 så ska sådana föremål tilldelas UN 3363 och benämningen ”Dangerous goods in machinery” eller ”Dangerous goods in apparatus” och ingår då i klass 9. Om mängden farligt gods överskrider begränsningarna i förpackningsinstruktion 962 så ska föremålet tillordnas relevant klass utifrån de faror som gäller för det farliga gods som finns i föremålet. Utifrån denna klassificering tilldelas sedan föremålet tillämplig samlingsbenämning.","note":false}]},{"num":"3.2","title":"Bestämmelser inom respektive faroklass","level":2,"paras":[]},{"num":"3.2.1","title":"Klassificering av explosiva ämnen och föremål (klass 1)","level":3,"paras":[{"text":"Explosiva ämnen och föremål (klass 1) klassificeras enligt bestämmelserna i IATA-DGR, 3.1. Klassificering av explosiva ämnen och föremål sker enligt provningar och procedurer som anges i UN recommendations on the Transport of Dangerous Goods samt i UN Manual of Test and Criteria. Explosiva ämnen och föremål ska tillordnas en riskgrupp, enligt Tabell 3:2 (sida 30) och en samhanteringsgrupp enligt Tabell 3:3 (sida 31). Tabell 3:2 Definition av riskgrupper för explosiva ämnen och föremål . Riskgrupp Betydelse Riskgrupp 1.1 Ämnen och föremål med risk för massexplosion (en massexplosion är en explosion som påverkar så gott som hela lasten praktiskt taget samtidigt). Riskgrupp 1.2 Ämnen och föremål med risk för splitter och kaststycken men inte för massexplosion. Riskgrupp 1.3 Ämnen och föremål med risk för brand, och mindre risk för tryckvåg, splitter och kaststycken men inte för massexplosion, (a) vars förbränning ger upphov till av sevärd strålningsvärme, eller (b) vilka brinner efter varandra och ger upphov till mindre verkningar genom tryckvåg eller splitter och kaststycken. Riskgrupp 1.4 Ämnen och föremål med endast obetydlig explosionsrisk i händelse av antändning eller initiering under transport. Verkningarna är i stort sett begränsade till kollit och det kan inte förväntas splitter av betydande storlek eller utbredning. Brand utifrån får inte förorsaka praktiskt taget samtidig explosion av så gott som hela kollits innehåll. Riskgrupp Betydelse Riskgrupp 1.5 Mycket okänsliga ämnen med risk för massexplosion men med mycket liten sannolikhet för initiering eller för övergång från brand till detonation under normala transportförhållanden. Ett minimikrav är att de inte får explodera vid test med yttre brand. Riskgrupp 1.6 Extremt okänsliga föremål utan risk för massexplosion. Föremålen innehåller till övervägande del extremt okänsliga detonerande ämnen och där sannolikheten för oavsiktlig antändning eller utbredning är försumbar.","note":false},{"text":"Faran med föremål i riskgrupp 1.6 är begränsad till explosion av enstaka föremål. Inom klass 1 så betraktas riskgrupp 1.1 som farligast, därefter kommer farlighetsgraden inom klass 1 i följande ordning, riskgrupp 1.5, 1.2, 1.3, 1.6 och sist 1.4. Tabell 3:3 Definition av samhanteringsgrupper för explosiva ämnen och föremål . SamhanteringsgruppBetydelse A Tändämne B Föremål som innehåller tändämne och färre än två effektiva säkringsanordningar. Vissa föremål såsom sprängkapslar, apterade sprängkapslar och tändhattar ingår, även om de inte innehåller något tändämne C Krut (utom svartkrut) eller annat deflagrerande explosivämne eller föremål som innehåller sådant explosivämne. D Sprängämne, svartkrut eller föremål som innehåller sprängämne, i samtliga fall utan tändsystem och utan drivladdning, eller föremål som innehåller tändämne och som har två eller fler effektiva säkringsanordningar. E Föremål som innehåller sprängämne utan tändsystem, men med drivladdning (annan än sådan som innehåller brandfarlig vätska eller gel eller hypergola vätskor). F Föremål som innehåller sprängämne med eget tändsystem, med drivladdning (annan än sådan som innehåller brandfarlig vätska eller gel eller hypergola vätskor) eller utan drivladdning. G Pyroteknisk sats, eller föremål innehållande pyroteknisk sats, eller föremål som innehåller både explosivämne och lyssats, brandsats, tårgassats eller röksats (utom föremål som aktiveras av vatten eller innehåller vit fosfor, fosfider, pyrofort ämne, brandfarlig vätska eller gel eller hypergola vätskor). H Föremål som innehåller både explosivämne och vit fosfor. J Föremål som innehåller både explosivämne och brandfarlig vätska eller gel. K Föremål som innehåller både explosivämne och giftigt kemiskt medel. L Explosivämne eller föremål som innehåller explosivämne med särskild risk (t ex beroende på aktivering vid kontakt med vatten eller på närvaro av hypergola vätskor, fosfider eller pyrofort ämne) som kräver separation av varje enskilt slag. N Föremål som endast innehåller extremt okänsliga detonerande ämnen. S Ämnen eller föremål så förpackade eller utformade att all verkan genom vådatändning, oavsiktlig initiering eller oavsiktlig funktion begränsas till kollit, såvida inte kollit har skadats av brand. I så fall är dock all verkan av tryckvåg eller splitter och kaststycken så begränsad att brandbekämpning eller andra nödåtgärder i kollits omedelbara närhet inte väsentligt inskränks eller förhindras.","note":true}]},{"num":"3.2.2","title":"Klassificering av gaser (klass 2)","level":3,"paras":[{"text":"Gaser (klass 2) klassificeras enligt kriterier i IATA-DGR, 3.2. Gaser delas in i följande tre divisioner beroende på dess egenskaper: Division 2.1 Brandfarliga gaser Division 2.2 Inte giftiga, inte brandfarliga gaser Division 2.3 Giftiga gaser. Inom klass 2 så betraktas division 2.3 som farligast därefter kommer division 2.1 och minst farlig anses division 2.2.","note":false}]},{"num":"3.2.3","title":"Klassificering av brandfarliga vätskor (klass 3)","level":3,"paras":[{"text":"Brandfarliga vätskor är flytande ämnen med en flampunkt lägre än 60 ºC, kriterier för klassificering återfinns i IATA-DGR, 3.3. Farlighetsgraden inom klass 3 bestäms genom förpackningsgruppen.","note":false}]},{"num":"3.2.4","title":"Klassificering av brandfarliga fasta ämnen, sjävreaktiva ämnen, självantändande ämnen samt ämnen som utvecklar brandfarlig gas vid kontakt med vatten (klass 4)","level":3,"paras":[{"text":"Klass 4 är en omfattande klass och delas in i tre divisioner eller underklasser: Division 4.1 Brandfarliga fasta ämnen och självreaktiva ämnen. Division 4.2 Självantändande ämnen Division 4.3 Ämnen som utvecklar farlig gas vid kontakt med vatten Ämnen och föremål ska klassificeras mot kriterierna i IATA-DGR, 3.4. Förutom självreaktiva ämnen i division 4.1 så bestäms farlighetsgraden för ämnen inom klass 4 genom förpackningsgruppen. Självreaktiva ämnen i division 4.1 delas in i grupper beroende på dess farlighet. Grupperna benämns typ A-typ F, där typ A är farligast och typ F är minst farlig. IATA-DGR, appendix C.1 återger specifika ämnen med hänvisning till vilken grupp de ska tillhöra.","note":false}]},{"num":"3.2.5","title":"Klassificering av oxiderande ämnen och organiska peroxider (klass 5)","level":3,"paras":[{"text":"Kriterier för klassificering av klass 5, finns i IATA-DGR, 3.5 och avser division 5.1 Oxiderande ämnen samt division 5.2 Organiska peroxider. För oxiderande ämnen i division 5.1 bestäms farlighetsgraden genom den förpackningsgrupp som ämnet anses tillhöra. När det gäller organiska peroxider så delas dessa in i grupper beroende på dess farlighet. Grupperna benämns typ A-typ F, där typ A är farligast och typ F är minst farlig. IATA-DGR, appendix C.2 återger specifika ämnen med hänvisning till vilken grupp de ska tillhöra.","note":false}]},{"num":"3.2.6","title":"Klassificering av giftiga och smittförande ämnen (klass 6)","level":3,"paras":[{"text":"Klass 6 delas in i två divisioner eller underklasser, giftiga ämnen (division 6.1) och smittförande ämnen (division 6.2). Klassificering ska ske enligt kriterierna i IATA-DGR, 3.6. För giftiga ämnen i division 6.1 bestäms farlighetsgraden genom den förpackningsgrupp som ämnet anses tillhöra. När det gäller smittförande ämnen så delas dessa in i två kategorier (kategori A och kategori B) beroende på dess farlighetsgrad. Kategori A bedöms som farligast då den avser sådana ämnen som vid smitta kan förorsaka dödlig utgång eller permanent invaliditet.","note":false}]},{"num":"3.2.7","title":"Klassificering av radioaktiva ämnen (klass 7)","level":3,"paras":[{"text":"Radioaktiva ämnen (klass 7) klassificeras enligt IATA-DGR, 10.3. Vid klassificering av radioaktiva ämnen så tas hänsyn både till kollits innehåll och farorna på utsidan av transportfärdigt kolli. Detta genom att man delar in kollin i typer och kategorier. När det gäller kategorier så delas dessa in i I-vit, II-gul och III-gul. Vilken kategori ett kolli tillhör beror på strålningsnivån mätt på kollits utsida samt på 1 meters avstånd. III-gul är den kategori som gäller för högsta tillåtna strålningsnivåer och I-vit för de lägre. Om strålningsnivån inte överstiger 5µSv/h på utsidan av kollit samt att aktivitetsnivån för gällande radionuklid inte överskrids kan kollit också transporteras som undantaget kolli.","note":false}]},{"num":"3.2.8","title":"Klassificering av frätande ämnen (klass 8)","level":3,"paras":[{"text":"Frätande ämnen ska tilldelas klass 8 och kriterierna för klassificering återfinns i IATA-DGR, 3.8. Baserat på resultat från tester delas frätande ämnen in i förpackningsgrupper som anger grad av fara.","note":false}]},{"num":"3.2.9","title":"Klassificering av övriga farliga ömnen och föremål (klass 9)","level":3,"paras":[{"text":"Till klass 9 hänförs ämnen och föremål som inte kan tilldelas någon annan klass. IATA-DGR, 3.9 återger de olika ämnen och föremål som ingår i denna klass . För ämnen inom klass 9 så bestäms farlighetsgraden genom den förpackningsgrupp som ämnet tilldelats.","note":false}]}]},{"num":"4","title":"Identifiering","sections":[{"num":"4.1","title":"Grundläggande bestämmelser om identifiering","level":2,"paras":[]},{"num":"4.2","title":"Ämnesförteckning farligt gods","level":2,"paras":[]},{"num":"4.3","title":"Ämnesförteckning i alfabetisk ordning","level":2,"paras":[]},{"num":"4","title":"Identifiering","level":1,"paras":[{"text":"4.1 Grundläggande bestämmelser om identifiering","note":false}]},{"num":"4.1.1","title":"UN-nummer och officell transportbenämning","level":3,"paras":[{"text":"Farligt gods identifieras genom det UN-nummer (fyra siffror) och den officiella transportbenämning (Proper shipping name) som ämnet eller föremålet tilldelats. De ämnen och föremål som normalt hanteras inom Försvarsmakten finns med i den ämnesförteckning som återfinns 4.2 Ämnesförteckning farligt gods (sida 36). Om ämnet inte återfinns i ämnesförteckningen ska uppgifter hämtas i ämnesförteckningen i IATA-DGR, 4.2 som då anger villkor och begränsningar.","note":false},{"text":"För ett UN-nummer, kan det förekomma olika officiella transportbenämningar (proper shipping names) och/eller olika förpackningsgrupper. Det är viktigt att härleda rätt transportbenämning och rätt förpackningsgrupp till ämnet eller föremålet så att det blir en korrekt identifiering enligt ämnesförteckningarna.","note":true}]},{"num":"4.1.2","title":"Gruppering av officiell transportbenämning","level":3,"paras":[{"text":"Vid identifiering av farligt gods enligt ovanstående förekommer följande typer av officiella transportbenämningar:","note":false},{"text":"1. Individuella benämningar för väldefinierade ämnen eller föremål, t.ex. UN 1090 ACETONE UN 1220 KEROSENE","note":false},{"text":"2. Gruppbenämningar för en väldefinierad grupp av ämnen eller föremål, som inte är ”N.O.S.-benämningar”, t.ex. UN 1263 PAINT UN 1133 ADHESIVES","note":false},{"text":"3. Specifika ”N.O.S.-benämningar”, som omfattar en grupp ämnen eller föremål av en viss kemisk eller teknisk beskaffenhet, t.ex. UN 1987 ALCOHOLS, N.O.S. UN 3283 SELENIUM COMPOUND, SOLID, , N.O.S.","note":false},{"text":"4. Allmänna ”N.O.S.-benämningar” som omfattar en grupp ämnen eller föremål som har en eller flera farliga egenskaper och inte är benämnda på annat sätt, t.ex. UN 1993 FLAMMABLE LIQUID, N.O.S. UN 1760 CORROSIVE LIQUID, N.O.S.","note":false}]},{"num":"4.1.3","title":"Teknisk beskrivning till officiell transportbenämning","level":3,"paras":[{"text":"Vissa transportbenämningar ska kompletteras med en teknisk beskrivning inom parentes såvida ingen nationell lag eller internationell överenskommelse förbjuder exakt beskrivning av ämnen som är reglerade. Dessa markeras i ämnesförteckningarna med symbolen ”*” direkt efter den officiella transportbenämningen. De tekniska benämningarna ska anges inom parentes omedelbart efter den officiella transportbenämningen. Se närmare bestämmelser i IATA-DGR, 4.1.2 (d).","note":false},{"text":"Uppgifter om ett ämnes klassificering och dess officiella transportbenämning kan normalt erhållas från ämnets eller föremålets säkerhetsdatablad (SDB). 4.2 Ämnesförteckning farligt gods Ämnesförteckningen i Bilaga 3 Ämnesförteckning sorterad efter UN-nummer (sida 87) innehåller fjorton (14) kolumner (A-N) vilka innehåller följande information: Kolumn A Anger det UN-nummer som ämnet eller föremålet tilldelats enligt Förenta nationernas (UN) klassificeringssystem för farligt gods. Kolumn B Anger den officiella transportbenämningen som ämnet eller föremålet tilldelats, på engelska. Vissa UN nummer har fler än en officiell transportbenämning, I sådana fall ska den benämning som bäst överensstämmer med ämnet eller föremålet användas. För de poster i ämnesförteckningen som anger en ”*” ska den officiella transportbenämningen kompletteras med godsets tekniska benämning (se även 4.1.3 Teknisk beskrivning till officiell transportbenämning (sida 36)). För explosiva ämnen och föremål i klass 1 får beskrivningen av det farliga godset kompletteras med ytterligare beskrivning som anger handelsnamn eller militära benämningar. Kolumn C Denna kolumn anger ämnets eller föremålets klassificering. För klass 1 anges fullständig klassificeringskod (risk- och samhanteringsgrupp). Kolumn D I denna kolumn anges eventuell sekundärfara som också föranleder etikettering på kolli och som dessutom ska anges på godsdeklarationen. Kolumn E Anger eventuell förpackningsgrupp. Förekommer endast för ämnen i klass 3, 4, 5.1, 6, 8 och 9. Kolumn F Denna kolumn anger ”E-koden” som är begränsande om ämnet ska iordningsställas som reducerad mängd (excepted quantity). Innebörden av koden anges i 2.6 Farligt gods som reducerad mängd (Excepted Quantity) (sida 25). Kolumn G Anger den förpackningsinstruktion som gäller för avsett ämne eller föremål då det ska iordningsställas som begränsad mängd (limited quantity). Förpackningsinstruktioner för ”limited quantity” inleds alltid med prefixet ”Y” och återges i sin helhet i IATA-DGR, section 5. Om det i denna kolumn anges koden ”Förbjudet” så innebär det att det inte är tillåtet att transportera ämnet eller föremålet som begränsad mängd (limited quantity). Kolumn H Anger högsta tillåtna nettomängd per förpackning då godset iordningsställts som limited quantity enligt gällande packinstruktion. I de fall mängden anges som 30 kg G avser begränsningen bruttovikten 30 kg och inte nettomängden. Om det i denna kolumn anges koden ”Förbjudet” så innebär det att det inte är tillåtet att transportera ämnet eller föremålet som begränsad (limited quantity). Kolumn I Anger förpackningsinstruktion gäller för avsett ämne eller föremål då det ska iordningsställas för transport med passagerarflyg. En lista över alla förpackningsinstruktioner och var de återges i sin helhet framgår av Tabell B7:1 (sida 193). Om det i denna kolumn anges koden ”Förbjudet” så innebär det att det inte är tillåtet att transportera ämnet eller föremålet på passagerarflyg. Kolumn J Anger högsta tillåtna nettomängd per förpackning då godset iordningsställts för transport med passagerarflyg enligt gällande packinstruktion. För klass 1 avses nettovikt explosivt ämne (NEM). Om det i denna kolumn anges koden ”Förbjudet” så innebär det att det inte är tillåtet att transportera ämnet eller föremålet med flyg. Kolumn K Anger de förpackningsinstruktion gäller för avsett ämne eller föremål då det ska iordningsställas för transport som begränsas till endast fraktflyg (CAO). En lista över alla förpackningsinstruktioner och var de återges i sin helhet framgår av Tabell B7:1 (sida 193). Om det i denna kolumn anges koden ”Förbjudet” så innebär det att det inte är tillåtet att transportera ämnet eller föremålet med flyg. Kolumn L Anger högsta tillåtna nettomängd per förpackning då godset iordningsställts för transport som begränsas endast till fraktflyg (CAO) enligt gällande packinstruktion. För klass 1 avses nettovikt explosivt ämne (NEM). Om det i denna kolumn anges koden ”Förbjudet” så innebär det att det inte är tillåtet att transportera ämnet eller föremålet med flyg. Kolumn M Denna kolumn visar om det finns någon särbestämmelse (Special Provision) för det aktuella ämnet. Särbestämmelserna återges i sin helhet i 4.4 Särbestämmelser (Special Provisions) (sida 38). Kolumn N Anger ERG-koden för det explosiva ämnet el föremålet och syftar till att ge besättningen information om åtgärder i händelse av olycka eller tillbud med det aktuella ämnet/föremålet. ERG-koden förklaras närmare i Bilaga 5 ERG-koder (sida 169). Tabellen återfinns i Bilaga 3 Ämnesförteckning sorterad efter UN-nummer (sida 87). 4.3 Ämnesförteckning i alfabetisk ordning Ämnesförteckningen i Bilaga 4 Ämnesförteckning i alfabetisk ordning (sida 153) består av motsvarande ämnen som finns i Tabell B3:1 (sida 87), men här anges de i alfabetisk ordning och hänvisar därigenom till rätt UN-nummer.","note":true}]},{"num":"4.4","title":"Särbestämmelser (Special Provisions)","level":2,"paras":[{"text":"I Bilaga 6 Särbestämmelser (Special Provisions) (sida 173) återfinns alla tillämpliga särbestämmelser som finns upptagna i Tabell B3:1 (sida 87) kolumn M, även de särbestämmelser som kommer från IATA. Inom parantes vid respektive särbestämmelse anges beteckningen enligt IATA.","note":false}]}]},{"num":"5","title":"Förpackningskrav","sections":[{"num":"5.1","title":"Allmänt","level":2,"paras":[]},{"num":"5.2","title":"Förpackningar som avviker från gällande förpackningsinstruktion","level":2,"paras":[]},{"num":"5","title":"Förpackningskrav","level":1,"paras":[{"text":"5.1 Allmänt Avsändaren ansvarar för att godset förpackas enligt gällande förpackningsinstruktion och att mängden farligt gods per förpackning inte överstiger tillämpliga begränsningar. 5.2 Förpackningar som avviker från gällande förpackningsinstruktion Farligt gods som är förpackat i en förpackning som inte överensstämmer med förpackningsinstruktionen får endast transporteras om transporten genomförs med stöd av 2.4 Transport under särskilda förhållanden (sida 21) eller om det framgår av en särbestämmelse (se 4.4 Särbestämmelser (Special Provisions) (sida 38)).","note":false}]},{"num":"5.3","title":"Overpack","level":2,"paras":[{"text":"För att underlätta hantering får avsändaren stuva flera förpackningar med farligt gods i en overpack, t.ex. lastpall med pallkragar, under förutsättning att följande villkor är uppfyllda:","note":false},{"text":"1. Varje förpackning i en overpack ska vara korrekt iordningsställd, märkt och etiketterad som att kunna hanteras som enskilt kolli. Förpackningarna ska vara säkrade mot rörelse inuti overpacken.","note":false},{"text":"2. Overpacken får inte innehålla gods som kan reagera farligt med varandra eller som kräver separation enligt Tabell 9:3 (sida 72) eller Tabell 9:4 (sida 73). En overpack får endast innehålla gods av olika slag som ger markering ”grön ruta” i Tabell 9:3 (sida 72) eller Tabell 9:4 (sida 73).","note":false},{"text":"En lastbärare ska inte betraktas som en ”overpack”. Bestämmelser om stuvning av lastbärare återfinns i 9 Hantering, lastning och transport (sida 65).","note":true}]},{"num":"5.4","title":"Transport av farligt gods i tankcontainer eller IBC-behållare","level":2,"paras":[{"text":"Farligt gods får transporteras i tank, tankcontainer eller IBC-behållare endast efter godkännande från FSI. Vid ansökan om godkännande för användande av tank, tankcontainer eller IBC-behållare ska följande anges:","note":false},{"text":"1. Vilken specifik typ av tank, tankcontainer eller IBC-behållare som avses, vilket innefattar hänvisning till dokument för godkännande enligt IMDG-koden och/eller ADR, där bl.a. godkännandemärkning och dimensioner ska framgå.","note":false},{"text":"2. Uppgift om innehåll (UN-nummer, klass, eventuell klassificeringskod, mängd).","note":false},{"text":"3. Uppgift om typ av luftfartyg som är avsett att användas för transporten, samt uppgifter om transportväg för den transport eller de transporter som avses.","note":false}]},{"num":"5.5","title":"Tomma rengjorda förpackningar och oklassade kemikalier","level":2,"paras":[]},{"num":"5.5.1","title":"Allmänt","level":3,"paras":[{"text":"Med undantag av vad som anges i detta avsnitt så omfattas inte tömda rengjorda förpackningar eller oklassade kemikalier av övriga bestämmelser i HFFG.","note":false}]},{"num":"5.5.2","title":"Kontroll av tömda förpackningar eller behållare","level":3,"paras":[{"text":"Avsändaren ska kontrollera att de förpackningar som innehållit farligt gods är tömda och om det förekommer rester - även spårmängder, ska förpackningen rengöras fullständigt. Om det inte är möjligt att rengöra förpackningen ska den hanteras som farligt gods och följa bestämmelserna i HFFG. En förpackning anses vara tömd och rengjord om:","note":false},{"text":"1. det farliga ämnet/föremålet har avlägsnats från behållaren och det finns ingen möjlighet till att det finns några rester av farligt gods (t ex bensin), och","note":false},{"text":"2. förpackningen är rengjord och övriga lämpliga åtgärder vidtagits så att aktuella risker är obetydliga. För komprimerade gaser anses förpackningen inte längre omfattas av bestämmelserna om det är en gas i division 2.2, utan sekundärfara samt att trycket i behållaren inte är högre än 2 bar.","note":false}]},{"num":"5.5.3","title":"Åtgärder för tömda och rengjorda förpackningar","level":3,"paras":[{"text":"Avsändaren bör vidta de åtgärder som anges nedan för att förhindra att tömda och rengjorda förpackningar stannar upp i en transport på grund av att de misstänks innehålla farligt gods. Lämpliga åtgärder är:","note":false},{"text":"1. säkerställa att förpackningarna är fria från skador, och","note":false},{"text":"2. skydda ventiler på gasflaskor och andra tryckkärl, samt","note":false},{"text":"3. Informera verksamhetsutövaren genom att märka kollit med texten ”EMPTY CLEAN - NOT RESTRICTED”. Även transporthandlingarna bör innehålla en sådan notering.","note":false}]},{"num":"5.5.4","title":"Åtgärder för oklassificerade kemikalier","level":3,"paras":[{"text":"Kemikalier eller föremål som kan misstänkas vara farligt gods, men som inte klassificeras som farligt gods enligt dessa bestämmelser ska betraktas som ”Chemicals/Articles -Not restricted”. För sådana sändningar bör avsändaren vidta följande åtgärder för att förhindra de stannar upp i en transport på grund av att de misstänks vara farligt gods. Lämpliga åtgärder är att:","note":false},{"text":"1. säkerställa att förpackningarna är fria från skador och klarar normala transportpåkänningar, liksom att","note":false},{"text":"2. informera verksamhetsutövaren, genom att märka kollit med texten ”CHEMICALS/ARTICLES - NOT RESTRICTED”. Även transporthandlingarna bör innehålla en sådan notering.","note":false}]},{"num":"5.6","title":"Särskilda bestämmelser för förpackningar innehållande klass","level":2,"paras":[{"text":"innehållande klass 1 Såvida inte annat anges i gällande förpackningsinstruktion så ska explosiva ämnen och föremål i klass 1 förpackas i typgodkända förpackningar som uppfyller bestämmelserna för förpackningsgrupp II (typgodkännandemärkning ”Y”). Explosiva ämnen och föremål som enligt en förpackningsinstruktion får transporteras oförpackade får också transporteras i förpackningar som inte är typgodkända.","note":false}]},{"num":"5.7","title":"Förpackningsinstruktioner","level":2,"paras":[{"text":"I Bilaga 7 Förpackningsinstruktioner (sida 193) återfinnnges de förpackningsinstruktioner för explosiva ämnen och föremål som det hänvisas till under kolumnerna I och K i Tabell B3:1 (sida 87).","note":false}]}]},{"num":"6","title":"Godkända förpackningar, tankar och IBC-behållare","sections":[{"num":"6.1","title":"Godkända förpackningar","level":2,"paras":[]},{"num":"6.2","title":"Tankar och IBC-behållare","level":2,"paras":[]},{"num":"6","title":"Godkända förpackningar, tankar och IBC-behållare","level":1,"paras":[{"text":"6.1 Godkända förpackningar","note":false}]},{"num":"6.1.1","title":"Allmänt","level":3,"paras":[{"text":"Såvida inget annat anges ska förpackningar för farligt gods vara godkända enligt de kriterier som anges i IATA-DGR, Section 6.","note":false}]},{"num":"6.1.2","title":"Märkning av typgodkända förpackningar","level":3,"paras":[{"text":"Typgodkända förpackningar ska vara försedda med varaktigt fäst märkning som visar att förpackningen provats, kontrollerats och godkänts enligt fastställda kriterier. Tryckkärl för klass 2, förpackningar för smittförande ämnen, kategori A (division 6.2) samt förpackningar för radioaktiva ämnen (klass 7) har särskilda kriterier vilket beskrivs närmare i delavsnitt Bestämmelser om typgodkännande av förpackningar återfinns i IATA-DGR, 6.1. I detta delavsnitt återges en sammanfattning av den information som ska framgå av typgodkännandemärkningen. Märkningen ska innehålla den information som anges i nr. 1 (sida 43) – nr. 8 (sida 44) nedan enligt Bild 6:1 (sida 43) och Bild 6:2 (sida 43): Bild 6:1 Exempel på märkning av en förpackning avsedd att innehålla fasta ämnen eller innerförpackningar.. Bild 6:2 Exempel på märkning av enkelförpackning avsedd att innehålla vätskor..","note":false},{"text":"1. Symbol för godkänd förpackning. För metallförpackningar kan symbolen bestå av bokstäverna ”UN” präglade som versaler.","note":false},{"text":"2. Typ av förpackning i form av en siffer- och bokstavskod som visar förpackningstyp och vilket material som den är tillverkad av (t.ex. 4G=Låda av papp). Se IATA-DGR, 6.0.3 för ytterligare information.","note":false},{"text":"3. Beteckningar X, Y eller Z visar förpackningsgrupp (nivå) som förpackningen är godkänd för. Såvida inte annat anges i förpackningsbestämmelserna i 5 Förpackningskrav (sida 39), gäller följande: ○ X innebär att förpackningen är godkänd enligt förpackningsgrupp I, och får användas för ämnen klassade som förpackningsgrupp I, II eller III, bokstav ○ Y innebär att förpackningen är godkänd enligt förpackningsgrupp II, och får användas för ämnen klassade som förpackningsgrupp II eller III, bokstav ○ Z innebär att förpackningen är godkänd enligt förpackningsgrupp III, och får användas för ämnen klassade som förpackningsgrupp III.","note":false},{"text":"4. I tillägg till den bokstav som anger förpackningsgruppen enligt nr. 3 (sida 44) ska det anges ○ för enkelförpackningar avsedda att innehålla vätskor, den högsta relativa densiteten (kg/l) på den vätska som förpackningen är godkänd för. ○ för enkelförpackningar av fasta ämnen eller ytterförpackningar avsedda att innehålla innerförpackningar, den högsta bruttovikten i kg som förpackningen är godkänd för.","note":false},{"text":"5. Beroende på typ av förpackning anges följande: ○ för enkelförpackningar avsedda att innehålla vätskor, det tryck som den provats för (avrundat nedåt till närmaste 10 kPa) ○ bokstaven ”S” för enkelförpackningar avsedda att innehålla fasta ämnen eller ytterförpackningar avsedda att innehålla innerförpackningar.","note":false},{"text":"6. Tillverkningsår. Fat och dunkar av plast har en längsta tillåten livslängd om fem år räknat från tillverkningen. Månaden visas normalt i form av särskild märkning, enligt Bild 6:3 (sida 44)","note":false},{"text":"7. Nation där förpackningens certifikat är utfärdat.","note":false},{"text":"8. Namnet på tillverkare eller annan unik identifikation kopplad till förpackningscertifikatet. Bild 6:3 Exempel på ”datummärkning” för plastdunkar och plastfat..","note":false}]},{"num":"6.1.3","title":"Märkning av typgodkända tryckkärl för klass","level":3,"paras":[{"text":"Tryckkärl för gaser ska provas, kontrolleras, godkännas och märkas enligt kraven i IATADGR, 6.4 eller ADR, 6.2.","note":false}]},{"num":"6.1.4","title":"Märkning av typgodkända förpackningar för klass 6.2, kategori A","level":3,"paras":[{"text":"Förpackningar avsedda för smittförande ämnen, kategori A (division 6.2) ska provas, kontrolleras, godkännas och märkas enligt kraven i IATA-DGR, 6.5. I detta delavsnitt återges en sammanfattning av den information som ska framgå av typgodkännandemärkningen. 6 Godkända förpackningar, tankar och IBC-behållare Märkningen ska innehålla den information som anges i nr. 1 (sida 45) – nr. 6 (sida 45) nedan enligt Bild 6:4 (sida 45). Bild 6:4 Exempel på märkning av typgodkänd förpackning för klass 6.2, kategori A.","note":false},{"text":"1. Symbol för godkänd förpackning. För metallförpackningar kan symbolen bestå av bokstäverna ”UN” präglade som versaler.","note":false},{"text":"2. Typ av förpackning i form av en siffer- och bokstavskod som visar typ av förpackning och vilket material den är tillverkad av (t.ex. 4G=Låda av papp). Se IATA-DGR, 6.0.3 för ytterligare information.","note":false},{"text":"3. Texten ”class 6.2”","note":false},{"text":"4. Tillverkningsår.","note":false},{"text":"5. Nationen där förpackningens certifikat är utfärdat.","note":false},{"text":"6. Namn på tillverkare eller annan unik identifikation kopplad till certifikatet.","note":false}]},{"num":"6.1.5","title":"Märkning av godkända förpackningar avsedda för radioaktiva ämnen klass","level":3,"paras":[{"text":"radioaktiva ämnen klass 7 Förpackningar avsedda för radioaktiva ämnen (klass 7) ska provas, kontrolleras, godkännas och märkas enligt kraven i IATA-DGR, 10.6. och 10.7. 6.2 Tankar och IBC-behållare Tank, tankcontainer eller IBC-behållare får endast användas för transport av farligt gods med flyg efter godkännande från FSI. Vid prövning av en ansökan ska de tekniska kraven i regelverken ADR och IMDG-koden samt bestämmelserna enligt ICAO-TI Supplement, part S-4, chapter 12, beaktas. 6 Godkända förpackningar, tankar och IBC-behållare 7 Märkning och etikettering","note":false}]}]},{"num":"7","title":"Märkning och etikettering","sections":[{"num":"7","title":"Märkning och etikettering","level":1,"paras":[]},{"num":"7.1","title":"Märkning av förpackningar","level":2,"paras":[]},{"num":"7.1.1","title":"Allmänt om märkning","level":3,"paras":[{"text":"Märkning ska uppfylla de krav rörande prestanda och tydlighet som framgår av IATA-DGR, 7.1. För tömda och rengjorda förpackningar/kollin gäller dock inte bestämmelserna i kapitel 7.","note":false}]},{"num":"7.1.2","title":"Uppgifter som ska anges på förpackningen","level":3,"paras":[{"text":"Avsändaren ansvarar för att förpackningar förses med följande märkning:","note":false},{"text":"1. UN-nummer, föregånget av bokstäverna ”UN”,","note":false},{"text":"2. officiell transportbenämning på engelska (proper shipping name),","note":false},{"text":"3. förpackningens bruttovikt, samt","note":false},{"text":"4. nettomängd farligt gods. För klass 1 anges nettomängd explosivt ämne (NEM). I de fall bruttovikten utgör begränsning per förpackning enligt eller, om tillämpligt, IATA-DGR, 4.2 behöver inte nettomängden anges.","note":false},{"text":"5. Om tillämpligt, märkning enligt IATA-DGR, 7.1.4.1 (d) - (h)","note":false}]},{"num":"7.1.3","title":"Märkning av kollin innehållande litiumbatterier enligt särbestämmelse SP","level":3,"paras":[{"text":"särbestämmelse SP5 Kollin innehållande litiumbatterier som uppfyller villkoren i särbestämmelse SP5 omfattas inte av märkningskraven i 7.1.2 Uppgifter som ska anges på förpackningen (sida 47), men ska vara försedd med märkning enligt Bild 7:1 (sida 48). Märkningen ska kompletteras med tillämpligt UN-nummer och ett telefonnummer till en person eller organisation som kan ge mer upplysningar om batteriet. Bild 7:1 ”Märkning för kollin med litiumbatterier enligt särbestämmelse ”SP5”.","note":false}]},{"num":"7.2","title":"Etikettering av förpackningar","level":2,"paras":[]},{"num":"7.2.1","title":"Allmänt","level":3,"paras":[{"text":"Avsändaren ansvarar för att förpackningar förses med etiketter enligt detta avsnitt och att dessa anbringas såsom anges i IATA-DGR, 7.2. Alla etiketter ska uppfylla de krav på prestanda och tydlighet som framgår av IATA-DGR, 7.2.","note":false}]},{"num":"7.2.2","title":"Faroetiketter","level":3,"paras":[{"text":"Såvida inte annat anges ska varje förpackning vara försedd med faroetiketter motsvarande huvud- och sekundärfara för det eller de ämnen eller föremål som finns i förpackningen. Faraoetiketter ska vara av minst storleken 10 x 10 cm. Tabell 7:1 Faroetiketter. Bild 7:2 Etikett 1. Bild 7:3 Etikett 1.4. Bild 7:4 Etikett 1.5. Bild 7:5 Etikett 1.6. Bild 7:6 Etikett 2.1. Bild 7:7 Etikett 2.2. Bild 7:8 Etikett 2.3. Bild 7:9 Etikett 3. Bild 7:10 Etikett 4.1. Bild 7:11 Etikett 4.2. Bild 7:12 Etikett 4.3. Bild 7:13 Etikett 5.1. Bild 7:14 Etikett 5.2. Bild 7:15 Etikett 6.1. Bild 7:16 Etikett 6.2. Bild 7:17 Etikett 7 (I-VIT). Bild 7:18 Etikett 7 (II-GUL). Bild 7:19 Etikett 7 (IIIGUL). Bild 7:20 Etikett 8. Bild 7:21 Etikett 9. Bild 7:22 Etikett 9 (litiumbatterier).","note":false}]},{"num":"7.2.3","title":"Hanteringsetiketter","level":3,"paras":[{"text":"Förpackningar ska vara försedda med tillämpliga hanteringsetiketter enligt IATA-DGR, 7.2, såsom:","note":false},{"text":"1. ”Riktningspilar”, vilket krävs på ytterförpackningar och overpack som innehåller innerförpackningar med farlig gods i vätskeform. Riktningspilar ska anges på två motstående sidor av förpackningen.","note":false},{"text":"2. ”CAO-etikett”, som måste anges på förpackningar som innehåller sådana mängder, och/ eller i övrigt är begränsade enligt packinstruktionerna för att endast få transporteras med fraktflyg.","note":false},{"text":"3. ”Cryogenic liquid”, vilket är en hanteringsetikett som ska anbringas på kollin som innehåller kylda, kondenserade gaser enligt förpackningsinstruktion 202.","note":false},{"text":"4. ”Keep Away From Heat”, vilken ska anges på kollin som innehåller organiska peroxider eller självreaktiva ämnen.","note":false},{"text":"5. ”Magnetiskt material”, som ska anges på kollin som uppfyller kriterierna för magnetiskt material. Bild 7:23 ”Riktningspilar”. Bild 7:24 ”CAO-etikett”. Bild 7:25 ”Exempel på märkning av förpackningar med farligt gods”.","note":false}]},{"num":"7.3","title":"Märkning och etikettering av overpack","level":2,"paras":[{"text":"Såvida inte all märkning och etikettering på förpackningar i en overpack är synliga utifrån ska varje overpack som innehåller farligt gods, förses med följande information:","note":false},{"text":"1. Texten ”OVERPACK”,","note":false},{"text":"2. UN nummer, föregånget av prefixet \"UN\" för varje ämne/föremål inuti avsedd overpack,","note":false},{"text":"3. officiell transportbenämning (proper shipping name) på engelska för varje ämne/föremål inuti avsedd overpack,","note":false},{"text":"4. bruttovikten på färdigställd overpack,","note":false},{"text":"5. nettomängd, för varje ämne/föremål. För explosiva ämnen och föremål (klass 1) anges nettomängd explosivt ämne (NEM). Om en overpack innehåller mer än ett UN-nummer bör total mängd anges för varje UN-nummer,","note":false},{"text":"6. all tillämplig märkning som krävs enligt IATA-DGR, 7.1.4.1 (e) - (i),","note":false},{"text":"7. eventuell särskild märkning med hanteringsinstruktioner som anges på förpackningarna inuti avsedd overpack, och","note":false},{"text":"8. alla tillämpliga faro- och hanteringsetiketter som anges på förpackningarna inuti avsedd overpack. Om sändningen består av mer än en overpack, ska varje overpack dessutom märkas med en unik ID-märkning, enligt valfri metod, och som motsvarar den identitet som anges på godsdeklarationen.","note":false},{"text":"Endast en faroetikett krävs för varje faroklass/division som finns i avsedd overpack. Bild 7:26 ”Exempel på märkning av overpack”. 8 Dokumentation","note":true}]}]},{"num":"8","title":"Dokumentation","sections":[{"num":"8","title":"Dokumentation","level":1,"paras":[]},{"num":"8.1","title":"Allmänt","level":2,"paras":[{"text":"Såvida inte annat anges i dessa bestämmelser ska beställaren säkerställa att dokumentation som anges nedan överlämnas till verksamhetsutövaren då en sändning lämnas in för transport.","note":false},{"text":"1. Godsdeklaration, se 8.2 Godsdeklaration (sida 53),","note":false},{"text":"2. Checklista över genomförd acceptanskontroll (Acceptance check-list), se 8.3 Checklista för acceptanskontroll (sida 63),","note":false},{"text":"3. Information till befälhavaren (NOTOC), se 8.4 Information till befälhavaren NOTOC (sida 64).","note":false}]},{"num":"8.2","title":"Godsdeklaration","level":2,"paras":[]},{"num":"8.2.1","title":"Avsändarens ansvar","level":3,"paras":[{"text":"Avsändaren ansvarar för att färdigställa och överlämna en godsdeklaration till verksamhetsutövaren. Genom att underteckna godsdeklarationen så intygar avsändaren att godset är iordningsställt enligt dessa bestämmelser. Godsdeklarationen får endast färdigställas och undertecknas av behörig avsändare.","note":false}]},{"num":"8.2.2","title":"Formulär för godsdeklaration","level":3,"paras":[{"text":"Godsdeklarationen bör utfärdas på transporthandling som överensstämmer med någon av följande formulär: a IATA-shippers declaration, eller b Multimodal Dangerous Goods Form Andra formulär får också användas under förutsättning att det tydligt och enkelt går att utläsa de uppgifter som krävs enligt 8.2.8 Detaljerad information om innehållet i godsdeklarationen (sida 54). Blanketten får färdigställas manuellt eller digitalt, all information måste vara tydlig och läsbar.","note":false}]},{"num":"8.2.3","title":"Språk i godsdeklarationen","level":3,"paras":[{"text":"Godsdeklarationen ska färdigställas på engelska. Det är tillåtet att komplettera informationen på svenska eller annat språk.","note":false}]},{"num":"8.2.4","title":"Antal kopior","level":3,"paras":[{"text":"Verksamhetsutövaren ska vid mottagandet erhålla två, av avsändaren, undertecknade exemplar av godsdeklarationen. I det fall godskontrollanten tagit en kopia av inlämnad godsdeklaration i samband med acceptanskontroll så ska detta särskilt noteras på checklista för genomförd acceptanskontroll.","note":false}]},{"num":"8.2.5","title":"Ändringar i godsdeklarationen","level":3,"paras":[{"text":"Om en ändring behöver göras i godsdeklarationen så ska den avsändare som skrivit under deklarationen också ange en signatur för den ändring eller komplettering som gjorts. Om avsändaren, av praktiska skäl, inte kan ändra eller komplettera godsdeklarationen får detta göras av godskontrollanten som då också ska signera ändringen samt göra en notering om detta på checklista för genomförd acceptanskontroll.","note":false}]},{"num":"8.2.6","title":"Kopiering eller komplettering","level":3,"paras":[{"text":"Det är tillåtet att kopiera och komplettera ursprunglig godsdeklaration i det fall en sändning delas i samband med transport. Kopian ska då kompletteras så att den endast anger det gods som den omfattar. Behörig avsändare som genomfört ändringen ska på godsdeklarationen ange signatur och datum då ändringen är gjord.","note":false}]},{"num":"8.2.7","title":"Transporter med stöd av tillstånd eller genom avsteg från FSI","level":3,"paras":[{"text":"När en transport utförs efter tillstånd i enlighet med de villkor som anges i tillämplig särbestämmelse eller genom avsteg från FSI ska avsändaren bifoga en kopia av beslutet till godsdeklarationen. Dessutom ska godsdeklarationen innehålla en hänvisning till gällande beslut.","note":false}]},{"num":"8.2.8","title":"Detaljerad information om innehållet i godsdeklarationen","level":3,"paras":[{"text":"Godsdeklarationen ska innehålla tillämpliga uppgifter enligt IATA-DGR, 8.1.6 och som beskrivs under steg 1-18 i följande figurer:","note":false},{"text":"1. Figur 8.2A -8.2E vid färdigställande av IATA-shipper's declaration.","note":false},{"text":"2. Figur 8.2F -8.2J vid färdigställande av Multimodal Dangerous Goods Form.","note":false},{"text":"1. Shipper and consignee Fullständigt namn och adress för avsändare och mottagare. OBS! Ange land på engelska.","note":false},{"text":"2. Air Waybill number: Inte tillämpligt.","note":false},{"text":"3. Page…of…pages: Ange sidnummer och totalt antal sidor eller “page 1 of 1 pages” om deklarationen endast består av en sida.","note":false},{"text":"4. Shipper's reference Valfritt för avsändaren att ange ett referensnummer. Det rekommenderas att ange en referens som gör det möjligt att spåra dokumentet och sändningen.","note":false},{"text":"5. Aircraft limitations: Ange om sändningen är förberedd för passagerar- och fraktflyg eller begränsad till bara fraktflyg (stryk över det som inte är tillämpligt).","note":false},{"text":"6. Airport of departure and destination Namn på den flygplats eller stad som försändelsen utgår från samt den stad eller flygplats som är avsedd destination (denna information får utelämnas)","note":false},{"text":"7. Shipment type Ange om sändningen är radioaktiv eller inte. På förtryckta blanketter så stryks det som inte är tillämpligt.","note":false},{"text":"Sändningar som innehåller radioaktiva ämnen måste anges på godsdeklaration (shipper's declaration) enligt IATA-DGR, 10.8. Bild 8:1 “Uppgifter, del 1-7, för IATA-DGD”.","note":true},{"text":"8. UN or ID-number: Ange UN- eller ID-nummer föregånget av prefixet ”UN” eller ”ID”.","note":false},{"text":"UN-nummer framgår av kolumn A i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår UN/ID-nr av IATA-DGR, 4.2, kolumn A.","note":true},{"text":"9. Proper Shipping Name Ange “Proper shipping name (PSN)","note":false},{"text":"PSN framgår av kolumn B i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår PSN av IATA-DGR, 4.2, kolumn B. Se också IATA-DGR, 8.1.3 för övriga villkor gällande ”proper shipping name” i godsdeklarationen.","note":true},{"text":"10. Class or Division Ange klass eller division. Om tillämpligt ange även sekundärfara inom parentes. För klass 1 ska både riskgrupp och samhanteringsgrupp anges.","note":false},{"text":"Klass/division och sekundärfara framgår av kolumn C och D i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår klass/division och sekundärfara av IATA-DGR, 4.2, kolumn C.","note":true},{"text":"11. Packing Group: Om tillämpligt anges ämnets förpackningsgrupp.","note":false},{"text":"Förpackningsgrupp framgår av kolumn E i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår förpackningsgruppen av IATA-DGR, 4.2, kolumn E. Bild 8:2 “Uppgifter, del 8-11, för IATA-DGD”.","note":true},{"text":"12. Number and type of packing and quantity per package","note":false},{"text":"1. Ange antal och typ av förpackning med samma innehåll och ange mängden per förpackning.","note":false},{"text":"i. Mängden ska anges som nettomängd (vikt eller volym, beroende på vad som är tillämpligt). För limited quantity som begränsas till 30kg bruttovikt ska bruttovikten anges med bokstaven ”G” direkt efter enheten ”kg”.","note":false},{"text":"ii. För klass 1 anges “nettomängd explosivt ämne (NEM)”.","note":false},{"text":"iii. För tömda, inte rengjorda förpackningar behöver bara antalet förpackningar anges (ingen mängd). Dock ska texten “EMPTY UNCLEANED” eller “RESIDUE, LAST CONTAINED” anges före eller efter “Godsbeskrivningen” som anges i punkt 8-11.","note":false},{"text":"iv. För “UN 3363” anges mängden farligt gods i utrustningen (kan vara i gas-, vätske- eller fast form).","note":false},{"text":"2. När flera ämnen packas i samma ytterförpackning ska mängden specificeras för varje ämne och sedan efterföljas av ”all packed in one (och typ av förpackning)”. Om Q-värde har beräknats ska det anges direkt därefter som “Q=…”","note":false},{"text":"3. När overpacks används ska texten “Overpack used” anges direkt efter de förpackningar som ingår i varje overpack. Om en sändning består av flera overpacks ska följande anges:","note":false},{"text":"i. Vid identiskt innehåll anges ”Overpack used x …”, samt","note":false},{"text":"ii. ID-märkning för varje overpack och ”total mängd per overpack”.","note":false},{"text":"iii. Vid varierande innehåll identifieras varje overpack separat, med angivelse av ID-märke och ”total mängd per overpack. Bild 8:3 “Uppgifter, del 12, för IATA-DGD”.","note":false},{"text":"13. Packing Instruction Ange den förpackningsinstruktion som tillämpats. Vid tillämpning av IATA-DGR, förpackningsinstruktion 965, sektion IB eller 968, sektion IB så ska det särskilt anges att denna sektion tillämpats i respektive förpackningspackinstruktion (t.ex. ”965 IB”).","note":false},{"text":"Gällande packinstruktion framgår av kolumn G, I eller K i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår gällande packinstruktion av IATA-DGR, 4.2, kolumn G, I eller K. 14.Authorizations 1. Här anges särbestämmelsen om någon av dessa särbestämmelser använts: SP1, SP2, SP4, SP8, SP9, SP10, SP16, SP22, SP23, SP31, SP62, SP63, SP68, SP71.","note":true},{"text":"2. Om sändningen är begränsad till villkor givna av FSI ska en hänvisning till beslut från FSI anges. Bild 8:4 “Uppgifter, del 13-14, för IATA-DGD”.","note":false},{"text":"15. Additional handling information Ange eventuell hanteringsinformation som är relevant för sändningen.","note":false},{"text":"1. Vid transport av division 6.2 eller transport av ämnen under kontroll måste det här anges namn och telefonnummer till en ansvarig person.","note":false},{"text":"2. Vid transport av ämnen som hänvisar till SP27 ska notering göras att dessa kollin ska skyddas mot värmekällor och solljus.","note":false},{"text":"16. Name (and title) Namn på behörig avsändare (titel får anges men är valfritt)","note":false},{"text":"17. (Place) and date Ange datum (datumet får föregås av platsen där deklarationen färdigställts, men detta är valfri information)","note":false},{"text":"18. Signature Signatur på den person som påtar sig avsändaransvaret och att sändningen är iordningsställd enligt regelverket. Bild 8:5 “Uppgifter, del 15-18, för IATA-DGD”.","note":false},{"text":"1. Shipper and consignee Fullständigt namn och adress för avsändare och mottagare. OBS! Ange land på engelska.","note":false},{"text":"2. Transport document number: Inte tillämpligt.","note":false},{"text":"3. Page…of…pages: Ange sidnummer och totalt antal sidor eller “page 1 of 1 pages” om deklarationen endast består av en sida.","note":false},{"text":"4. Shipper's reference Valfritt för avsändaren att ange ett referensnummer. Det rekommenderas att ange en referens som gör det möjligt att spåra dokumentet och sändningen.","note":false},{"text":"5. Aircraft limitations: Ange om sändningen är förberedd för passagerar- och fraktflyg eller begränsad till bara fraktflyg (stryk över det som inte är tillämpligt).","note":false},{"text":"6. Airport of departure and destination Namn på den flygplats eller stad som försändelsen utgår från samt den stad eller flygplats som är avsedd destination (denna information får utelämnas)","note":false},{"text":"7. Shipment type Anm Sändningar som innehåller radioaktiva ämnen måste anges på godsdeklaration enligt IATA-DGR, 10.8. Bild 8:6 “Uppgifter, del 1-7, för Multimodal-DGD”.","note":false},{"text":"8. UN or ID-number: Ange UN- eller ID-nummer föregånget av prefixet ”UN” eller ”ID”.","note":false},{"text":"UN-nummer framgår av kolumn A i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår UN/ID-nr av IATA-DGR, 4.2, kolumn A.","note":true},{"text":"9. Proper Shipping Name Ange “Proper shipping name (PSN)","note":false},{"text":"PSN framgår av kolumn B i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår PSN av IATA-DGR, 4.2, kolumn B. Se också IATA-DGR, 8.1.3 för övriga villkor gällande ”proper shipping name” i godsdeklarationen. 10 .Class or Division Ange klass eller division. Om tillämpligt ange även sekundärfara inom parentes. För klass 1 ska både riskgrupp och samhanteringsgrupp anges.","note":true},{"text":"Klass/division och sekundärfara framgår av kolumn C och D i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår klass/division och sekundärfara av IATA-DGR, 4.2, kolumn C.","note":true},{"text":"11. Packing Group: Om tillämpligt anges ämnets förpackningsgrupp.","note":false},{"text":"Förpackningsgrupp framgår av kolumn E i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår förpackningsgruppen av IATA-DGR, 4.2, kolumn E. Bild 8:7 “Uppgifter, del 8-11, för Multimodal-DGD”.","note":true},{"text":"12. Number and type of packing and quantity per package","note":false},{"text":"1. Ange antal och typ av förpackning med samma innehåll och ange mängden per förpackning.","note":false},{"text":"i. Mängden ska anges som nettomängd (vikt eller vo

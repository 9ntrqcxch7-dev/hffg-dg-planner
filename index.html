lym, beroende på vad som är tillämpligt). För limited quantity som begränsas till 30kg bruttovikt ska bruttovikten anges med bokstaven ”G” direkt efter enheten ”kg”.","note":false},{"text":"ii. För klass 1 anges “nettomängd explosivt ämne (NEM)”.","note":false},{"text":"iii. För tömda, inte rengjorda förpackningar behöver bara antalet förpackningar anges (ingen mängd). Dock ska texten “EMPTY UNCLEANED” eller “RESIDUE, LAST CONTAINED” anges före eller efter “Godsbeskrivningen” som anges i punkt 8-11.","note":false},{"text":"iv. För “UN 3363” anges mängden farligt gods i utrustningen (kan vara i gas-, vätske- eller fast form).","note":false},{"text":"2. När flera ämnen packas i samma ytterförpackning ska mängden specificeras för varje ämne och sedan efterföljas av ”all packed in one (och typ av förpackning)”. Om Q-värde har beräknats ska det anges direkt därefter som “Q=…”","note":false},{"text":"3. När overpacks används ska texten “Overpack used” anges direkt efter de förpackningar som ingår i varje overpack. Om en sändning består av flera overpacks ska följande anges:","note":false},{"text":"i. Vid identiskt innehåll anges ”Overpack used x …”, samt","note":false},{"text":"ii. ID-märkning för varje overpack och ”total mängd per overpack”.","note":false},{"text":"iii. Vid varierande innehåll identifieras varje overpack separat, med angivelse av ID-märke och ”total mängd per overpack. Bild 8:8 “Uppgifter, del 12, för Multimodal-DGD”.","note":false},{"text":"13. Packing Instruction Ange den förpackningsinstruktion som tillämpats. Vid tillämpning av IATA-DGR, förpackningsinstruktion 965, sektion IB eller 968, sektion IB så ska det särskilt anges att denna sektion tillämpats i respektive förpackningspackinstruktion (t.ex. ”965 IB”).","note":false},{"text":"Gällande packinstruktion framgår av kolumn G, I eller K i Tabell B3:1 (sida 87). För ämnen som inte är upptagna i tabellen framgår gällande packinstruktion av IATA-DGR, 4.2, kolumn G, I eller K.","note":true},{"text":"14. Authorizations 1. Här anges särbestämmelsen om någon av dessa särbestämmelser använts: SP1, SP2, SP4, SP8, SP9, SP10, SP16, SP22, SP23, SP31, SP62, SP63, SP68, SP71.","note":false},{"text":"2. Om sändningen är begränsad till villkor givna av FSI ska en hänvisning till beslut från FSI anges. Bild 8:9 “Uppgifter, del 13-14, för Multimodal-DGD”.","note":false},{"text":"15. Additional handling information Ange eventuell hanteringsinformation som är relevant för sändningen.","note":false},{"text":"1. Vid transport av division 6.2 eller transport av ämnen under kontroll måste det här anges namn och telefonnummer till en ansvarig person.","note":false},{"text":"2. Vid transport av ämnen som hänvisar till SP27 ska notering göras att dessa kollin ska skyddas mot värmekällor och solljus.","note":false},{"text":"16. Name (and title) Namn på behörig avsändare (titel får anges men är valfritt)","note":false},{"text":"17. (Place) and date Ange datum (datumet får föregås av platsen där deklarationen färdigställts, men detta är valfri information)","note":false},{"text":"18. Signature Signatur på den person som påtar sig avsändaransvaret och att sändningen är iordningsställd enligt regelverket. Bild 8:10 “Uppgifter, del 15-18, för Multimodal-DGD”.","note":false}]},{"num":"8.3","title":"Checklista för acceptanskontroll","level":2,"paras":[{"text":"Kollin med farligt gods som lämnats in för transport ska genomgå en acceptanskontroll som utförs av behörig godskontrollant. Godskontrollanten ska till sin hjälp för kontrollen använda checklista enligt Bilaga 9 Checklista för acceptanskontroll (sida 207). Checklistan består av ett antal kontrollpunkter, med alternativen Yes och No, samt för vissa punkter även N/A (Not applicable). Alla kontrollpunkter måste ha behandlats innan acceptanskontrollen anses vara genomförd.","note":false}]},{"num":"8.4","title":"Information till befälhavaren NOTOC","level":2,"paras":[{"text":"När en sändning är kontrollerad och godkänd enligt 8.3 Checklista för acceptanskontroll (sida 63) ansvarar beställaren av en transport för att en NOTOC färdigställs. NOTOC ska minst innehålla följande uppgifter om allt det farliga gods som lastas ombord:","note":false},{"text":"1. UN-nummer","note":false},{"text":"2. Proper Shipping Name","note":false},{"text":"3. Faroklass (för klass 1 anges hela klassificeringskoden)","note":false},{"text":"4. Sekundärfara (om detta är tillämpligt)","note":false},{"text":"5. Förpackningsgrupp (om detta är tillämpligt)","note":false},{"text":"6. Uppgift om den upptagna posten begränsas till fraktflyg (CAO)","note":false},{"text":"7. Antal förpackningar","note":false},{"text":"8. Total bruttovikt för upptagen post","note":false},{"text":"9. Total nettomängd för upptagen post (krävs ej för klass 1)","note":false},{"text":"10. Total nettovikt explosivämne för upptagen post (krävs endast för klass 1)","note":false},{"text":"11. ERG-kod NOTOC bör färdigställas på blankett som motsvarar den förlaga som anges i Bilaga 8 NOTOC (sida 205) och innehålla uppgifter om godset som ska lastas ombord (kolumn (1)-(13)). Om annan blankett används (exempelvis en godsdeklaration) ska det säkerställas att tillämpliga uppgifter enligt nr. 1 (sida 64) – nr. 11 (sida 64) finns angivna i dokumentet.","note":false},{"text":"Lastningsansvarig kan efter lastning komplettera NOTOC med de uppgifter som anses vara relevanta, till exempel lastposition.","note":true}]},{"num":"8.5","title":"Arkivering av transporthandlingar","level":2,"paras":[{"text":"Verksamhetsutövaren ska spara följande transporthandlingar i minst tre månader från dess att transporten ägde rum.","note":false},{"text":"1. Godsdeklaration","note":false},{"text":"2. Checklista för acceptanskontroll","note":false},{"text":"3. NOTOC","note":false},{"text":"4. Eventuellt avsteg från FSI Transporttjänstbeställaren ska säkerställa att en kopia av dokument enligt nr. 1 (sida 64) – nr. 3 (sida 64) arkiveras under motsvarande period hos den organisation som färdigställt dokumentet. 9 Hantering, lastning och transport","note":false}]}]},{"num":"9","title":"Hantering, lastning och transport","sections":[{"num":"9","title":"Hantering, lastning och transport","level":1,"paras":[]},{"num":"9.1","title":"Kontoll innan lastning","level":2,"paras":[{"text":"All personal som hanterar försändelser med farligt gods är skyldig att inspektera godset innan vidare hantering. Kollin som är skadade eller läcker ska omedelbart stoppas och får först återtas i transportflödet efter att lämpliga åtgärder vidtagits av behörig personal. Detta gäller även kollin som visar tecken på läckage, fukt, färgning eller annan misstänkt skada. Kollin som misstänks innehålla explosiva ämnen eller föremål får inte öppnas för inspektion på eller nära luftfartyget. Det är inte tillåtet att lasta kollin som är skadade, läcker eller som saknar korrekt faroetikett.","note":false}]},{"num":"9.2","title":"Acceptanskontroll","level":2,"paras":[{"text":"Varje sändning med farligt gods ska genomgå en acceptanskontroll innan det lastas ombord på ett luftfartyg eller, om tillämpligt, innan det lastas i en lastbärare. Acceptanskontroll ska utföras av behörig godskontrollant, som ska verifiera genomförd kontroll genom checklista enligt 8.3 Checklista för acceptanskontroll (sida 63). Upptäcks brister i samband med acceptanskontroll, ska godset returneras till avsändaren för åtgärdande. Godskontrollanten får emellertid själv åtgärda brister men detta ska då noteras på checklistan under ”comments”. I de fall acceptanskontroll inte kan företas ska verksamhetsutövaren säkerställa att tillämplig kontroll genomförs innan lastning, sådant avsteg ska beslutas av CF eller den CF utser.","note":false}]},{"num":"9.3","title":"Farligt gods i lastbärare ombord på luftfartyg","level":2,"paras":[]},{"num":"9.3.1","title":"Begränsningar","level":3,"paras":[{"text":"Farligt gods får lastas i en lastbärare om följande villkor är uppfyllda:","note":false},{"text":"1. Lastbäraren är godkänd av verksamhetsutövaren.","note":false},{"text":"2. Lastning av lastbäraren sker enligt verksamhetsutövarens instruktioner.","note":false},{"text":"3. Varje enskilt kolli är, innan lastning, godkänt vid acceptanskontroll enligt 9.2 Acceptanskontroll (sida 65).","note":false},{"text":"4. Personal som iordningsställer lastbäraren är utbildad enligt kraven i Tabell 1:1 (sida 16) för personalkategori 2 eller 3.","note":false}]},{"num":"9.3.2","title":"Separation i lastbärare","level":3,"paras":[{"text":"Gods som kräver separation enligt gul markering i Tabell 9:3 (sida 72) eller Tabell 9:4 (sida 73), får endast stuvas på eller i samma lastbärare om separationskraven kan uppfyllas samt att separationsåtgärden har godkänts av verksamhetsutövaren.","note":false}]},{"num":"9.3.3","title":"Märkning av lastbärare","level":3,"paras":[{"text":"Såvida inte all märkning på kollina i en lastbärare är synliga utifrån ska lastbärare med farligt gods märkas med:","note":false},{"text":"1. Motsvarande faroetiketter som finns på kollina inuti lastbäraren, eller","note":false},{"text":"2. ”Id-flagga för farligt gods” enligt Bild 9:1 (sida 66). Aktuella faroetiketter på id-flaggan ska framhävas genom markering och inaktuella faroetiketter strykas över. För klass 1 ska markerade faroetiketter kompletteras med samhanteringsbokstav. På baksidan av id-flaggan ska information om UN-nummer, och nettomängder anges. Bild 9:1 ”Id-flagga för farligt gods”.","note":false}]},{"num":"9.4","title":"Farligt gods i hängande last","level":2,"paras":[]},{"num":"9.4.1","title":"Allmänt","level":3,"paras":[{"text":"Vid transport som hängande last så betraktas lastbäraren som ett separat luftfartyg vad avser begränsningar och separation. Det innebär att farligt gods i hängande last ska följa begränsningarna för fraktflyg (CAO), även om det är passagerare ombord på helikopter som transporterar hängande last (eventuellt farligt gods ombord i helikopter ska dock begränsas för passagerarflyg om passagerare medförljer ombord).","note":false}]},{"num":"9.4.2","title":"Begränsningar","level":3,"paras":[{"text":"Farligt gods får transporteras som hängande last under förutsättning att följande villkor är uppfyllda:","note":false},{"text":"1. Verksamhetsutövaren har instruktioner som säkerställer kommunikation mellan besättningen ombord och markpersonalen som säkrar den hängande lasten i helikopter. Instruktionerna ska säkerställa att befälhavaren erhåller korrekt information om den last som transporteras.","note":false},{"text":"2. Godset är förpackat enligt gällande förpackningsinstruktion och tillåtet för transport som hängande last enligt Tabell 9:1 (sida 68). Farligt gods som iordningsställts som begränsad mängd (limited quantity) är inte tillåten som hängande last.","note":false},{"text":"3. Lastbäraren för hängande last är godkänd av verksamhetsutövaren","note":false},{"text":"4. Lastning av lastbäraren sker enligt verksamhetsutövarens instruktioner,","note":false},{"text":"5. Varje enskilt kolli har godkänts vid acceptanskontroll enligt 9.2 Acceptanskontroll (sida 65),","note":false},{"text":"6. Personal som iordningsställer lastbäraren är utbildad enligt kraven i Tabell 1:1 (sida 16) för personalkategori 2 eller 3. Tabell 9:1 Begränsningar hängande last. Klass/Division (gäller endast huvudfara) Ämnen och föremål Begränsning 1 Ämnen och föremål i samhanteringsgrupperna A, J, K och L Förbjudet som hängande last 1 Ämnen och föremål i samhanteringsgrupperna B, C, D, E, F, G, H, N, S Tillåtet utan särskilda restriktioner 2.1 Samtliga ämnen och föremål i förutom UN 1001 Acetylene Tillåten om de förpackas i en typgodkänd ytterförpackning som möter kraven för förpackningsgrupp II 2.1 UN 1001 Acetylen Förbjudet som hängande last 2.2 Samtliga ämnen och föremål förutom UN 1073 Oxygen, refrigerated liquid Tillåten om de förpackas i en typgodkänd ytterförpackning som möter kraven för förpackningsgrupp II 2.2 UN 1073 Oxygen, refrigerated liquid Förbjuden som hängande last 2.3 Samtliga ämnen och föremål Förbjuden som hängande last 3 Ämnen i förpackningsgrupp I Förbjuden som hängande last 3 Ämnen i förpackningsgrupp II och III, samt UN 3528 eller UN 3540 Tillåtet utan särskilda restriktioner 4.1 Samtliga ämnen och föremål Tillåtet utan särskilda restriktioner 4.2 Samtliga ämnen och föremål Förbjuden som hängande last 4.3 Samtliga ämnen och föremål Tillåtet utan särskilda restriktioner 5.1 Samtliga ämnen och föremål Förbjuden som hängande last 5.2 Samtliga ämnen och föremål Förbjuden som hängande last 6.1 Samtliga ämnen och föremål Förbjuden som hängande last 6.2 Samtliga ämnen och föremål Förbjuden som hängande last 7 Samtliga ämnen och föremål förutom UN 2908, 2909, 2910, 2911 Förbjuden som hängande last 7 UN 2908, 2909, 2910, 2911 Tillåtet utan särskilda restriktioner 8 Samtliga ämnen och föremål Tillåtet utan särskilda restriktioner 9 Samtliga ämnen och föremål Tillåtet utan särskilda restriktioner","note":false}]},{"num":"9.4.3","title":"Separation i lastbärare för hängande last","level":3,"paras":[{"text":"Gods som kräver separation enligt gul markering i Tabell 9:3 (sida 72) eller Tabell 9:4 (sida 73), får endast placeras i samma lastbärare om separationskraven kan uppfyllas samt att separationsåtgärden har godkänts av verksamhetsutövaren. Observera att vid hängande last betraktas lastbäraren som ett eget luftfartyg vad avser separation. Det innebär att gods som placeras ombord på helikopter inte behöver tas i beaktande vad avser separationsbestämmelser i lastbäraren.","note":false}]},{"num":"9.4.4","title":"Märkning av lastbärare för hängande last","level":3,"paras":[{"text":"Lastbärare för hängande last behöver inte vara märkt under flygtransporten. Däremot ska lastbäraren vid en marktransport fram till att den fästs i luftfartyget vara märkt enligt bestämmelserna i delavsnitt 9.3.3 Märkning av lastbärare (sida 66).","note":false}]},{"num":"9.5","title":"Allmänna krav vid lastning och lossning av luftfartyg","level":2,"paras":[]},{"num":"9.5.1","title":"Förberedelse innan lastning","level":3,"paras":[{"text":"Innan lastning av luftfartyg ska lastningsansvarig försäkra sig om att tillämpliga krav i 9.1 Kontoll innan lastning (sida 65) – 9.3 Farligt gods i lastbärare ombord på luftfartyg (sida 65) är uppfyllda.","note":false}]},{"num":"9.5.2","title":"Förebyggande av brand","level":3,"paras":[{"text":"Farligt gods ska stuvas åtskilt från värmekällor och föremål som kan alstra gnistor eller antändning.","note":false}]},{"num":"9.5.3","title":"Lastsäkring","level":3,"paras":[{"text":"Verksamhetsutövaren ska ha rutiner för lastsäkring som förhindrar att kollin med farligt gods kan skadas eller komma i rörelse under transporten.","note":false}]},{"num":"9.5.4","title":"Särskilda åtgärder vid lastning och lossning","level":3,"paras":[{"text":"Särskilda åtgärder och restriktioner gäller vid lastning enligt nr. 1 (sida 69) till nr. 6 (sida 70) nedan:","note":false},{"text":"1. Lastning och lossning av nedanstående klasser ska undvikas vid åska eller då det föreligger risk för åska. ○ klass 1, ○ division 2.1, ○ klass 3, ○ klass 4, samt ○ klass 5. Om farligt gods enligt ovanstående klassificering redan finns ombord på luftfartyget ska lastluckor stängas och luftfartyget utrymmas på personal. Alla externa kraftkällor ska kopplas från.","note":false},{"text":"2. Det är inte tillåtet att lasta/lossa farligt gods vid tankning av luftfartyg.","note":false},{"text":"3. Det är inte tillåtet att lasta/lossa farligt gods vid fyllning av flytande oxygen (LOX).","note":false},{"text":"4. Vid lastning/lossning (innefattar även nedvinschning från helikopter) av klass 1, division 2.1, klass 3 och klass 4 så ska luftfartyg, last och mark vara potentialutjämnat (jordkabel ansluten).","note":false},{"text":"5. Det bör inte finnas farligt gods i lasten ombord vid större reparationer och motorkörningar av luftfartyg.","note":false},{"text":"6. Luftfartyg bör lastas för möjlighet att nödfälla åtminstone en del av det farliga godset så att konsekvenserna till följd av oönskade händelser minskar.","note":false}]},{"num":"9.6","title":"Lastning av farligt gods ombord passagerarflyg","level":2,"paras":[]},{"num":"9.6.1","title":"Allmänt","level":3,"paras":[{"text":"Stuvning i samma utrymme som passagerare eller annan personal är endast tillåtet då lastningsansvarig kan övervaka lasten under transporten.","note":false}]},{"num":"9.6.2","title":"Särskilda krav vid transport av radioaktiva ämnen","level":3,"paras":[{"text":"Kollin med radioaktiva ämnen tillhörande kategori II-Gul eller III-Gul får inte lastas i samma utrymme som passagerare eller besättning såvida kollin inte är lastade i täckta lastbärare. Vid lastning av sådana kollin ska villkoren i IATA-DGR, 10.9.3.7, vara uppfyllda. Om besättning, passagerare eller annan personal uppehåller sig i samma lastutrymme som lastbäraren under transport eller lastning ska de angivna avstånden ökas med faktor 2.","note":false}]},{"num":"9.7","title":"Lastning av farligt gods ombord fraktflyg (CAO)","level":2,"paras":[{"text":"Kollin märkta med etiketten”CAO” ska stuvas så att besättning (eller annan behörig person ombord) kan vidta lämpliga åtgärder med kollin eller läckage i händelse av olycka eller tillbud.","note":false}]},{"num":"9.8","title":"Separation av farligt gods","level":2,"paras":[]},{"num":"9.8.1","title":"Allmänt","level":3,"paras":[{"text":"Farligt gods som kan reagera farligt med varandra får inte stuvas eller lastas så att det vid ett eventuellt läckage kan innebära att de kommer i kontakt med varandra.","note":false}]},{"num":"9.8.2","title":"Särskilda separationskrav","level":3,"paras":[{"text":"För lastning ombord på luftfartyg ska kollin med farligt gods av olika UN-nummer separeras från varandra enligt Bild 9:2 (sida 71). Separationskraven baseras på respektive kollis faroetiketter och villkoren anges där de två berörda faroklasserna möts i Tabell 9:3 (sida 72) och Tabell 9:4 (sida 73). Om inte annat anges i tabellerna ska hänsyn tas till faroetiketter både för primär- och sekundär fara. Tabell 9:2 De olika färgmarkeringarna har följande innebörd: . Samlastning på samma luftfartyg är inte tillåten.","note":false},{"text":"Vid helikoptertransport med hängande last ska lasten betraktas som ett eget luftfartyg vad avser bestämmelser om separation. Det innebär att laster som ger röd markering kan separareas genom att placera ett kolli i helikopter och det andra i den hängande lasten. Kollin får inte placeras i samma vertikala linje (ovanpå varandra). Horisontellt måste kollin separeras med ett avstånd om minst 0,8 m samt med skiljevägg vars höjd minst motsvarar höjden på det gods som ska separeras. Skiljeväggen kan ersättas med kompatibelt gods som placerats mellan de kollin som kräver separation. Exempel på separation visas i nedanstående figur Bild 9:2 (sida 71). Bild 9:2 Separation av inkompatibelt gods på samma luftfartyg”.","note":true},{"text":"Med skiljevägg avses separata lastutrymmen, täckta lastbärare (ULD) eller separat skiljevägg som motsvarar en vägg hos en täckt lastbärare. Samlastning tillåten, inga restriktioner utöver de allmänna stuvningsbestämmelserna. Tabell 9:3 Separationsbestämmelser mellan olika klasser. Etikett 1.1- 1.3 1.5, 1.6 1.4 1.4S 2.1 2.2 2.3 3 4.1 4.2 4.3 5.1 5.2 6.1 6.2 7 8 9 1.5, 1.6 Se Tabell 9:4 (sida 73) a a a a a, d 1.4 1.4S 2.1 b c e 2.2 a 2.3 c 3 b e 4.1 b c e 4.2 b c 4.3 b 5.1 b c e 5.2 b c 6.1 a b b b b b b b 6.2 a 7 a 8 c c c c c c 9 a, d e e e e a Gul markering avser separationskrav för alla ämnen och föremål i riskgrupp 1.1-1.3, 1.5 och 1.6 förutom de som har samhanteringsbokstav A eller L. För ämnen och föremål med samhanteringsgrupp A eller L gäller förbud mot samlastning på samma luftfartyg (röd markering). b Gul markering avser separationskrav för vätskor med primär fara i division 6.1, förpackningsgrupp I. Övriga ämnen och föremål i divison 6.1 får samlastas ombord utan särskilda restriktioner (grön markering). c Gul markering avser separationskrav för UN 2794 och UN 2795 samt alla vätskor med primär fara i klass 8. Övriga ämnen och föremål i klass 8 får samlastas ombord utan särskilda restriktioner (grön markering). d Gul markering avser separationskrav för alla ämnen och föremål i klass 9 förutom UN 3090 och UN 3480. För UN 3090 och 3480 gäller förbud mot samlastning på amma luftfartyg (röd markering). e Gul markering avser separationskrav för UN 3090 och UN 3480. Övriga ämnen och föremål i klass 9 får samlastas ombord utan särskilda restriktioner (grön markering). Tabell 9:4 Separationsbestämmelser inom klass 1. Samhant.grupp A B C D E F G H J K L N S A B a, b a a d C a, b b, c b, d b b b b D a c d E a c d F b, c c c d G d b, d d d d H b J b K b L e N b S a UN 0255, UN 0257, UN 0267 och UN 0361 får samlastas ombord med explosiva ämnen och föremål i samhanteringsgrupperna C, D eller E enligt restriktioner för gul markering. För alla andra UN-nummer inom samhanteringsgrupp B gäller restriktioner enligt röd markering såvida de inte får samlastas enligt lättnader under not (b). b UN 0338 och UN 0339 får samlastas ombord med explosiva ämnen och föremål i samhanteringsgrupperer-na B, F, G, H, J, K och N enligt restriktioner för gul markering. För alla andra UN-nummer inom samhanteringsgrupp C gäller restriktioner enligt röd markering såvida de inte får samlastas enligt lättnader under not (a), (c) eller (d). c UN 0292 och UN 0293 får samlastas ombord med explosiva ämnen och föremål i samhanteringsgrupperna C, D eller E enligt restriktioner för gul markering. För alla andra UN-nummer inom samhanteringsgrupp F gäller restriktioner enligt röd markering såvida de inte får samlastas enligt lättnader under not (b) eller(d). d UN 0009, UN 0010, UN 0018, UN 0019, UN 0300, UN 0301, UN 0314, UN 0315, UN 0319, UN 0320 och UN 0325 får samlastas ombord med explosiva ämnen och föremål i samhanteringsgrupp B, C, D, E eller F enligt restriktioner för gul markering. För alla andra UN-nummer inom samhanteringsgrupp G gäller restriktioner enligt röd markering såvida de inte får samlastas enligt lättnader under not (b). e Får samlastas ombord med ämnen och föremål som har samma UN-nummer utan särskilda restriktioner (grön markering). För ämnen och föremål med olika UN-nummer gäller restriktioner enligt röd markering.","note":true}]},{"num":"9.9","title":"Separation av farligt gods och annan särskild last","level":2,"paras":[]},{"num":"9.9.1","title":"Levande djur","level":3,"paras":[{"text":"Levande djur får inte lastas på samma lastbärare eller i samma oventilerade lastutrymme där det finns något av följande kollin:","note":false},{"text":"1. Kollin märkta med etikett 2.3, 6.1 eller 6.2.","note":false},{"text":"2. Kollin innehållande kvävningsframkallande gaser","note":false},{"text":"3. Kollin innehållande UN 1845 Torris (Dry Ice).","note":false}]},{"num":"9.9.2","title":"Oframkallad fotografisk film","level":3,"paras":[{"text":"Oframkallad fotografisk film ska separeras från kollin innehållande radioaktiva ämnen i klass 7. Restriktioner och begränsningar framgår av IATA-DGR, 10.9.3.8.","note":false}]},{"num":"9.9.3","title":"Levande organ, blod och plasma","level":3,"paras":[{"text":"Levande organ, blod och plasma får inte lastas på samma lastbärare eller i samma oventilerade lastutrymme som kollin märkta med etikett 6.1 eller etikett 6.2.","note":false}]},{"num":"9.9.4","title":"Livsmedel och djurfoder","level":3,"paras":[{"text":"Livsmedel och djurfoder får inte lastas på samma lastbärare eller i samma oventilerade lastutrymme som kollin märkta med etikett 6.1 eller etikett 6.2.","note":false}]},{"num":"9.10","title":"Parkering och taxning","level":2,"paras":[]},{"num":"9.10.1","title":"Information till flygtrafikledningen","level":3,"paras":[{"text":"Före start och landning ska befälhavaren, på begäran från flygtrafikledningen, ge information om det farliga godset (typ, klassificering och mängduppgifter) samt begära lämpliga instruktioner för t.ex. parkering/uppställning.","note":false}]},{"num":"9.10.2","title":"Särskilda åtgärder vid transport av klass","level":3,"paras":[{"text":"Verksamhetsutövaren ska inför en flygtjänst säkerställa att nettomängden explosivt ämne (NEM) ombord på luftfartyget inte överstiger de mängder som flygplatsen begränsar. Trafik- och flygplatsledningen ska anvisa luftfartyg lastade med explosiva ämnen och föremål i riskgrupp 1.1-1.3 till ett särskilt utsett område för parkering, latsning och lossning. Efter parkering på avskilt område ska instruktioner från trafik-/flygplatsledning upprätthållas och efterföljas.","note":false}]},{"num":"9.11","title":"Transporthandlingar ombord","level":2,"paras":[{"text":"Verksamhetsutövaren ska ha rutiner som säkerställer att transporthandlingar enligt nr. 1 (sida 75) – nr. 4 (sida 75) förvaras ombord så att de är tillgängliga för befälhavaren under hela transporten.","note":false},{"text":"1. Godsdeklaration (se 8.2 Godsdeklaration (sida 53)),","note":false},{"text":"2. checklista för acceptanskontroll (se 8.3 Checklista för acceptanskontroll (sida 63)),","note":false},{"text":"3. NOTOC (se 8.4 Information till befälhavaren NOTOC (sida 64)),","note":false},{"text":"4. eventuellt tillstånd från CF eller avsteg från FSI","note":false}]},{"num":"9.12","title":"Säkerhetsrutiner ombord","level":2,"paras":[]},{"num":"9.12.1","title":"Allmänt","level":3,"paras":[{"text":"Verksamhetsutövaren ska rutiner som säkerställer att:","note":false},{"text":"1. Besättningen har erforderliga kunskaper om de risker som förknippas med farligt gods som last ombord.","note":false},{"text":"2. Befälhavaren har kännedom om var (vilken position) det farliga godset är lastat ombord.","note":false},{"text":"3. Det finns åtgärdsplaner för att hantera olyckshändelser eller tillbud, samt att besättningen har kunskap och färdigheter för hur dessa åtgärdsplaner fungerar.","note":false},{"text":"4. Det finns tillräcklig säkerhetsutrustning ombord för att kunna utföra de nödåtgärder som krävs vid olycka eller tillbud med det farliga godset.","note":false},{"text":"Uppgifter om särskilda åtgärder och risker med farligt gods erhålls bland annat genom att tillämpa ”ERG-koder” vilka förklaras i Bilaga 5 ERG-koder (sida 169).","note":true}]},{"num":"9.12.2","title":"Information vid olycka eller tillbud","level":3,"paras":[{"text":"Vid olycka eller tillbud ombord under transport ska befälhavaren snarast möjligt informera ATS (Air Traffic Service) om farligt gods som ingår i lasten.","note":false}]},{"num":"9.13","title":"Nödfällning av farligt gods","level":2,"paras":[{"text":"I händelse av en nödsituation kan befälhavaren besluta om att nödfälla lasten. Nödfällning ska föregås av visuell observation och, om möjligt, kontakt med markpersonal så att nödfällning sker med beaktande av de risker som finns för markpersonal och tredje man.","note":false}]},{"num":"9.14","title":"Rapportering","level":2,"paras":[{"text":"Verksamhetsutövaren ska rapportera olyckor, tillbud och avvikelser med farligt gods. Rapportering ska ske enligt ordinarie avvikelsehanteringssystem. Utöver detta ska en särskild rapport om olycka, tillbud eller avvikelse med farligt gods skickas till FLYGI (enligt blankett SE-MAA 550 Dangerous Goods Occurence Report). Rapporter över olyckor, tillbud och avvikelser med farligt gods ska förvaras hos FLYGI i minst fem år från det datum då händelsen rapporterats.","note":false}]}]}];
const GLOSSARY_DATA = [{"term":"Acceptanskontroll","definition":"Acceptanskontroll avser den kontroll som godkontrollanten ska genomföra för att en sändning med farlig gods ska vara accepterad för transport."},{"term":"ADR-S","definition":"ADR-S avser de föreskrifter för transport av farligt gods på väg och i terräng som beslutats av Myndigheten för samhällsskydd och beredskap (MSB)."},{"term":"Avsändare","definition":"Avsändare avser den personal i förråd, organisation, enhet vars arbetsuppgift är att iordningställa farligt gods för transport."},{"term":"Avvikelse med farligt gods","definition":"Avvikelse med farligt gods avser en upptäckt händelse där bestämmelserna inte följts för farligt gods som ska lastas, har lastats eller har transporterats."},{"term":"Befälhavare","definition":"Befälhavare avser den pilot som vid flygordergivning utses till befälhavare för luftfartyg."},{"term":"Behörig avsändare och behörig godskontrollant","definition":"Behörig avsändare och behörig godskontrollant används i denna bok för att beteckna kravet på att avsändare och godskontrollant ska ha intyg som verifierar att de är utbildade och avlagt kunskapsprov med godkänt resultat."},{"term":"Beslut om flygning (BOF)","definition":"Beslut om flygning (BOF) avser ett beslut som klarlägger besättningens befäls- och ansvarsförhållanden för flygning och som ger erforderliga direktiv för flygningens genomförande. Befälhavare och besättning ska utses för varje luftfartyg som omfattas av BOF."},{"term":"Besättning","definition":"Besättning avser personer som i BOF är beordrade till tjänstgöring ombord på luftfartyg och som före flygning är införda på besättningslista."},{"term":"CAO","definition":"CAO är en förkortning för ”Cargo Aircraft Only” och används som begränsning för gods vilket inte är tillåtet på passagerarflyg."},{"term":"CF (Flygchef)","definition":"CF (Flygchef) avser befattningshavare som är accepterad av FSI (Flygsäkerhetsinspektören) och ansvarar för flygtjänsten."},{"term":"ERG-kod","definition":"ERG-kod avser ”Emergency Responce Guidance-Code” enligt nödåtgärdsrutiner i ICAO:s document ”Emergency Response Guidance for Aircrafts Involving Dangerous Goods (ICAO Doc. 9481-AN/928)”. Kan även gå under benämningen “drill-code”."},{"term":"Fraktflyg","definition":"Fraktflyg avser luftfartyg som utöver gods endast består av besättning och passagerare som erfordras för att kunna lösa uppgiften för luftfartyget."},{"term":"FLYGI","definition":"FLYGI avser den militära flyginspektionen i högkvarteret."},{"term":"FN","definition":"FN avser Förenta Nationerna."},{"term":"Fordon","definition":"Fordon avser anordningar som är självgående och konstruerade att transportera en eller flera personer eller gods."},{"term":"FSI","definition":"FSI avser Flygsäkerhetsinspektören vid Försvarsmakten."},{"term":"Förpackning","definition":"Förpackning avser den färdiga produkten av packningsförfarandet bestående av emballaget och dess innehåll klart för transport. En overpack betraktas inte som en förpackning."},{"term":"Godsdeklaration (DGD)","definition":"Godsdeklaration (DGD) avser det dokument som avsändaren upprättar med uppgifter om allt det farliga gods som överlämnas för transport och där denne deklarerar att det farliga gods som innefattas iordningställts enligt dessa regler."},{"term":"Godskontrollant","definition":"Godskontrollant avser person utsedd att ansvara för genomförande av acceptanskontroll, och godkänna försändelser för transport."},{"term":"HFFG","definition":"HFFG avser denna publikation ”Försvarsmaktens Hantering av Flygtransport av Farligt Gods”, vilken innehåller tekniska bestämmelser för flygtransport av farligt gods med Försvarsmaktens luftfartyg."},{"term":"IATA-DGR","definition":"IATA-DGR avser publikationen ”Dangerous Goods Regulations” ges ut av organisationen IATA (International Air Transport Association)."},{"term":"IBC-behållare","definition":"IBC-behållare avser en Styv eller flexibel transporterbar förpackning som är konstruerad för mekanisk hantering, kan klara de påkänningar som uppstår vid transport, som är provad enligt bestämmelserna i kapitel 6.5 i ADR-S, samt har en volym av: 1. högst 3 m3 för fasta ämnen och vätskor i förpackningsgrupp II och III 2. högst 1,5 m3 för fasta ämnen i förpackningsgrupp I, om dessa ämnen är förpackade i flexibla IBC-behållare, integrerade IBC-behållare eller IBC-behållare av plast, papp eller trä. 3. högst 3 m3för fasta ämnen i förpackningsgrupp I, om dessa är förpackade i IBC-behållare av metall, högst 3 m3 för radioaktiva ämnen i klass 7"},{"term":"ICAO-TI","definition":"ICAO-TI avser regler ur ICAO Annex 18 och publicerade International Civil Aviation Organization -Technical Instructions for the Safe Transport of Dangerous Goods by Air, published by International Civil Aviation Organization."},{"term":"ID-flagga för farligt gods","definition":"ID-flagga för farligt gods avser standardiserad blankett som ska fästas vid en lastbärare som innehåller farligt gods. Blanketten ska innehålla uppgifter om det farliga godset i lastbäraren."},{"term":"Insatslika förhållanden","definition":"Insatslika förhållanden är en benämning som används av Verksamhetsutövaren för de flyguppdrag, där förhållandena vid t ex destinationen, medför en förhöjd operativ risk."},{"term":"Kolli","definition":"Kolli avser den transportfärdiga slutprodukten av förpackningsprocessen som består av förpackningen, IBC-behållaren och dess innehåll. Begreppet omfattar även föremål som på grund av in storlek, vikt eller utformning får transporteras oförpackade. En overpack betraktas som ett kolli."},{"term":"Lastningsansvarig","definition":"Lastningsansvarig avser den som vid flygordergivning utsetts till ansvarig för lastning och lossning av luftfartyg."},{"term":"Lastbärare","definition":"Lastbärare avser transportutrustning konstruerad för att underlätta transport av ett eller flera kollin såsom ombordlastad fraktcontainer, fordon eller standardiserad lastenhet (ULD) eller bärare av hängande last för helikopter. Begreppet omfattar även ombordlastad tankcontainer eller tankfordon."},{"term":"MoU (Memorandum of Understanding)","definition":"MoU (Memorandum of Understanding) avser ett bilateralt eller multilateralt avtal mellan två eller flera länder. Ofta genomför Försvarsmakten gemensamma övningar eller insatser tillsammans med en eller flera länder inom ramen för ett MoU, som tidigare har förhandlats fram efter tillstånd från Regeringen."},{"term":"Nettomängd","definition":"Nettomängd avser mängden (i liter eller kg) av ett ämne exklusive förpackning och övrigt emballage. För ett föremål avses vikten på föremålet exklusive förpackning och övrigt emballage. När det gäller litiumbatterier installerade i utrustning avses emellertid vikten på batterierna."},{"term":"Nettovikt explosivt ämne (NEM)","definition":"Nettovikt explosivt ämne (NEM) avser den nettovikt av explosivt ämne och eventuellt pyrotekniskt ämne som ingår i ämnen eller föremål tillhörande klass 1. Mängden benämns också som Q-vikt."},{"term":"NOTOC","definition":"NOTOC är en förkortning av Notification to commander och avser information som ska lämnas till befälhavaren ombord. OpO (Operationsorder) Order för operation planerad och ledd av HKV INS FTS."},{"term":"Overpack","definition":"Overpack avser en omslutning som används av en enskild avsändare för att innehålla en eller flera förpackningar eller föremål, vilka kan skickas var och en för sig, och som bildar en enhet som är lättare att hantera och stuva under transport. Exempel på overpack är en lastpall, på vilka flera förpackningar ställs eller staplas och säkras med band, krympfilm, pallkrage och lock eller en kombination av dessa metoder."},{"term":"Olycka med farligt gods","definition":"Olycka med farligt gods avser en händelse som har samband med, och kan hänföras till, transport av farligt gods och som resulterar i dödlig eller allvarlig skada på person eller betydande skada på egendom."},{"term":"Palett","definition":"Palett avser en speciell metallplattform som används för lasthantering ombord på luftfartyg."},{"term":"Passagerare","definition":"Passagerare avser personer ombord på luftfartyg som inte ingår i beordrad besättning."},{"term":"Passagerarflyg","definition":"Passagerarflyg avser luftfartyg som, utöver gods och besättning, transporterar personer utan uppgift ombord."},{"term":"PAX","definition":"PAX är en förkortning för passagerare."},{"term":"Q-vikt","definition":"Q-vikt se Nettovikt explosivt ämne (NEM)."},{"term":"Skadat gods","definition":"Skadat gods är ämnen och föremål vilka klassificeras som farligt gods och som bedöms vara skadade eller utsatta för yttre påverkan så att dess egenskaper förändrats. Allt farligt gods som inte är fastställt som oskadat ska bedömas vara skadat farligt gods."},{"term":"Standardiserad lastenhet (ULD)","definition":"Standardiserad lastenhet (ULD) avser en typ av behållare särskilt anpassad för luftfartyg. Exempel på sådan enhet kan vara en palett med nät eller anpassad lastbärare för en hängande last. I dessa bestämmelser inbegrips standardiserad lastenhet (ULD) i begreppet lastbärare. En overpack betraktas inte som en standardiserad lastenhet."},{"term":"Tillbud med farligt gods","definition":"Tillbud med farligt gods avser en händelse, annan än olycka med farligt gods, som har samband med och kan hänföras till transport av farligt gods och som resulterar i skada på person eller egendom, brand, sönderslaget gods, spill, vätske- eller strålningsläckage eller annat tecken på att förpackningens hållbarhet inte har bibehållits. Händelsen behöver nödvändigtvis inte ske ombord på ett luftfartyg."},{"term":"Transportchef","definition":"Transportchef avser den person bland passagerarna som transporttjänstbeställaren utsett för att ansvara för att personal och dess bagage eller burna utrustning uppfyller tillämpliga krav."},{"term":"Transporttjänstbeställare","definition":"Transporttjänstbeställare avser den organisation (t.ex. förband, enhet eller företag) som begär att få en flygtransport utförd av berörd Verksamhetsutövar"},{"term":"Typgodkänd förpackning","definition":"Typgodkänd förpackning avser en förpackning som provats och certifierats för att innehålla farligt gods för civil luftfart enligt ICAO-TI."},{"term":"Täckt lastbärare","definition":"Täckt lastbärare avser en lastbärare en enhet som helt omsluter innehållet genom en permanent struktur (hela väggar, golv och tak). Lastbärare med sidor eller ovansida av tyg utgör inte slutna lastbärare."},{"term":"Verksamhetsutövare","definition":"Verksamhetsutövare avser förband eller annan organisationsenhet inom Försvarsmakten, annan myndighet, enskild eller organisatorisk enhet inom en myndighet eller en enskild som ingår i det militära luftfartssystemet och som godkänts av FSI att utöva flygtjänst med bemannade eller obemannade luftfartyg."},{"term":"UN-nummer","definition":"UN-nummer avser det fyrsiffriga nummer som angivits av FN:s expertkommitté för transport av farligt gods, för att identifiera ett ämne eller föremål vilket klassats som farligt gods."}];

// ---- DG object construction from raw positional data ----
function buildDgIndex(){
  const list = DG_RAW.map(r => ({
    un: r[0], psn: r[1], class: r[2], subrisk: r[3], pg: r[4], eq: r[5],
    ltdQtyPackInstr: r[6], ltdQtyMax: r[7], paxPackInstr: r[8], paxMax: r[9],
    caoPackInstr: r[10], caoMax: r[11], sp: r[12], erg: r[13], dataQualityNotes: r[14] || [],
  }));
  list.forEach(d => { d.id = d.un + '|' + d.class + '|' + (d.subrisk||'') + '|' + (d.pg||''); });
  return list;
}
const DG_LIST = buildDgIndex();
const DG_BY_UN = {};
DG_LIST.forEach(d => { (DG_BY_UN[d.un] = DG_BY_UN[d.un] || []).push(d); });

// ---- text search ----
function normalizeQuery(q){ return (q||'').trim().toUpperCase().replace(/^UN\s*/,''); }
function searchDg(query, limit){
  limit = limit || 30;
  const q = normalizeQuery(query);
  if(!q) return [];
  const isNumeric = /^\d+$/.test(q);
  const results = [];
  for(const d of DG_LIST){
    let score = -1;
    if(isNumeric){
      if(d.un === q.padStart(4,'0')) score = 100;
      else if(d.un.startsWith(q)) score = 80;
    }
    if(score < 0){
      const name = d.psn.toUpperCase();
      if(name === q) score = 95;
      else if(name.startsWith(q)) score = 70;
      else if(name.includes(q)) score = 50;
      else if(d.class && d.class.toUpperCase() === q.replace('CLASS ','')) score = 40;
      else if(q.startsWith('CLASS ') && d.class && d.class.startsWith(q.slice(6).trim())) score = 40;
    }
    if(score >= 0) results.push({d, score});
  }
  results.sort((a,b)=> b.score - a.score || a.d.un.localeCompare(b.d.un));
  return results.slice(0, limit).map(r=>r.d);
}

// ---- classification helpers ----
function classFamily(classCode){
  if(!classCode) return null;
  if(classCode.startsWith('1.')){
    const div = classCode.charAt(2);
    return div === '4' ? 'class1low' : 'class1high';
  }
  return classCode;
}
function compatGroupOf(classCode){
  if(!classCode || !classCode.startsWith('1.')) return null;
  return classCode.slice(-1); // trailing letter, e.g. '1.1D' -> 'D'
}
function isClass1(classCode){ return !!classCode && classCode.startsWith('1.'); }

// hazard "labels" to evaluate for a DG item = primary class family + subrisk families (per 9.8.2:
// "hänsyn tas till faroetiketter både för primär- och sekundär fara")
function hazardFamilies(dg){
  const fams = [classFamily(dg.class)];
  if(dg.subrisk){
    dg.subrisk.split('+').forEach(s => { const f = classFamily(s); if(f && !fams.includes(f)) fams.push(f); });
  }
  return fams.filter(Boolean);
}

// best-effort physical-state inference from Proper Shipping Name (used only for the
// documented Table 9:3 exceptions that hinge on "liquid" state). Flagged as inferred
// whenever surfaced in the UI - never silently asserted as certain.
function inferPhysicalState(dg){
  const n = dg.psn.toUpperCase();
  if(/\bLIQUID\b/.test(n)) return 'liquid';
  if(/\bSOLUTION\b/.test(n)) return 'liquid'; // "solution" is definitionally a liquid — not a guess
  if(/\bFLUID\b/.test(n)) return 'liquid';    // "fluid" is definitionally a liquid — not a guess
  if(/\bSOLID\b/.test(n) || /\bPOWDER\b/.test(n)) return 'solid';
  return 'unknown';
}

// ---- Table 9:3 — cross-class separation ----
// Transcribed directly from the HFFG Table 9:3 source image (9.8.2, page 72) and
// validated programmatically for symmetry and footnote-consistency before use.
// T93_MATRIX keys: '1H' = division 1.1-1.3/1.5/1.6 (governed internally by Table 9:4
// for 1H-vs-1H, 1H-vs-1.4, 1H-vs-1.4S); '1.4' and '1.4S' as their own rows/columns;
// all other HFFG hazard classes/divisions by their normal code.
// Cell values: 'G' green, 'Y' plain yellow (unconditional separation), 'R' red,
// 'S4' see Table 9:4, or 'Y' + footnote letter(s) (a/b/c/d/e) — conditional per note.
function applyT93Note(cellCode, class1Dg, otherDg, famA, dgA, famB, dgB){
  // cellCode like 'Ya', 'Yb', 'Yc', 'Yad', 'Ye', or plain 'Y'/'G'/'R'
  const base = cellCode.charAt(0); // Y, G, R
  const notes = cellCode.slice(1); // '', 'a', 'b', 'c', 'ad', 'e'
  const cite = notes ? `HFFG 9.8.2 / Table 9:3, note ${notes.split('').join(' & ')}` : 'HFFG 9.8.2 / Table 9:3';

  if(base === 'G') return {status:'GREEN', reason:'No separation requirement identified between these hazard classes (HFFG Table 9:3).', source:cite, confidence:'certain'};
  if(base === 'R') return {status:'RED', reason:'Not permitted on the same aircraft (HFFG Table 9:3).', source:cite, confidence:'certain'};
  // base === 'Y' — plain or conditional
  if(!notes) return {status:'YELLOW', reason:'Physical separation required between these hazard classes (HFFG Table 9:3).', source:cite, confidence:'certain'};

  if(notes.includes('a')){
    const grp = compatGroupOf(class1Dg.class);
    const isolated = (grp === 'A' || grp === 'L');
    if(notes.includes('d')){
      const special9 = (otherDg.un === '3090' || otherDg.un === '3480');
      if(isolated || special9){
        const why = isolated ? `compatibility group ${grp} requires isolation (note a)` : `UN ${otherDg.un} is excluded from the general class 9 relief (note d)`;
        return {status:'RED', reason:`Not permitted on the same aircraft: ${why}.`, source:cite, confidence:'certain'};
      }
      return {status:'YELLOW', reason:'Separation required between explosives (division 1.1-1.3/1.5/1.6) and class 9 (notes a & d).', source:cite, confidence:'certain'};
    }
    if(isolated){
      return {status:'RED', reason:`Class 1 compatibility group ${grp} must be isolated from all other dangerous goods (note a).`, source:cite, confidence:'certain'};
    }
    return {status:'YELLOW', reason:'Separation required between explosives (division 1.1-1.3/1.5/1.6) and this class (note a).', source:cite, confidence:'certain'};
  }
  if(notes === 'b'){
    const c61 = famA === '6.1' ? dgA : dgB;
    const state = inferPhysicalState(c61);
    if(c61.pg === 'I' && state === 'liquid'){
      return {status:'YELLOW', reason:`UN ${c61.un} is a Packing Group I liquid with primary hazard division 6.1 (note b).`, source:cite, confidence:'certain'};
    }
    if(c61.pg === 'I' && state === 'unknown'){
      return {status:'MANUAL_REVIEW', reason:`UN ${c61.un} is Packing Group I; whether it is a liquid (which would trigger separation under note b) could not be determined from its Proper Shipping Name. Verify physical state directly.`, source:cite, confidence:'inferred'};
    }
    return {status:'GREEN', reason:'Not a Packing Group I liquid with primary hazard division 6.1; no separation requirement under note b.', source:cite, confidence: state==='unknown' ? 'inferred' : 'certain'};
  }
  if(notes === 'c'){
    const c8 = famA === '8' ? dgA : dgB;
    const special = (c8.un === '2794' || c8.un === '2795');
    const state = inferPhysicalState(c8);
    if(special || state === 'liquid'){
      return {status:'YELLOW', reason: special ? `UN ${c8.un} is specifically named in note c.` : `UN ${c8.un} is a liquid with primary hazard class 8 (note c).`, source:cite, confidence:'certain'};
    }
    if(state === 'unknown'){
      return {status:'MANUAL_REVIEW', reason:`Whether UN ${c8.un} is a liquid (which would trigger separation under note c) could not be determined from its Proper Shipping Name. Verify physical state directly.`, source:cite, confidence:'inferred'};
    }
    return {status:'GREEN', reason:'Not UN 2794/2795 and not a liquid with primary hazard class 8; no separation requirement under note c.', source:cite, confidence:'certain'};
  }
  if(notes === 'e'){
    const c9 = famA === '9' ? dgA : dgB;
    if(c9.un === '3090' || c9.un === '3480'){
      return {status:'YELLOW', reason:`UN ${c9.un} is specifically named in note e (lithium battery exception).`, source:cite, confidence:'certain'};
    }
    return {status:'GREEN', reason:'Not UN 3090/3480; no separation requirement under note e.', source:cite, confidence:'certain'};
  }
  return {status:'YELLOW', reason:'Physical separation required (HFFG Table 9:3).', source:cite, confidence:'certain'};
}

// Evaluate ONE pair of hazard families (not yet full DG-to-DG - see evaluateDgPair)
function evalFamilyPair(famA, dgA, famB, dgB){
  // Resolve division-1.4 vs division-1.4S distinction (both map to classFamily 'class1low';
  // Table 9:3 treats them differently — 1.4 is yellow-with-everything, 1.4S green-with-everything).
  const rawA = dgA.class, rawB = dgB.class;
  const key = (fam, dg) => {
    if(fam === 'class1high') return '1H';
    if(fam === 'class1low') return dg.class && dg.class.slice(-1) === 'S' ? '1.4S' : '1.4';
    return fam;
  };
  const kA = key(famA, dgA), kB = key(famB, dgB);
  if((kA === '1H' || kA === '1.4' || kA === '1.4S') && (kB === '1H' || kB === '1.4' || kB === '1.4S')){
    return null; // both class 1 — governed by Table 9:4
  }
  const cell = T93_MATRIX[kA] ? T93_MATRIX[kA][kB] : (T93_MATRIX[kB] ? T93_MATRIX[kB][kA] : undefined);
  if(cell === undefined || cell === null){
    return {status:'MANUAL_REVIEW', reason:'This combination could not be located in the digitized Table 9:3 dataset. Consult HFFG Table 9:3 directly.', source:'HFFG 9.8.2 / Table 9:3', confidence:'unresolved'};
  }
  const class1Dg = famA === 'class1high' ? dgA : (famB === 'class1high' ? dgB : null);
  const otherDg = famA === 'class1high' ? dgB : (famB === 'class1high' ? dgA : null);
  return applyT93Note(cell, class1Dg, otherDg, famA, dgA, famB, dgB);
}

// ---- Table 9:4 — Class 1 internal compatibility-group matrix ----
// Transcribed directly from the HFFG Table 9:4 source image (9.8.2, page 73) and
// validated programmatically for symmetry and footnote-consistency before use.
// T94_MATRIX cell values: 'G' green, 'R' red, or 'Y' + note letter(s) (a/b/c/d) — conditional.
// Group L's own diagonal (L vs L) is handled separately below (note e: same-UN-only).
const T94_EXCEPTION_UNS = {
  a: ['0255','0257','0267','0361'],   // group B exception (paired with C/D/E)
  b: ['0338','0339'],                 // group C exception (paired with B/F/G/H/J/K/N)
  c: ['0292','0293'],                 // group F exception (paired with C/D/E)
  d: ['0009','0010','0018','0019','0300','0301','0314','0315','0319','0320','0325'], // group G exception (paired with B/C/D/E/F)
};
const T94_NOTE_GROUP = {a:'B', b:'C', c:'F', d:'G'};

function evalClass1Pair(dgA, dgB){
  const gA = compatGroupOf(dgA.class), gB = compatGroupOf(dgB.class);
  if(!gA || !gB) return {status:'MANUAL_REVIEW', reason:'Compatibility group could not be determined for one or both items.', source:'HFFG Table 9:4', confidence:'unresolved'};
  if(gA === gB){
    if(gA === 'L'){
      if(dgA.un === dgB.un) return {status:'GREEN', reason:'Same UN number within compatibility group L (HFFG Table 9:4, note e).', source:'HFFG Table 9:4, note e', confidence:'certain'};
      return {status:'RED', reason:'Compatibility group L requires separation of each individual UN number; different UN numbers within group L are not permitted on the same aircraft (HFFG Table 9:4, note e).', source:'HFFG Table 9:4, note e', confidence:'certain'};
    }
    return {status:'GREEN', reason:`Same compatibility group (${gA}); no segregation requirement (HFFG Table 9:4).`, source:'HFFG Table 9:4', confidence:'certain'};
  }
  const cell = T94_MATRIX[gA] ? T94_MATRIX[gA][gB] : undefined;
  if(cell === undefined){
    return {status:'MANUAL_REVIEW', reason:`Compatibility groups ${gA} and ${gB} could not be located in the digitized Table 9:4 dataset.`, source:'HFFG Table 9:4', confidence:'unresolved'};
  }
  if(cell === 'G') return {status:'GREEN', reason:`Compatibility groups ${gA} and ${gB} carry no segregation requirement (HFFG Table 9:4).`, source:'HFFG Table 9:4', confidence:'certain'};
  if(cell === 'R') return {status:'RED', reason:`Compatibility groups ${gA} and ${gB} are not permitted on the same aircraft (HFFG Table 9:4).`, source:'HFFG Table 9:4', confidence:'certain'};
  // conditional: cell like 'Ya', 'Yab', 'Ybc', 'Ybd', 'Yd', etc.
  const notes = cell.slice(1).split('');
  let yellow = false; const hits = [];
  notes.forEach(n => {
    const grp = T94_NOTE_GROUP[n];
    const item = (gA === grp) ? dgA : (gB === grp ? dgB : null);
    if(item && T94_EXCEPTION_UNS[n].includes(item.un)){ yellow = true; hits.push(`UN ${item.un} (group ${grp}, note ${n})`); }
  });
  const citeNotes = notes.join(' & ');
  if(yellow){
    return {status:'YELLOW', reason:`Separation required between compatibility groups ${gA} and ${gB}; permitted under the named exception for ${hits.join(', ')} (HFFG Table 9:4, note ${citeNotes}).`, source:`HFFG Table 9:4, note ${citeNotes}`, confidence:'certain'};
  }
  return {status:'RED', reason:`Neither item qualifies for the named exception between compatibility groups ${gA} and ${gB}; not permitted on the same aircraft (HFFG Table 9:4, note ${citeNotes}).`, source:`HFFG Table 9:4, note ${citeNotes}`, confidence:'certain'};
}

// ---- top-level pair evaluator: considers primary + subsidiary hazard labels both ways ----
const STATUS_RANK = {GREEN:0, YELLOW:1, AMBER:1.5, ORANGE:2, MANUAL_REVIEW:2.5, RED:3};
function worse(a,b){ return STATUS_RANK[a.status] >= STATUS_RANK[b.status] ? a : b; }

function evaluateDgPair(dgA, dgB){
  const famsA = hazardFamilies(dgA), famsB = hazardFamilies(dgB);
  let best = null;
  for(const fa of famsA){
    for(const fb of famsB){
      let res;
      if(fa === 'class1high' && fb === 'class1high'){
        res = evalClass1Pair(dgA, dgB);
      } else {
        res = evalFamilyPair(fa, dgA, fb, dgB);
        if(res === null) res = evalClass1Pair(dgA, dgB);
      }
      if(!best) best = res; else best = worse(best, res);
    }
  }
  return best || {status:'GREEN', reason:'No interaction identified.', source:'HFFG 9.8.2', confidence:'certain'};
}

// Physical separation guidance (HFFG 9.8.2 / Table 9:2 note)
const SEPARATION_PHYSICAL_RULE = {
  distance:'0.8 m minimum horizontal separation',
  stacking:'Packages must not be positioned vertically above/below each other',
  barrier:'A separation barrier at least as high as the goods requiring separation, OR compatible cargo placed between the packages',
  barrierNote:'A "separation barrier" means separate cargo compartments, covered unit load devices (ULDs), or a separate partition equivalent to the wall of a covered ULD.',
  source:'HFFG 9.8.2 / Table 9:2 note'
};

// ---- Special Provision effects ----
function spEffects(spId){
  const sp = SP_DATA[spId];
  return sp ? sp.effects : [];
}
function spRecord(spId){ return SP_DATA[spId] || null; }

// ---- Approval / deviation determination for a single DG item ----
function determineApproval(dg, aircraftMode){
  const findings = [];
  for(const spId of dg.sp){
    const sp = SP_DATA[spId];
    if(!sp) continue;
    if(sp.effects.includes('requiresFSIDeviation') || sp.effects.includes('prohibitedUnlessDeviation')){
      findings.push({type:'AVSTEG_REQUIRED', authority:'FSI', spId, summary: sp.summary});
    } else if(sp.effects.includes('requiresFSIApproval')){
      findings.push({type:'FSI_APPROVAL_REQUIRED', authority:'FSI', spId, summary: sp.summary});
    } else if(sp.effects.includes('requiresCFApproval')){
      const scopeNote = sp.effects.includes('passengerAircraftRestriction') && aircraftMode==='cargo'
        ? null // some SPs only gate passenger transport; still surface but mark scope
        : null;
      findings.push({type:'CF_APPROVAL_REQUIRED', authority:'CF (or delegated authority)', spId, summary: sp.summary});
    }
  }
  return findings;
}

// ---- Transport status per aircraft mode (permitted / restricted / prohibited / CAO-only) ----
function determineTransportStatus(dg, aircraftMode){
  const isPax = aircraftMode === 'passenger';
  const packInstr = isPax ? dg.paxPackInstr : dg.caoPackInstr;
  const maxQty = isPax ? dg.paxMax : dg.caoMax;
  const forbidden = (maxQty === 'Förbjudet' || packInstr === 'Förbjudet');
  const other = {
    packInstr: isPax ? dg.caoPackInstr : dg.paxPackInstr,
    maxQty: isPax ? dg.caoMax : dg.paxMax,
  };
  const otherForbidden = (other.maxQty === 'Förbjudet' || other.packInstr === 'Förbjudet');

  const approvals = determineApproval(dg, aircraftMode);
  const hasDeviation = approvals.some(a => a.type === 'AVSTEG_REQUIRED');
  const hasApproval = approvals.some(a => a.type === 'FSI_APPROVAL_REQUIRED' || a.type === 'CF_APPROVAL_REQUIRED');

  let status, label;
  if(forbidden && otherForbidden){
    status = hasDeviation ? 'ORANGE' : 'RED';
    label = hasDeviation ? 'PROHIBITED — FSI DEVIATION REQUIRED' : 'PROHIBITED';
  } else if(forbidden && !otherForbidden){
    status = 'GREY';
    label = isPax ? 'PROHIBITED ON PASSENGER AIRCRAFT — CARGO AIRCRAFT ONLY (CAO)' : 'NOT PERMITTED IN THIS MODE — CHECK PASSENGER-AIRCRAFT COLUMN';
  } else if(hasDeviation){
    status = 'ORANGE'; label = 'PERMITTED — FSI DEVIATION REQUIRED';
  } else if(hasApproval){
    status = 'AMBER'; label = 'PERMITTED — APPROVAL REQUIRED';
  } else {
    status = 'GREEN'; label = 'PERMITTED';
  }
  return {status, label, packInstr, maxQty, forbidden, otherModeForbidden: otherForbidden, approvals};
}

// ---- Quantity check ----
function parseMaxQtyValue(maxQtyStr){
  if(!maxQtyStr) return null;
  if(maxQtyStr === 'Förbjudet' || maxQtyStr.startsWith('Omfattas ej') || maxQtyStr.startsWith('se ')) return null;
  const m = maxQtyStr.match(/^([\d.,]+)\s*(kg|g|L|ml|Wh)/);
  if(!m) return null;
  return {value: parseFloat(m[1].replace(',','.')), unit: m[2]};
}
function checkQuantity(dg, aircraftMode, enteredValue, enteredUnit){
  const isPax = aircraftMode === 'passenger';
  const maxStr = isPax ? dg.paxMax : dg.caoMax;
  if(maxStr === 'Obegr.' || (maxStr && maxStr.startsWith('Obegr.'))) return {status:'WITHIN', note:'No quantity limit specified (Obegr. / unlimited) beyond packaging requirements.'};
  if(!maxStr || maxStr === 'Förbjudet') return {status:'NA', note:'Not applicable — transport not permitted in this mode.'};
  if(maxStr.startsWith('se ')) return {status:'REVIEW', note:`Maximum quantity is defined by packing instruction ${maxStr.slice(3)} itself, not a fixed figure — consult that packing instruction.`};
  if(maxStr.startsWith('Omfattas ej')) return {status:'REVIEW', note:'Governed entirely by the referenced Special Provision, not a standard quantity limit.'};
  const parsed = parseMaxQtyValue(maxStr);
  if(!parsed || enteredValue == null || enteredValue === '') return {status:'UNKNOWN', note:'Enter a quantity to check against the HFFG limit.'};
  if(enteredUnit && parsed.unit !== enteredUnit){
    return {status:'REVIEW', note:`Limit is specified in ${parsed.unit}; entered unit (${enteredUnit}) does not match — verify manually.`};
  }
  if(enteredValue > parsed.value){
    return {status:'EXCEEDS', note:`Exceeds the standard limit of ${parsed.value} ${parsed.unit} per package.`, limit: parsed};
  }
  return {status:'WITHIN', note:`Within the standard limit of ${parsed.value} ${parsed.unit} per package.`, limit: parsed};
}

// ---- Whole-load evaluation ----
const LOAD_STATUS_RANK = {
  'LOAD NOT PERMITTED': 5,
  'AVSTEG REQUIRED': 4,
  'APPROVAL REQUIRED': 3,
  'MANUAL REVIEW REQUIRED': 2.5,
  'SEPARATION REQUIRED': 2,
  'LOAD ACCEPTABLE WITH RESTRICTIONS': 1,
  'LOAD ACCEPTABLE': 0,
};
function evaluateLoad(loadItems, aircraftMode){
  const perItem = loadItems.map(it => ({
    item: it,
    transport: determineTransportStatus(it.dg, aircraftMode),
  }));
  const pairFindings = [];
  for(let i=0;i<loadItems.length;i++){
    for(let j=i+1;j<loadItems.length;j++){
      const a = loadItems[i], b = loadItems[j];
      const res = evaluateDgPair(a.dg, b.dg);
      pairFindings.push({a, b, result: res});
    }
  }
  let overall = 'LOAD ACCEPTABLE';
  const reasons = [];

  perItem.forEach(p => {
    if(p.transport.status === 'RED'){ overall = maxStatus(overall, 'LOAD NOT PERMITTED'); reasons.push(`UN ${p.item.dg.un} is prohibited for transport in this mode.`); }
    else if(p.transport.status === 'GREY'){ overall = maxStatus(overall, 'LOAD NOT PERMITTED'); reasons.push(`UN ${p.item.dg.un} is not permitted in this aircraft mode (check the other column).`); }
    else if(p.transport.status === 'ORANGE'){ overall = maxStatus(overall, 'AVSTEG REQUIRED'); reasons.push(`UN ${p.item.dg.un} requires an FSI deviation.`); }
    else if(p.transport.status === 'AMBER'){ overall = maxStatus(overall, 'APPROVAL REQUIRED'); reasons.push(`UN ${p.item.dg.un} requires CF/FSI approval.`); }
  });
  pairFindings.forEach(pf => {
    if(pf.result.status === 'RED'){ overall = maxStatus(overall, 'LOAD NOT PERMITTED'); reasons.push(`UN ${pf.a.dg.un} and UN ${pf.b.dg.un} are not permitted on the same aircraft.`); }
    else if(pf.result.status === 'MANUAL_REVIEW'){ overall = maxStatus(overall, 'MANUAL REVIEW REQUIRED'); reasons.push(`UN ${pf.a.dg.un} and UN ${pf.b.dg.un}: compatibility could not be automatically resolved.`); }
    else if(pf.result.status === 'YELLOW'){ overall = maxStatus(overall, 'SEPARATION REQUIRED'); reasons.push(`UN ${pf.a.dg.un} and UN ${pf.b.dg.un} require physical separation.`); }
  });
  if(overall === 'LOAD ACCEPTABLE' && perItem.some(p => p.transport.status === 'YELLOW')){
    overall = 'LOAD ACCEPTABLE WITH RESTRICTIONS';
  }
  return {overall, perItem, pairFindings, reasons};
}
function maxStatus(cur, candidate){
  return (LOAD_STATUS_RANK[candidate] > LOAD_STATUS_RANK[cur]) ? candidate : cur;
}

const NOTOC_STORAGE_KEY = 'hffg_notoc_state_v1';
function loadNotocFromStorage(){
  try{
    const raw = localStorage.getItem(NOTOC_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        state.notoc.header = Object.assign(state.notoc.header, parsed.header || {});
        state.notoc.rows = Array.isArray(parsed.rows) ? parsed.rows : [];
        state.notoc.additionalInfo = parsed.additionalInfo || '';
        state.notoc.flightChief = parsed.flightChief || '';
        state.notoc.pilotInCommand = parsed.pilotInCommand || '';
      }
    }
  } catch(e){ /* ignore corrupt storage */ }
}
function saveNotocToStorage(){
  try{ localStorage.setItem(NOTOC_STORAGE_KEY, JSON.stringify(state.notoc)); } catch(e){ /* storage unavailable */ }
}

function notocRowFromDg(li){
  const t = determineTransportStatus(li.dg, state.aircraftMode);
  const pi = t.forbidden ? '-' : (t.packInstr || '-');
  const cao = (li.dg.paxMax === 'Förbjudet' && li.dg.caoMax !== 'Förbjudet') ? 'X' : '';
  return {
    dgId: li.dg.id, un: li.dg.un, psn: li.dg.psn,
    classDiv: li.dg.class ? (li.dg.class + (li.dg.subrisk ? ` (${li.dg.subrisk})` : '')) : '-',
    pg: li.dg.pg || '-', pi, cao, erg: li.dg.erg,
  };
}
function suggestAuthorizations(){
  const bits = [];
  state.load.forEach(li => {
    determineApproval(li.dg, state.aircraftMode).forEach(a => {
      const label = a.type==='AVSTEG_REQUIRED' ? `${a.spId} (FSI avsteg)` : a.type==='FSI_APPROVAL_REQUIRED' ? `${a.spId} (FSI approval)` : `${a.spId} (CF approval)`;
      if(!bits.includes(label)) bits.push(label);
    });
  });
  return bits.join(', ');
}
function generateNotocFromLoad(){
  const existingByDg = {};
  state.notoc.rows.forEach(r => { existingByDg[r.dgId] = r; });
  const newRows = state.load.map(li => {
    const base = notocRowFromDg(li);
    const prev = existingByDg[li.dg.id];
    return prev ? Object.assign({}, base, {
      pcs: prev.pcs, typePieces: prev.typePieces, net: prev.net, nem: prev.nem, gross: prev.gross, position: prev.position,
    }) : Object.assign(base, {pcs:'', typePieces:'', net:'', nem:'', gross:'', position:''});
  });
  state.notoc.rows = newRows;
  if(!state.notoc.header.authorizations || state.notoc.header.authorizations.trim()===''){
    state.notoc.header.authorizations = suggestAuthorizations();
  }
  saveNotocToStorage();
}

const CHECKLIST_STORAGE_KEY = 'hffg_checklist_state_v1';
function loadChecklistFromStorage(){
  try{
    const raw = localStorage.getItem(CHECKLIST_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        state.checklist.answers = parsed.answers || {};
        state.checklist.meta = Object.assign(state.checklist.meta, parsed.meta || {});
      }
    }
  } catch(e){ /* ignore corrupt storage */ }
}
function saveChecklistToStorage(){
  try{ localStorage.setItem(CHECKLIST_STORAGE_KEY, JSON.stringify(state.checklist)); } catch(e){ /* storage unavailable */ }
}

function uid(){ return 'L' + (state.loadUidSeq++); }
function esc(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function statusMeta(status){
  const map = {
    GREEN:  {cls:'green',  sym:'✓', label:'PERMITTED'},
    YELLOW: {cls:'yellow', sym:'▲', label:'SEPARATION REQUIRED'},
    AMBER:  {cls:'amber',  sym:'◆', label:'APPROVAL REQUIRED'},
    ORANGE: {cls:'orange', sym:'!', label:'AVSTEG REQUIRED'},
    RED:    {cls:'red',    sym:'✕', label:'PROHIBITED'},
    GREY:   {cls:'grey',   sym:'?', label:'MANUAL REVIEW'},
    MANUAL_REVIEW: {cls:'grey', sym:'?', label:'MANUAL REVIEW REQUIRED'},
  };
  return map[status] || map.GREY;
}
function statusBadge(status, textOverride, size){
  const m = statusMeta(status);
  const sizeCls = size === 'lg' ? ' status--lg' : '';
  return `<span class="status status--${m.cls}${sizeCls}"><span class="status__sym">${m.sym}</span>${esc(textOverride || m.label)}</span>`;
}
function sourceTag(kind, text){
  const map = {calculated:'source-tag--calculated', external:'source-tag--external', manual:'source-tag--manual', user:'source-tag--user'};
  const labels = {calculated:'Calculated from HFFG', external:'External reference required', manual:'Manual review required', user:'User-entered'};
  return `<span class="source-tag ${map[kind]}">${esc(text || labels[kind])}</span>`;
}
function confidenceToSourceKind(confidence){
  if(confidence === 'certain') return 'calculated';
  if(confidence === 'inferred' || confidence === 'pattern-default') return 'manual';
  if(confidence === 'unresolved') return 'manual';
  return 'calculated';
}

function findDgByFingerprint(un, cls, subrisk, pg){
  return DG_LIST.find(d => d.un===un && (d.class||'')===(cls||'') && (d.subrisk||'')===(subrisk||'') && (d.pg||'')===(pg||''));
}

const LOAD_STORAGE_KEY = 'hffg_load_state_v1';
function saveLoadToStorage(){
  try{
    const items = state.load.map(li => ({un: li.dg.un, cls: li.dg.class, subrisk: li.dg.subrisk, pg: li.dg.pg, qtyValue: li.qtyValue, qtyUnit: li.qtyUnit}));
    localStorage.setItem(LOAD_STORAGE_KEY, JSON.stringify({aircraftMode: state.aircraftMode, items}));
  } catch(e){ /* storage unavailable */ }
}
function loadLoadFromStorage(){
  try{
    const raw = localStorage.getItem(LOAD_STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.aircraftMode) state.aircraftMode = parsed.aircraftMode;
    if(parsed && Array.isArray(parsed.items)){
      state.load = parsed.items.map(it => {
        const dg = findDgByFingerprint(it.un, it.cls, it.subrisk, it.pg);
        return dg ? {uid: uid(), dg, qtyValue: it.qtyValue, qtyUnit: it.qtyUnit} : null;
      }).filter(Boolean);
    }
  } catch(e){ /* ignore corrupt storage */ }
}

function renderPlannerCompatibility(loadEval){
  const worst = loadEval.pairFindings.reduce((acc,pf)=> Math.max(acc, STATUS_RANK[pf.result.status]||0), 0);
  let bannerStatus = 'GREEN';
  if(worst >= 3) bannerStatus = 'RED'; else if(worst >= 2.5) bannerStatus = 'MANUAL_REVIEW'; else if(worst >= 1) bannerStatus = 'YELLOW';
  return `
  <div class="section">
    <div class="section__head">
      <span class="section__title">Compatibility / Separation Findings</span>
      <span class="section__actions"><button class="btn btn--sm btn--ghost" data-action="nav" data-view="matrix">Open full matrix →</button></span>
    </div>
    <div class="panel panel--pad">
      ${renderMiniMatrix()}
      <div class="divider"></div>
      ${loadEval.pairFindings.filter(pf=>pf.result.status!=='GREEN').length === 0
        ? `<div class="finding-row"><div class="finding-row__icon">${statusMeta('GREEN').sym}</div><div class="finding-row__body"><div class="finding-row__title">No compatibility conflicts identified</div><div class="finding-row__desc">All pairs in the current load are compatible per HFFG Table 9:3 / 9:4.</div></div></div>`
        : loadEval.pairFindings.filter(pf=>pf.result.status!=='GREEN').map(pf => `

}

  const items = state.load;
  const cellFor = (i,j) => {

    const res = evaluateDgPair(items[i].dg, items[j].dg);
    const m = statusMeta(res.status);
    return `<td class="matrix-cell mc-${m.cls}" data-action="openPairDrawer" data-a="${items[i].uid}" data-b="${items[j].uid}" title="UN ${items[i].dg.un} ↔ UN ${items[j].dg.un}"><span class="sym">${m.sym}</span></td>`;
  };
  return `<div class="matrix-scroll"><table class="matrix">
    <thead><tr><th></th>${items.map(li=>`<th>${esc(li.dg.un)}</th>`).join('')}</tr></thead>
    <tbody>
      ${items.map((li,i)=>`<tr><th class="rowhead">${esc(li.dg.un)}</th>${items.map((_,j)=>cellFor(i,j)).join('')}</tr>`).join('')}
    </tbody>
  </table></div>
  <div class="legend">
    <div class="legend__item"><span class="legend-sym legend-sym--green">✓</span>Compatible</div>

}

function renderPlannerFindings(loadEval){
  const items = state.load;
  const approvalRows = [];
  const quantityRows = [];
  items.forEach(li => {
    const t = determineTransportStatus(li.dg, state.aircraftMode);
    t.approvals.forEach(a => approvalRows.push({li, a}));
    if(li.qtyValue != null && li.qtyValue !== ''){
      const q = checkQuantity(li.dg, state.aircraftMode, parseFloat(li.qtyValue), li.qtyUnit);
      if(q.status === 'EXCEEDS' || q.status === 'REVIEW') quantityRows.push({li, q});
    }
  });
  return `
  <div class="grid-2">
    <div class="section">
      <div class="section__head"><span class="section__title">Approvals / Deviations</span></div>
      <div class="panel panel--pad">
        ${approvalRows.length === 0
          ? `<div class="finding-row"><div class="finding-row__icon">✓</div><div class="finding-row__body"><div class="finding-row__title">No CF/FSI approval or deviation identified</div><div class="finding-row__desc">Based on the Special Provisions attached to the items currently in the load.</div></div></div>`
          : approvalRows.map(r => `
            <div class="finding-row">
              <div class="finding-row__icon">${r.a.type==='AVSTEG_REQUIRED'?'!':'◆'}</div>
              <div class="finding-row__body">

              </div>
            </div>`).join('')}
      </div>
    </div>
    <div class="section">
      <div class="section__head"><span class="section__title">Packing / Quantity Issues</span></div>
      <div class="panel panel--pad">
        ${quantityRows.length === 0
          ? `<div class="finding-row"><div class="finding-row__icon">✓</div><div class="finding-row__body"><div class="finding-row__title">No quantity issues identified</div><div class="finding-row__desc">${items.some(i=>i.qtyValue==null||i.qtyValue==='') ? 'Enter quantities on load items to check against HFFG limits.' : 'All entered quantities are within the applicable HFFG limit.'}</div></div></div>`
          : quantityRows.map(r => `
            <div class="finding-row">
              <div class="finding-row__icon">⚠</div>
              <div class="finding-row__body">
                <div class="finding-row__title">UN ${esc(r.li.dg.un)} — ${r.q.status === 'EXCEEDS' ? 'EXCEEDS STANDARD LIMIT' : 'VERIFY MANUALLY'}</div>

            </div>`).join('')}
      </div>
    </div>
  </div>`;
}

    else if(d.type === 'sp') { const r = drawerSpContent(d.payload); title=r.title; subtitle=r.subtitle; body=r.body; }
    else if(d.type === 'pair') { const r = drawerPairContent(d.payload); title=r.title; subtitle=r.subtitle; body=r.body; }
    else if(d.type === 'pi') { const r = drawerPiContent(d.payload); title=r.title; subtitle=r.subtitle; body=r.body; }
    else if(d.type === 'chapter') { const r = drawerChapterContent(d.payload); title=r.title; subtitle=r.subtitle; body=r.body; }
    else if(d.type === 'glossary') { const r = drawerGlossaryContent(); title=r.title; subtitle=r.subtitle; body=r.body; }
    else if(d.type === 'annex2') { const r = drawerAnnex2Content(); title=r.title; subtitle=r.subtitle; body=r.body; }

function drawerDgContent(payload){
  const dg = payload.dg;
  const t = determineTransportStatus(dg, state.aircraftMode);
  const other = determineTransportStatus(dg, state.aircraftMode==='passenger'?'cargo':'passenger');
  let body = '';
  body += `<div class="detail-block">
    <div class="detail-block__label">Transport status — ${state.aircraftMode==='passenger'?'Passenger aircraft':'Cargo aircraft (CAO)'}</div>
    ${statusBadge(t.status, t.label, 'lg')}
  </div>`;
  if(t.forbidden && !t.otherModeForbidden){
    body += `<div class="note-box" style="margin-bottom:14px;"><strong>${state.aircraftMode==='passenger'?'Cargo aircraft (CAO)':'Passenger aircraft'} permitted:</strong> ${statusBadge('GREEN','PERMITTED')} — Packing Instruction ${esc(other.packInstr)}, max ${esc(other.maxQty)} per package.</div>`;
  }
  body += `<div class="kv-row"><div class="kv-row__label">UN Number</div><div class="kv-row__value">${esc(dg.un)}</div></div>`;
  body += `<div class="kv-row"><div class="kv-row__label">Proper Shipping Name</div><div class="kv-row__value" style="font-family:var(--sans);">${esc(dg.psn)}</div></div>`;
  body += `<div class="kv-row"><div class="kv-row__label">Class / Division</div><div class="kv-row__value">${esc(dg.class||'Not assigned — classified per shipment')}</div></div>`;
  body += `<div class="kv-row"><div class="kv-row__label">Subsidiary Risk</div><div class="kv-row__value">${esc(dg.subrisk||'—')}</div></div>`;
  body += `<div class="kv-row"><div class="kv-row__label">Packing Group</div><div class="kv-row__value">${esc(dg.pg||'—')}</div></div>`;
  body += `<div class="kv-row"><div class="kv-row__label">Excepted Quantity</div><div class="kv-row__value">${esc(dg.eq)}</div></div>`;
  body += `<div class="kv-row"><div class="kv-row__label">ERG Code</div><div class="kv-row__value" style="cursor:pointer; text-decoration:underline;" data-action="openErgFromDrawer" data-erg="${esc(dg.erg)}">${esc(dg.erg)}</div></div>`;

  body += `<div class="divider"></div><div class="detail-block__label">Passenger Aircraft</div>`;
  body += renderModeBlock(dg, 'passenger');
  body += `<div class="divider"></div><div class="detail-block__label">Cargo Aircraft Only (CAO)</div>`;
  body += renderModeBlock(dg, 'cargo');

  if(dg.ltdQtyPackInstr && dg.ltdQtyPackInstr !== 'Förbjudet'){
    body += `<div class="divider"></div><div class="detail-block__label">Limited Quantity</div>
      <div class="kv-row"><div class="kv-row__label">Packing Instr.</div><div class="kv-row__value">${esc(dg.ltdQtyPackInstr)}</div></div>
      <div class="kv-row"><div class="kv-row__label">Max qty / pkg</div><div class="kv-row__value">${esc(dg.ltdQtyMax)}</div></div>`;
  }

  if(dg.sp && dg.sp.length){
    body += `<div class="divider"></div><div class="detail-block__label">Special Provisions</div><div class="pill-row">`;
    dg.sp.forEach(s => { body += `<span class="pill" data-action="openSpDrawer" data-sp="${esc(s)}">${esc(s)}</span>`; });
    body += `</div>`;
    const approvals = determineApproval(dg, state.aircraftMode);
    if(approvals.length){
      body += `<div style="margin-top:8px;">` + approvals.map(a => {
        const kind = a.type==='AVSTEG_REQUIRED' ? 'ORANGE' : (a.type==='FSI_APPROVAL_REQUIRED'?'AMBER':'AMBER');
        return `<div class="finding-row"><div class="finding-row__icon">${a.type==='AVSTEG_REQUIRED'?'!':'◆'}</div><div class="finding-row__body"><div class="finding-row__title">${a.type==='AVSTEG_REQUIRED'?'AVSTEG REQUIRED':(a.type==='FSI_APPROVAL_REQUIRED'?'FSI APPROVAL REQUIRED':'CF APPROVAL REQUIRED')}</div><div class="finding-row__desc">Authority: ${esc(a.authority)} — ${esc(a.summary)}</div></div></div>`;
      }).join('') + `</div>`;
    }
  }

  if(dg.dataQualityNotes && dg.dataQualityNotes.length){
    body += `<div class="divider"></div>` + dg.dataQualityNotes.map(n => `<div class="note-box" style="margin-bottom:6px;">${sourceTag('manual')} ${esc(n)}</div>`).join('');
  }

  body += `<div class="divider"></div><div class="detail-block__label">Source</div>
    <div class="detail-block__text">${sourceTag('calculated')} HFFG Annex 3, Table B3:1 — UN ${esc(dg.un)}</div>`;

  return {title: `UN ${esc(dg.un)}`, subtitle: esc(dg.psn), body};
}

function drawerPairContent(payload){
  const a = state.load.find(l=>l.uid===payload.a), b = state.load.find(l=>l.uid===payload.b);
  if(!a||!b) return {title:'', subtitle:'', body:''};
  const res = evaluateDgPair(a.dg, b.dg);
  const m = statusMeta(res.status);
  let body = `
    <div class="grid-2" style="margin-bottom:14px;">
      <div class="panel panel--pad"><div class="small-caps">Item A</div><div style="font-weight:700; margin-top:2px;">UN ${esc(a.dg.un)}</div><div class="text-dim" style="font-size:11.5px;">${esc(a.dg.psn)}</div><div class="mono text-dim" style="font-size:11px; margin-top:3px;">Class ${esc(a.dg.class||'—')}${a.dg.subrisk?(' +'+esc(a.dg.subrisk)):''}</div></div>
      <div class="panel panel--pad"><div class="small-caps">Item B</div><div style="font-weight:700; margin-top:2px;">UN ${esc(b.dg.un)}</div><div class="text-dim" style="font-size:11.5px;">${esc(b.dg.psn)}</div><div class="mono text-dim" style="font-size:11px; margin-top:3px;">Class ${esc(b.dg.class||'—')}${b.dg.subrisk?(' +'+esc(b.dg.subrisk)):''}</div></div>
    </div>
    <div class="detail-block"><div class="detail-block__label">Result</div>${statusBadge(res.status, m.label, 'lg')}</div>
    <div class="detail-block"><div class="detail-block__label">Reason</div><div class="detail-block__text">${esc(res.reason)}</div></div>
  `;
  if(res.status === 'YELLOW'){
    body += `<div class="detail-block"><div class="detail-block__label">Physical separation required</div>
      <div class="detail-block__text">
        <div class="kv-row"><div class="kv-row__label">Horizontal distance</div><div class="kv-row__value">${SEPARATION_PHYSICAL_RULE.distance}</div></div>
        <div class="kv-row"><div class="kv-row__label">Vertical stacking</div><div class="kv-row__value" style="font-family:var(--sans);">${SEPARATION_PHYSICAL_RULE.stacking}</div></div>
        <div class="kv-row"><div class="kv-row__label">Barrier</div><div class="kv-row__value" style="font-family:var(--sans);">${SEPARATION_PHYSICAL_RULE.barrier}</div></div>
      </div>
      <div class="note-box" style="margin-top:8px;">${SEPARATION_PHYSICAL_RULE.barrierNote}</div>
    </div>`;
  }
  body += `<div class="divider"></div><div class="detail-block__text">${sourceTag(confidenceToSourceKind(res.confidence))} ${esc(res.source)}</div>`;
  return {title: `UN ${esc(a.dg.un)} ↔ UN ${esc(b.dg.un)}`, subtitle:'Pair compatibility', body};
}

function renderPiNumberedItem(it){
  let s = `<li>${esc(it.text)}`;

function renderPiBlock(b){

  }

function renderSectionText(paras){
  // paras: array of {text, note}. Render note blocks distinctly, list items with
  // hanging indent, everything else as plain paragraphs.
  const LIST_RE = /^(\d+\.|[ivx]{1,4}\.|•)\s/;
  return paras.map(p => {
    const isList = LIST_RE.test(p.text);
    const style = isList
      ? 'margin:0 0 7px; padding-left:18px; text-indent:-18px;'
      : 'margin:0 0 9px;';
    if(p.note){
      return `<div class="note-box" style="margin:0 0 9px;"><strong>Anm</strong> — ${esc(p.text)}</div>`;
    }
    return `<p style="${style}">${esc(p.text)}</p>`;
  }).join('');
}

function drawerChapterContent(num){
  const chapter = CHAPTER_DATA.find(c => c.num === num);
  if(!chapter) return {title:'', subtitle:'', body:'<div class="empty-state">Not found.</div>'};
  const body = chapter.sections.map(s => {
    const sizes = {1:'15px', 2:'13.5px', 3:'12.5px', 4:'12px'};
    const weights = {1:800, 2:700, 3:700, 4:600};
    const marginTop = s.level === 1 ? '0' : (s.level === 2 ? '18px' : '13px');
    let html = `<div style="font-size:${sizes[s.level]||'12px'}; font-weight:${weights[s.level]||600}; margin:${marginTop} 0 6px; color:var(--text);">${esc(s.num)} ${esc(s.title)}</div>`;
    if(s.paras && s.paras.length) html += `<div class="detail-block__text" style="margin-bottom:4px;">${renderSectionText(s.paras)}</div>`;
    return html;
  }).join('');
  return {
    title: `Chapter ${num}`, subtitle: esc(chapter.title),
    body: body + `<div class="divider"></div><div class="detail-block__text">${sourceTag('calculated')} HFFG, Chapter ${num}</div>`,
  };
}

function renderDatabase(){
  let rows = state.dbQuery.trim() ? searchDg(state.dbQuery, 5000) : DG_LIST.slice();
  const sortKey = state.dbSort;
  rows = rows.slice().sort((a,b) => {
    let av = a[sortKey] || '', bv = b[sortKey] || '';
    return av.localeCompare(bv, undefined, {numeric:true}) * state.dbSortDir;
  });
  const total = rows.length;
  const cols = [['un','UN'],['psn','Proper Shipping Name'],['class','Class'],['subrisk','Sub-risk'],['pg','PG'],['sp','SP'],['erg','ERG']];
  return `
  <div class="searchbar-row">

const SP_DATA = {"SP1":{"summary":"Passenger aircraft transport requires CF (or CF-delegated) approval.","effects":["requiresCFApproval","passengerAircraftRestriction","documentationRequirement","packingCondition"],"fullText":"SP1 Ämnet eller föremålet får transporteras på passagerarflyg endast efter tillstånd från\nCF eller den CF utser. Godset ska förpackas och begränsas enligt kolumn I respektive\nJ i ämnesförteckningen. Om det inte är möjligt att följa begränsningarna i kolumn I\nrespektive J så ska godset förpackas och begränsas enligt de villkor som beslutats av\nCF eller den CF utser.\nGodsdeklarationen ska innehålla informationen ”SP1” under authorizations."},"SP2":{"summary":"Passenger or cargo aircraft transport requires CF (or CF-delegated) approval.","effects":["requiresCFApproval","passengerAircraftRestriction","cargoAircraftRelevant","documentationRequirement","packingCondition"],"fullText":"SP2 Ämnet eller föremålet får transporteras på passagerarflyg eller fraktflyg endast efter\ntillstånd från CF eller den CF utser. Vid transport på passagerarflyg ska godset förpackas och begränsas enligt kolumn I respektive J i ämnesförteckningen. Vid transport\npå fraktflyg får även godset förpackas och begränsas enligt kolumn K respektive L.\nOm det inte är möjligt att följa begränsningarna i tillämpliga kolumner I till och med L\nså ska godset förpackas och begränsas enligt de villkor som beslutats av CF eller den\nCF utser.\nGodsdeklarationen ska innehålla informationen ”SP2” under authorizations"},"SP3":{"summary":"Prohibited for transport. Only permitted under an FSI-approved deviation (avsteg).","effects":["requiresFSIDeviation","prohibitedUnlessDeviation"],"fullText":"SP3 Ämnet eller föremålet är förbjudet för transport och får transporteras endast enligt\nvillkor som anges i avsteg från FSI."},"SP4":{"summary":"Permitted on helicopter/TP84 with crew-supervised load; other aircraft need CF approval.","effects":["requiresCFApproval","passengerAircraftRestriction","documentationRequirement"],"fullText":"SP4 Ämnet eller föremålet får transporteras på passagerarflyg vid transport med helikopter eller TP84 och under förutsättning att lasten övervakas av besättningen. För övriga\nluftfartyg krävs tillstånd från CF eller den CF utser.\nGodsdeklarationen ska innehålla informationen ”SP4” under authorizations"},"SP5":{"summary":"Cells/batteries meeting stated lithium-content and energy limits are excepted from most HFFG requirements, subject to marking, packaging and (for loose cells/batteries on passenger aircraft) CF approval.","effects":["requiresCFApproval","passengerAircraftRestriction","markingRequirement","quantityCondition","packingCondition","exceptionFromHFFG"],"fullText":"SP5 Celler och batterier som överlämnas till transport omfattas inte av övriga bestämmelser i HFFG om följande bestämmelser är uppfyllda:\n1. En primär litiumcell eller cell med litiumlegering innehåller högst 1 g litium och\nen cell med litiumjoner har en nominell energi i wattimmar om högst 20 Wh.\n2. Ett primärt litiumbatteri eller batteri med litiumlegering innehåller en totalmängd\npå högst 2 g litium och ett litiumjonbatteri har en nominell energi i wattimmar om\nhögst 100Wh. Litiumjonbatterier som omfattas av denna bestämmelse ska vara\nmärkta med nominell energi i wattimmar på ytterhöljet, förutom sådan tillverkade före den 1 januari 2009.\nAnm\nNär litiumbatterier i överensstämmelse med IATA-DGR, 3.9.2.6.1 (f) transporteras\nenligt denna särbestämmelse, får den totala mängden litium i alla primära litiumceller i batteriet inte överstiga 1,5 g och den totala kapaciteten för alla litiumjonceller\nsom finns i batteriet får inte överstiga 10Wh (se SP13).\n1. Varje cell eller batteri uppfyller bestämmelserna i IATA-DGR, 3.9.2.6.1 (a), (e), (f)\nom tillämpligt samt (g).\n2. Celler och batterier som inte är inbyggda i utrustning får endast transporteras på\npassagerarflyg efter tillstånd från CF eller den CF utser samt under förutsättning\natt de förpackats och begränsats enligt vad som anges under (e).\n3. Celler och batterier ska, om de inte är inbyggda i utrustning, vara förpackade\ni innerförpackningar som fullständigt omsluter cellen eller batteriet. Celler och\nbatterier ska vara skyddade så att kortslutning förhindras. Detta innefattar skydd\nmot kontakt med elektriskt ledande material i samma förpackning som skulle\nkunna leda till kortslutning. Innerförpackningarna ska förpackas i kraftiga ytterförpackningar som klarar en fallprovning från 1,2 m höjd i kollits alla orienteringsriktningar utan att cellerna eller batterierna i kollit skadas, utan förskjutning\nav innehållet som leder till beröring mellan batterierna (eller cellerna) och utan att\ninnehållet kommer ut. Bruttovikten på varje enskilt kolli får inte överstiga 30 kg.\n4. Celler och batterier som är inbyggda i utrustning, ska vara skyddade mot skador\noch kortslutning och utrustningen ska vara försedd med effektiva anordningar för\natt förhindra oavsiktlig aktivering. Denna bestämmelse gäller inte för anordningar som är avsedda att vara aktiva under transport (RFID-transpondrar, klockor,\nsensorer, etc.) och som inte kan generera farlig värmeutveckling. När batterier är\ninbyggda i utrustning, ska utrustningen förpackas i kraftiga ytterförpackningar\nsom tillverkats av ändamålsenligt material med tillräcklig styrka och lämplig konstruktion i förhållande till förpackningens kapacitet och avsedda användningsområde, såvida inte batteriet har ett likvärdigt skydd från utrustningen den är\ninbyggd i.\n5. Varje kolli ska förses med lämplig märkning för litiumbatterier enligt figur 7.1A.\nMärkningskrav gäller emellertid inte för\ni. kollin som innehåller knappcellsbatterier installerade i utrustning (inklusive kretskort), och\nii. kollin som innehåller högst fyra celler eller högst två batterier installerade i\nutrustning i de fall sändningen innehåller högst två kollin.\nNär kollin placerats i en overpack, ska märkningen för litiumbatteri antingen vara väl\nsynlig eller återges på utsidan av overpack som då även ska märkas med uttrycket\n”OVERPACK”. Bokstäverna i uttrycket ”OVERPACK” ska vara minst 12 mm höga.\n174 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP6":{"summary":"Trots att ämnet tillhör förpackningsgrupp III enligt kolumn E i ämnesförteckningen så ska ämnet förpackas i en förpackning som är…","effects":["quantityCondition","packingCondition"],"fullText":"SP6\n(A803)\nTrots att ämnet tillhör förpackningsgrupp III enligt kolumn E i ämnesförteckningen så\nska ämnet förpackas i en förpackning som är typgodkänd och uppfyller kraven för\nförpackningsgrupp II. Detta gäller inte när ämnet är förberett för transport i enlighet\nmed bestämmelserna om begränsad mängd."},"SP7":{"summary":"Batterier, batteridriven utrustning eller batteridrivna fordon där det föreligger risk för farlig värmeutveckling måste…","effects":[],"fullText":"SP7\n(A164)\nBatterier, batteridriven utrustning eller batteridrivna fordon där det föreligger risk för\nfarlig värmeutveckling måste iordningsställas för transport på ett sådant sätt att man\nförhindrat kortslutning och att utrustningen eller fordonet oavsiktligt aktiveras."},"SP8":{"summary":"Lithium cells/batteries confirmed damaged or defective (not conforming to tested type) must follow special handling; may require FSI approval depending on condition.","effects":["requiresFSIApproval","markingRequirement","documentationRequirement"],"fullText":"SP8 Litiumjonceller eller -batterier och primära litiumceller eller -batterier som har konstaterats vara så skadade eller defekta så att de inte längre överensstämmer med den typ\nsom har provats enligt tillämpliga bestämmelser i testhandboken ska följa kraven i\ndenna särbestämmelse.\n1. Celler och batterier identifierade som skadade eller defekta och som är benägna\natt snabbt falla isär, reagera farligt, alstra lågor eller generera farlig värmeutveckling eller avge giftiga, frätande eller brandfarliga gaser eller ångor under normala\ntransportförhållanden får endast transporteras efter godkännande från FSI.\n2. Celler och batterier som inte bedöms vara så skadade att risker enligt (a) föreligger ska transporteras enligt de villkor som anges i beslut från CF eller den CF\nutser. Det kan t.ex vara batterier som kan ha utsatts för yttre påverkan eller\nkonstaterats ha andra brister men som inte visar tecken på att avge värme eller\nskador som gör att de kan läcka.\nAnm\nVid utvärdering av ett batteri som skadat eller defekt, ska typen av batteri och dess\ntidigare användning och felaktiga användning tas med i beaktande.\nKollin ska vara märkta med ”SKADADE/DEFEKTA LITIUMJONBATTERIER” eller\n”SKADADE/DEFEKTA LITIUMBATTERIER, PRIMÄRA”, utifrån vad som är tillämpligt.\nGodsdeklarationen ska innehålla informationen ”SP8” under authorizations."},"SP9":{"summary":"Lithium cells/batteries identified for disposal or recycling follow special handling and marking requirements.","effects":["markingRequirement","documentationRequirement"],"fullText":"SP9 Litiumjonceller och -batterier och primära litiumceller och -batterier samt utrustning\nsom innehåller sådana celler och batterier, som transporteras för bortskaffande eller\nåtervinning får transporteras endast enligt de villkor som anges i beslut från CF eller\nden CF utser.\nKollin ska vara märkta med ”LITHIUM BATTERIES FOR DISPOSAL” eller ”LITHIUM BATTERIES FOR RECYCLING”.\nGodsdeklarationen ska innehålla informationen ”SP9” under authorizations.\nAnm\nBatterier som har konstaterats vara skadade eller defekta ska transporteras enligt\nsärbestämmelse SP8. Denna särbestämmelse gäller också för celler och batterier av\nannan typ än litium, men i dessa fall ska kollin inte märkas med texten ”LITHIUM\nBATTERIES FOR DISPOSAL” eller ”LITHIUM BATTERIES FOR RECYCLING”."},"SP10":{"summary":"Quantity-limited provision requiring CF approval above the stated threshold.","effects":["requiresCFApproval","documentationRequirement","quantityCondition"],"fullText":"SP10\n(A99)\nCeller och batterier som överstiger de mängdbegränsningar som anges i kolumn J\nrespektive L i ämnesförteckningen får transporteras endast efter tillstånd från CF eller\nden CF utser.\nGodsdeklarationen ska innehålla informationen ”SP10” under authorizations."},"SP11":{"summary":"Trots att ämnet tillhör förpackningsgrupp III enligt kolumn E i ämnesförteckningen så ska ämnet förpackas i en förpackning som är…","effects":["quantityCondition","packingCondition"],"fullText":"SP11\n(A804)\nTrots att ämnet tillhör förpackningsgrupp III enligt kolumn E i ämnesförteckningen\nså ska ämnet förpackas i en förpackning som är typgodkänd och uppfyller kraven\nför förpackningsgrupp I. Detta gäller inte när aerosoler är förberedda för transport i\nenlighet med bestämmelserna om begränsad mängd."},"SP12":{"summary":"Short-form packing condition (see full text).","effects":[],"fullText":"SP12 Faroetikett ska överensstämma med förlagan i IATA-DGR, figure 7.3X."},"SP13":{"summary":"Quantity condition applicable to cells/batteries transported under SP5.","effects":["quantityCondition"],"fullText":"SP13\n(A213)\nLitiumbatterier som överensstämmer med IATA-DGR, 3.9.2.6.1 (f) och som innehåller\nbåde primära litiumceller och laddningsbara litiumjonceller ska tillordnas UN 3090\neller 3091 beroende på vad som är tillämpligt. När sådana batterier transporteras\nenligt särbestämmelse SP5, får den totala mängden litium i alla primära litiumceller i\nbatteriet inte överstiga 1,5 g och den totala kapaciteten får inte överstiga 10 Wh för alla\nlitiumjonceller som finns i batteriet."},"SP14":{"summary":"Packing and quantity condition (see full text).","effects":["quantityCondition","packingCondition"],"fullText":"SP14 Litiumjonceller eller batterier ska om de är laddade med mer än 30% av sin laddningskapacitet vara individuellt förpackade ett och ett i en innerförpackning och vara\nplacerade i en ytterförpackning. Innerförpackningen eller ytterförpackningen ska vara\ntät för att förhindra eventuellt läckage av elektrolyt. Innerförpackningen ska omges av\nett svårbrännbart, icke elektriskt ledande, värmeisolerande material i tillräcklig mängd\nför att skydda mot farlig värmeutveckling."},"SP15":{"summary":"Packing condition applicable to this entry (see full text).","effects":["packingCondition"],"fullText":"SP15\n(A802)\nTrots att ämnet eller föremålet inte har en förpackningsgrupp angiven i kolumn E i\nämnesförteckningen så ska förpackningen vara typgodkänd och uppfylla kraven för\nförpackningsgrupp II. Detta gäller inte om annat anges i avsedd förpackningsinstruktion eller för litiumbatterier som iordningsställts enligt särbestämmelse SP5."},"SP16":{"summary":"Celler och batterier som inte uppfyller kraven i IATA-DGR, 3.9.2.6.1 (a) beträffande provningsbestämmelserna i UN Manual &…","effects":["documentationRequirement","packingCondition"],"fullText":"SP16\n(A88)\nCeller och batterier som inte uppfyller kraven i IATA-DGR, 3.9.2.6.1 (a) beträffande\nprovningsbestämmelserna i UN Manual & Criteria, part III, sub-chapter 38.3, får transporteras om de ingår i produktionsserier på högst 100 celler eller batterier eller för\nproduktionsprototyper av celler eller batterier samt att följande krav är uppfyllda.\n1. De ska vara förpackade enligt ICAO-TI, förpackningsinstruktion P910 (b)\n2. Godsdeklarationen ska innehålla informationen ”SP16” under authorizations.\nSkadade eller defekta celler, batterier, eller celler och batterier i utrustning ska transporteras enligt särbestämmelse SP8. Celler, batterier, eller celler och batterier i utrustning som transporteras för bortskaffande eller återvinning ska transporteras enligt\nsärbestämmelse SP9."},"SP17":{"summary":"Avfall som innehåller smittämnen i kategori A måste tilldelas UN 2814 eller UN 2900. Avfall som transporteras som UN 3291 är…","effects":[],"fullText":"SP17\n(A117)\nAvfall som innehåller smittämnen i kategori A måste tilldelas UN 2814 eller UN 2900.\nAvfall som transporteras som UN 3291 är avfall som innehåller smittämnen i kategori B eller avfall som rimligen tros ha låg sannolikhet för att innehålla smittsamma\nämnen. Dekontaminerat avfall som tidigare innehöll smittämnen anses inte omfattas\nav bestämmelserna i HFFG om inte kriterierna för någon annan klass eller division är\nuppfyllda.\n176 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP18":{"summary":"Packing condition (see full text).","effects":["packingCondition"],"fullText":"SP18 Förpackningen ska vara hermetiskt tillsluten och överensstämma med kraven i IATADGR, förpackningsinstruktion 472."},"SP19":{"summary":"Condition with no further HFFG-specific requirement beyond general provisions (see full text).","effects":[],"fullText":"SP19 UN1830 avser \"Sulphuric acid\" med en koncentration över 51%"},"SP20":{"summary":"Condition (see full text).","effects":[],"fullText":"SP20 UN1344 avser \"Trinitrophenol, wetted\"/\"Picric acid, wetted\" med en viktprocent vatten som är 30% eller mer"},"SP21":{"summary":"Condition (see full text).","effects":[],"fullText":"SP21 UN1356 avser \"Trinitrotoluene, wetted\"/\"TNT, wetted\" med en viktprocent vatten som\när 30% eller mer"},"SP22":{"summary":"Passenger/cargo restriction with quantity and packing conditions (see full text).","effects":["passengerAircraftRestriction","cargoAircraftRelevant","documentationRequirement","quantityCondition","packingCondition"],"fullText":"SP22 (A4) Denna särbestämmelse gäller för vätskor som avger ångor som är mycket giftiga,\ndet vill säga en toxicitet vid inandning som motsvarar förpackningsgrupp I. Dessa\nämnen är inte tillåtna att transporteras på passagerarflyg, men de får transporteras på\nfraktflyg (CAO) om de är förpackade i enlighet med förpackningsinstruktionerna som\ngäller för avsett ämne, förpackningsgrupp I samt att den maximala nettomängden per\nförpackning inte överstiger 5 L. Om gods enligt denna särbestämmelse samemballeras\nmed annat farligt gods i en ytterförpackning, ska Q-värdet för denna post beräknas\nmed den nettomängd som anges i denna specialbestämmelse.\nVid transport enligt denna särskilda bestämmelse ska godsdeklarationen innehålla\ninformationen ”SP22” under authorizations."},"SP23":{"summary":"Passenger/cargo restriction with quantity and packing conditions (see full text).","effects":["passengerAircraftRestriction","cargoAircraftRelevant","documentationRequirement","quantityCondition","packingCondition"],"fullText":"SP23 (A5) Denna särbestämmelse gäller för fasta ämnen som har en toxicitet vid inandning\nsom motsvarar förpackningsgrupp I. Dessa ämnen är inte tillåtna att transporteras\npå passagerarflyg, men de får transporteras på fraktflyg (CAO) om de är förpackade\ni enlighet med förpackningsinstruktionerna som gäller för avsett ämne, förpackningsgrupp I samt att den maximala nettomängden per förpackning inte överstiger 5 L.\nOm gods enligt denna särbestämmelse samemballeras med annat farligt gods i en\nytterförpackning, ska Q-värdet för denna post beräknas med den nettomängd som\nanges i denna specialbestämmelse.\nVid transport enligt denna särskilda bestämmelse ska godsdeklarationen innehålla\ninformationen ”SP23” under authorizations."},"SP24":{"summary":"Packing condition (see full text).","effects":["packingCondition"],"fullText":"SP24 (A8) Om detta gods är i form av tabletter som inte smular sig, ska det inplaceras i förpackningsgrupp III"},"SP25":{"summary":"Dessa ämnen omfattas inte av bestämmelserna i HFFG om de innehåller högst 50 % magnesium.","effects":[],"fullText":"SP25\n(A15)\nDessa ämnen omfattas inte av bestämmelserna i HFFG om de innehåller högst 50 %\nmagnesium."},"SP26":{"summary":"Marking and quantity condition (see full text).","effects":["markingRequirement","quantityCondition"],"fullText":"SP26\n(A19)\nBrandsläckare som omfattas av denna benämning får vara utrustad med sprängpatron\nför att säkerställa dess funktion (sprängpatron för mekanisk drivning enligt klassificering 1.4C eller 1.4S), utan att tillhörigheten till klass 2 (division 2.2) därigenom förändras, förutsatt att totalmängden deflagrerande explosivämnen (drivmedel) omfattar\nhögst 3,2 g per brandsläckare.\nBrandsläckare ska tillverkas, provas, godkännas och märkas enligt bestämmelserna\nsom tillämpas i tillverkningslandet.\nAnm\n”Bestämmelser som tillämpas i tillverkningslandet” innebär de bestämmelser som är\ntillämpliga i tillverkningslandet eller i användarlandet.\nBrandsläckare under denna benämning inkluderar:\n1. portabla brandsläckare för manuell hantering och användning,\n2. brandsläckare för installation i luftfartyg,\n3. brandsläckare monterade på hjul för manuell hantering,\n4. brandsläckarutrustning monterad på hjul eller på hjulförsedda plattformar eller\nenheter, som dras eller förflyttas som en släpvagn, och\n5. brandsläckare bestående av ett icke rullbart tryckfat och utrustning, och som\nhanteras med till exempel gaffeltruck eller lyftkran vid lastning eller lossning.\nTryckkärl som innehåller gaser för användning i ovan nämnda brandsläckare eller för\nanvändning i stationära brandsläckningssystem ska uppfylla kraven i IATA-DGR, 6.4\noch alla andra bestämmelser som är tillämpliga för det aktuella farliga godset när\ndessa tryckkärl transporteras separat."},"SP27":{"summary":"Ämnet ska, under transporten, skyddas så det inte utsätts för direkt solljus eller värme från andra typer av värmekällor. Det ska…","effects":["documentationRequirement"],"fullText":"SP27\n(A20)\nÄmnet ska, under transporten, skyddas så det inte utsätts för direkt solljus eller\nvärme från andra typer av värmekällor. Det ska dessutom placeras i ett väl ventilerat\nutrymme. Avsändaren ska särskilt ange dessa restriktioner på godsdeklarationen."},"SP28":{"summary":"Den totala mängden explosivämne i RSV-laddningar och detonerande stubin får inte överstiga 10 kg per sammansatt…","effects":["quantityCondition"],"fullText":"SP28\n(A24)\nDen totala mängden explosivämne i RSV-laddningar och detonerande stubin får inte\növerstiga 10 kg per sammansatt performeringsanordning."},"SP29":{"summary":"Ämnet får endast tillordnas division 4.1 om det är förpackat så att det kan säkerställas att koncentrationen utspädningsmedel…","effects":["packingCondition"],"fullText":"SP29\n(A40)\nÄmnet får endast tillordnas division 4.1 om det är förpackat så att det kan säkerställas\natt koncentrationen utspädningsmedel inte kan sjunka under fastställt gränsvärde\nunder transporten."},"SP30":{"summary":"Ämnet eller föremålet får förpackas i en förpackning som inte är typgodkänd.","effects":["packingCondition"],"fullText":"SP30\n(A48)\nÄmnet eller föremålet får förpackas i en förpackning som inte är typgodkänd."},"SP31":{"summary":"Batterier avsedda för luftfartyg får transporteras på passagerarflyg med en begränsning på max 100 kg per förpackning.…","effects":["passengerAircraftRestriction","documentationRequirement","quantityCondition","packingCondition"],"fullText":"SP31\n(A51)\nBatterier avsedda för luftfartyg får transporteras på passagerarflyg med en begränsning på max 100 kg per förpackning.\nGodsdeklarationen ska innehålla informationen ”SP31” under authorizations."},"SP32":{"summary":"Vattenlösning med högst 24 volymprocent alkohol omfattas inte av bestämmelserna i HFFG.","effects":[],"fullText":"SP32\n(A58)\nVattenlösning med högst 24 volymprocent alkohol omfattas inte av bestämmelserna i\nHFFG."},"SP33":{"summary":"Denna beteckning får endast användas med medgivande av behörig myndighet i tillverkningslandet och endast då ingen annan lämplig…","effects":[],"fullText":"SP33\n(A62)\nDenna beteckning får endast användas med medgivande av behörig myndighet i\ntillverkningslandet och endast då ingen annan lämplig beteckning kan användas för\nämnet eller föremålet.\n178 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP34":{"summary":"Batterier räknas som läckagesäkra om de klarar nedan angivna vibrations- och tryckprovning utan vätskeläckage.…","effects":["packingCondition"],"fullText":"SP34\n(A67)\nBatterier räknas som läckagesäkra om de klarar nedan angivna vibrations- och tryckprovning utan vätskeläckage.\nVibrationsprovning:\nBatteriet spänns fast på provplattan i en vibrationsmaskin och utsätts för en enkel\nsinusformad rörelse med amplituden 0,8 mm (1,6 mm totalutslag). Frekvensen varieras mellan 10 Hz och 55 Hz i steg om 1 Hz/min. Hela frekvensområdet genomlöps i\nbåda riktningar på 95 ± 5 minuter för varje montering (vibrationsriktning) av batteriet.\nBatteriet provas lika länge i tre olika lägen med mot varandra vinkelräta vibrationsriktningar (innefattande ett läge då eventuella fyllnings- och ventilationsöppningar är\nuppochner).\nTryckprovning:\nEfter utfört vibrationsprov lagras batteriet i sex timmar vid 24 ºC ± 4 ºC medan det\nutsätts för en tryckdifferens på minst 88 kPa. Batteriet provas under minst sex timmar\ni vart och ett av tre lägen med mot varandra vinkelräta lodriktningar (innefattande ett\nläge då eventuella fyllnings- och ventilationsöppningar är uppochner).\nLäckagesäkra batterier omfattas inte av bestämmelserna i HFFG, om elektrolyten vid\nen temperatur av 55 ºC i händelse av brott eller sprickor i behållaren inte läcker,\ningen fri vätska finns som kan komma ut och polerna hos batteriet i förpackning i\ntransportfärdigt skick är säkrade mot kortslutning."},"SP35":{"summary":"Följande föremål omfattas inte av HFFG när de transporteras som last: 1. andra artiklar än lampor, till exempel termometrar,…","effects":["quantityCondition","packingCondition"],"fullText":"SP35\n(A69)\nFöljande föremål omfattas inte av HFFG när de transporteras som last:\n1. andra artiklar än lampor, till exempel termometrar, brytare och reläer, som var\noch en innehåller totalt högst 15 g kvicksilver då de är installerade som en\nintegrerad del av en maskin eller utrustning. De ska vara monterade så att det\när osannolikt att få läckage av kvicksilver på grund av stötar eller slag under\nnormala transportförhållanden.\n2. andra artiklar än lampor, som var och en innehåller totalt högst 100 mg kvicksilver, gallium eller inert gas och förpackas så att mängden kvicksilver, gallium eller\ninert gas per förpackning inte överstiger 1 gram."},"SP36":{"summary":"Item is excepted from (parts of) HFFG requirements under stated conditions (see full text).","effects":["exceptionFromHFFG"],"fullText":"SP36 Förbränningsmotorer, inklusive fordon och utrustningar med förbränningsmotorer,\nundantas från bestämmelserna i HFFG om tillämpliga villkor i delavsnitt 1.2 är uppfyllda."},"SP37":{"summary":"Ett ämne som är namngivet i ämnesförteckningen (HFFG, Tabell B3:1 (sida 87)) eller IATA-DGR, 4.2, får inte transporteras under…","effects":[],"fullText":"SP37\n(A72)\nEtt ämne som är namngivet i ämnesförteckningen (HFFG, Tabell B3:1 (sida 87)) eller\nIATA-DGR, 4.2, får inte transporteras under denna benämning. Ämnen, som transporteras under denna benämning, får innehålla högst 20 % nitrocellulosa, förutsatt att\nnitrocellulosan innehåller högst 12,6 % kväve (i torrsubstansen)."},"SP38":{"summary":"Marking and packing condition (see full text).","effects":["markingRequirement","packingCondition"],"fullText":"SP38\n(A87)\nFöremål som inte är omslutna av förpackningsmaterial eller på annat sätt täckta, och\nsom därigenom är tydligt identifierbara omfattas inte av bestämmelserna i kapitel 7\nrörande märkning och etikettering."},"SP39":{"summary":"Requires FSI approval (see full text).","effects":["requiresFSIApproval"],"fullText":"SP39\n(A94)\nBatterier eller celler som innehåller natrium får inte innehålla annat farligt gods än\nnatrium, svavel- eller natriumföreningar (t.ex. natriumpolysulfider och natriumtetrakloroaluminat).\nBatterier eller celler får inte överlämnas för transport vid en temperatur som innebär\natt det finns risk för flytande natrium i batteriet eller cellen såvida inte särskilt godkännande och villkor erhållits från FSI.\nCeller ska ha hermetiskt tillslutna metallhöljen som helt omsluter det farliga godset\noch som förhindrar läckage under normala transportförhållanden.\nBatterier ska bestå av celler som är säkrade inuti batteriet och helt omslutna av ett\nmetallhölje som är konstruerat för att förhindra läckage under normala transportförhållanden."},"SP40":{"summary":"Dessa benämningar kan användas för ämnen som är farliga för miljön men som inte uppfyller klassificeringskriterierna för någon…","effects":[],"fullText":"SP40\n(A97)\nDessa benämningar kan användas för ämnen som är farliga för miljön men som inte\nuppfyller klassificeringskriterierna för någon annan klass eller annat ämne i klass 9.\nKlassificering ska baseras på kriterierna som anges i IATA-DGR, 3.9.2.4. Benämningen\nkan också användas för avfall som inte omfattas av dessa föreskrifter men som omfattas av Baselkonventionen om kontroll av gränsöverskridande rörelser av farligt avfall\noch avfallshantering."},"SP41":{"summary":"Aerosoler, gaspatroner och små behållare som innehåller gas, med en kapacitet som inte överstiger 50 ml, omfattas inte av HFFG om…","effects":[],"fullText":"SP41\n(A98)\nAerosoler, gaspatroner och små behållare som innehåller gas, med en kapacitet som\ninte överstiger 50 ml, omfattas inte av HFFG om följande villkor är uppfyllda:\n1. de innehåller endast gas tillhörande division 2.2,\n2. de överlämnas som last och ingår inte som integrerad del i ett föremål som\nomfattas av annan benämning enligt ämnesförteckningen,\n3. det är säkerställt att det inte finns någon risk att det vid ett läckage skulle innebära irritation eller obehag för besättningsmedlemmarna så att de inte kan utföra\nsina arbetsuppgifter."},"SP42":{"summary":"Bensin för användning i motorer med gnisttändning (t.ex. i bilar, stationära motorer och andra motorer) ska oavsett variationer i…","effects":[],"fullText":"SP42\n(A100)\nBensin för användning i motorer med gnisttändning (t.ex. i bilar, stationära motorer\noch andra motorer) ska oavsett variationer i flyktighet tillordnas denna benämning."},"SP43":{"summary":"Quantity and packing condition (see full text).","effects":["quantityCondition","packingCondition"],"fullText":"SP43 Avsedd benämning kan endast användas för maskiner och utrustningar som har rester\nav farligt gods eller som har ämnen som en integrerad del i funktionen av maskinen\neller utrustningen. Benämningen får inte användas för maskiner eller utrustningar för\nvilka det redan finns en benämning i ämnesförteckningen (HFFG, Tabell B3:1 (sida 87))\neller IATA-DGR, 4.2. Om mängden farligt gods i en integrerad del i en utrustning\növerstiger de begränsningar som anges i förpackningsinstruktion 962 ska CF eller den\nCF utser godkänna lasten innan transport."},"SP44":{"summary":"I stället för en strikt tillämpning av klassificeringskriterierna i IATA-DGR har detta ämne klassificerats eller inplacerats i en…","effects":["packingCondition"],"fullText":"SP44\n(A113)\nI stället för en strikt tillämpning av klassificeringskriterierna i IATA-DGR har detta\nämne klassificerats eller inplacerats i en förpackningsgrupp baserat på erfarenhetsmässig påverkan på människan.\n180 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP45":{"summary":"Föremål som innehåller gas och används som stötdämpare, inklusive stötenergiabsorberande anordningar eller tryckluftfjädring…","effects":["quantityCondition"],"fullText":"SP45\n(A114)\nFöremål som innehåller gas och används som stötdämpare, inklusive stötenergiabsorberande anordningar eller tryckluftfjädring omfattas inte av bestämmelserna i HFFG,\nförutsatt att:\n1. föremålen har ett gaskärl med volym högst 1,6 liter och ett laddningstryck på\nhögst 280 bar, varvid produkten av volym (liter) och laddningstryck (bar) inte\növerstiger 80 (dvs. 0,5 liter volym och 160 bar laddningstryck, 1 liter volym och 80\nbar laddningstryck, 1,6 liter volym och 50 bar laddningstryck, 0,28 liter volym och\n280 bar laddningstryck),\n2. föremålen har ett sprängtryck, som hos produkter med en volym hos gaskärlet på\nhögst 0,5 liter motsvarar minst det fyrfaldiga laddningstrycket och hos produkter\nmed en volym hos gaskärlet på över 0,5 liter minst det femfaldiga laddningstrycket vid 20 °C,\n3. föremålen tillverkas av material som inte splittras vid brott,\n4. föremålen tillverkas i enlighet med en kvalitetssäkringsstandard som kan godkännas av behörig myndighet, och\n5. konstruktionstypen har genomgått en brandprovning som verifierar att det invändiga trycket i föremålet avlastas genom en smältsäkring eller annan tryckavlastningsanordning, så att föremålet inte kan splittras eller slungas iväg."},"SP46":{"summary":"Requires an FSI deviation (avsteg) (see full text).","effects":["requiresFSIDeviation"],"fullText":"SP46\n(A118)\nExplosiva föremål måste monteras av fordonet och transporteras enligt bestämmelserna i HFFG för avsett föremål, såvida inte avsteg erhållits från FSI."},"SP47":{"summary":"För tändstickor gäller följande definitioner: 1. Stormtändstickor är tändstickor vars huvud är försett med en friktionskänslig…","effects":[],"fullText":"SP47\n(A125)\nFör tändstickor gäller följande definitioner:\n1. Stormtändstickor är tändstickor vars huvud är försett med en friktionskänslig\ntändsats och en pyroteknisk sats, som brinner med liten eller ingen låga men med\nstark hetta.\n2. Säkerhetständstickor är tändstickor som är kombinerade eller förbundna med\nbrevet eller asken och endast kan antändas mot en preparerad yta genom friktion.\n3. Tändstickor av alltändartyp (”strike anywhere”) är tändstickor, som kan antändas\nmot en fast yta genom friktion.\n4. Vaxtändstickor är tändstickor, som genom friktion kan antändas mot såväl en\npreparerad som en fast yta."},"SP48":{"summary":"Innerbehållare av glas (t.ex. ampuller eller kapslar) avsedda endast för användning i steriliseringsutrustning och som innehåller…","effects":["quantityCondition","packingCondition"],"fullText":"SP48\n(A131)\nInnerbehållare av glas (t.ex. ampuller eller kapslar) avsedda endast för användning\ni steriliseringsutrustning och som innehåller mindre än 30 ml etylenoxid per innerbehållare och högst 300 ml per ytterförpackning, får transporteras enligt bestämmelserna\nsom reducerad mängd, avsnitt 2.6 trots att ”E0” anges i kolumn F i ämnesförteckningen, förutsatt att:\n1. varje innerbehållare av glas efter fyllning har fastställts vara tät genom nedsänkning i ett varmvattenbad, där temperatur och provningsvaraktighet ska vara\ntillräckliga för att säkerställa att ett invändigt tryck uppnås i nivå med etylenoxids ångtryck vid 55 °C. Innerbehållare av glas som uppvisar tecken på läckage,\ndeformation eller andra defekter vid denna provning får inte transporteras enligt\nvillkoren i denna särbestämmelse,\n2. utöver förpackningen som krävs enligt avsnitt 2.6, varje innerbehållare av glas\nplaceras i en förseglad plastpåse som är kompatibel med etylenoxid och kan\nkvarhålla innehållet i händelse av att innerbehållaren av glas brister eller läcker,\noch\n3. varje innerbehållare av glas är skyddad på ett sätt som förhindrar punktering av\nplastpåsen (t.ex. av skyddshylsor eller stötdämpande material) i händelse av att\nförpackningen skadas (t.ex. genom att krossas)."},"SP49":{"summary":"Marking and packing condition (see full text).","effects":["markingRequirement","packingCondition"],"fullText":"SP49\n(A132)\nFöremål som innehåller rökalstrande ämnen som motsvarar kriterierna för frätande\nämnen (klass 8) ska, när de förpackats, också märkas med etikett 8. Föremål som\ninnehåller rökalstrande ämnen som motsvarar kriterierna för giftiga ämnen (division\n6.1) ska, när de förpackats, också märkas med etikett 6.1."},"SP50":{"summary":"1. Dessa ämnen är benägna att sönderfalla exotermt vid förhöjd temperatur. Sönderfallet kan utlösas av värme eller föroreningar…","effects":[],"fullText":"SP50\n(A136)\n1. Dessa ämnen är benägna att sönderfalla exotermt vid förhöjd temperatur. Sönderfallet kan utlösas av värme eller föroreningar (t.ex. pulverformiga metaller (järn,\nmangan, kobolt, magnesium) och deras föreningar).\n2. Under transporten får dessa ämnen inte utsättas för direkt solstrålning eller värmekällor och de ska lastas av på tillräckligt ventilerade platser."},"SP51":{"summary":"Denna benämning får inte användas för ämnen i klass 6.1, som motsvarar de i IATADGR, 3.6.1.5.3.2 beskrivna kriterierna för…","effects":["packingCondition"],"fullText":"SP51\n(A137)\nDenna benämning får inte användas för ämnen i klass 6.1, som motsvarar de i IATADGR, 3.6.1.5.3.2 beskrivna kriterierna för förpackningsgrupp I beträffande giftighet\nvid inandning."},"SP52":{"summary":"Requires CF approval and a packing condition (see full text).","effects":["requiresCFApproval","packingCondition"],"fullText":"SP52 Förbrukade aerosoler för avfall som inte fullständigt kan uppfylla kraven för förpackningsinstruktion 203 får endast transporteras efter godkännande från CF eller den CF\nutser."},"SP53":{"summary":"Marking condition (see full text).","effects":["markingRequirement"],"fullText":"SP53\n(A150)\nKontrollera mot IATA-DGR, appendix C.2 om det specifika ämnet har en sekundärfara\nfrätande. I sådant fall ska kollit också märkas med etikett 8."},"SP54":{"summary":"Etanol- och bensinblandningar för användning i gnisttändande motorer (t.ex. i bilar, stationära motorer och andra motorer) ska…","effects":[],"fullText":"SP54\n(A156)\nEtanol- och bensinblandningar för användning i gnisttändande motorer (t.ex. i bilar,\nstationära motorer och andra motorer) ska tillordnas denna benämning oavsett varierande flyktighet.\n182 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP55":{"summary":"Blandningar av fasta ämnen som inte omfattas av HFFG och miljöfarliga vätskor eller fasta ämnen, ska tillordnas UN 3077 och får…","effects":["quantityCondition","packingCondition"],"fullText":"SP55\n(A158)\nBlandningar av fasta ämnen som inte omfattas av HFFG och miljöfarliga vätskor eller\nfasta ämnen, ska tillordnas UN 3077 och får transporteras under denna benämning\nförutsatt att ingen fri vätska är synlig vid tidpunkten när ämnet lastas eller när\nförpackningen eller lastbäraren försluts. Tätt förslutna småförpackningar och föremål\nsom innehåller mindre än 10 ml av en miljöfarlig vätska absorberad i ett fast material\nmen utan fri vätska i förpackningen eller föremålet, eller som innehåller mindre än 10\ng av ett miljöfarligt fast ämne, omfattas inte av bestämmelserna i HFFG."},"SP56":{"summary":"Quantity/marking condition (see full text).","effects":[],"fullText":"SP56\n(A167)\nBestämmelserna i IATA-DGR, 6.4.4 måste vara uppfyllda."},"SP57":{"summary":"Gasflaskor för syrgas avsedda för användning i nödsituationer, vilka transporteras under denna benämning, får vara utrustade med…","effects":["quantityCondition"],"fullText":"SP57\n(A175)\nGasflaskor för syrgas avsedda för användning i nödsituationer, vilka transporteras under denna benämning, får vara utrustade med sprängpatron (aktivatorer i riskgrupp\n1.4, samhanteringsgrupp C eller S) utan att tillhörigheten till klass 2 därigenom förändras, förutsatt att totalmängden deflagrerande explosivämnen (drivmedel) omfattar högst 3,2 g per syrgasflaska. Gasflaskor i transportfärdigt skick utrustade med\nsprängpatroner ska vara försedda med en effektiv säkringsanordning för att förhindra\noavsiktlig initiering."},"SP58":{"summary":"Metallhydridlagringssystem som är avsedda för montering i fordon, vagnar, fartyg eller luftfartyg, ska godkännas av behörig…","effects":["documentationRequirement"],"fullText":"SP58\n(A176)\nMetallhydridlagringssystem som är avsedda för montering i fordon, vagnar, fartyg eller luftfartyg, ska godkännas av behörig myndighet i tillverkningslandet innan de får\ntas emot för transport. Godsdeklarationen ska innehålla uppgift om att kollit godkänts\nav behörig myndighet i tillverkningslandet eller så ska en kopia av tillståndet från\nbehörig myndighet i tillverkningslandet bifogas varje sändning."},"SP59":{"summary":"För UN 3077 så får nettomängden uppgå till 1 000 kg om det förpackats i IBC-behållare enligt förpackningsinstruktion 956.","effects":["quantityCondition","packingCondition"],"fullText":"SP59\n(A179)\nFör UN 3077 så får nettomängden uppgå till 1 000 kg om det förpackats i IBC-behållare enligt förpackningsinstruktion 956."},"SP60":{"summary":"Marking, quantity and packing condition (see full text).","effects":["markingRequirement","quantityCondition","packingCondition"],"fullText":"SP60\n(A180)\nProvföremål som inte är smittförande föremål, till exempel däggdjur, fåglar, paddor,\nreptiler, fiskar, insekter och andra ryggradslösa djur som innehåller små mängder UN\n1170, UN 1198, UN 1987 eller UN 1219 omfattas inte av bestämmelserna i HFFG under\nförutsättning att förpackning och märkning uppfyller följande krav:\n1. Provföremålen är:\ni. insvept i duk/pappershandduk som är fuktad med alkohol eller en alkohollösning och sedan placerad i en plastpåse som är värmeförseglad. Eventuell fri vätska i påsen får inte överstiga 30 ml, eller\nii. placerad i provrör eller andra styva behållare med högst 30 ml alkohol eller\nen alkohollösning\n2. de förberedda proverna är sedan placerade i en plastpåse som är värmeförseglad,\n3. den förberedda påsen enligt b) är placerad i en yttre plastpåse med absorberande\nmaterial som är värmeförseglad,\n4. färdigställd påse enligt c) placeras sedan i en stark ytterförpackning med lämpligt\ndämpningsmaterial,\n5. den totala mängden brandfarlig vätska per ytterförpackning får inte överstiga 1\nliter och\n6. ytterförpackningen är märkt med texten \"scientific research specimens, not restricted HFFG, Special Provision SP60”."},"SP61":{"summary":"Denna benämning får endast användas för transport av ej aktiverade batterier som innehåller kaliumhydroxid, torr, och är avsedda…","effects":["quantityCondition"],"fullText":"SP61\n(A184)\nDenna benämning får endast användas för transport av ej aktiverade batterier som\ninnehåller kaliumhydroxid, torr, och är avsedda att aktiveras före användning genom\natt lämplig mängd vatten tillsätts till varje enskild cell."},"SP62":{"summary":"Marking, documentation, quantity and packing condition (see full text).","effects":["markingRequirement","documentationRequirement","quantityCondition","packingCondition"],"fullText":"SP62\n(A190)\nNeutronstrålningsdetektorer innehållande icke trycksatt bortrifluoridgas får transporteras under denna benämning under förutsättning att följande villkor är uppfyllda:\n1. Varje strålningsdetektor ska uppfylla följande villkor:\ni. absoluttrycket får inte överstiga 105 kPa vid 20 °C,\nii. mängden gas får inte överstiga 13 g,\niii. detektorn ska tillverkas under ett dokumenterat kvalitetssystem,\niv. varje neutronstrålningsdetektor ska vara gjord av en svetsad metallkonstruktion sammanfogad till keramiskt foder genom lödning av metallen.\nDessa detektorer ska ha ett minsta sprängtryck av 1800 kPa som visas\ngenom typprovning, och\nv. varje detektor ska täthetsprovas utifrån en standard av 1 × 10-10 cm3/s före\nfyllning.\n2. Strålningsdetektorer som transporteras som individuella komponenter ska transporteras enligt följande:\ni. detektorer ska vara förpackade i en försluten innerbeklädd mellanförpackning av plast innehållande tillräckligt med absorberande eller adsorberande\nmaterial för att absorbera eller adsorbera hela gasinnehållet,\nii. de ska förpackas i en kraftig ytterförpackning. Det färdiga kollit ska kunna\nklara ett fallprov på 1,8 meter utan att gas läcker ut från detektorerna.\niii. den totala mängden gas från alla detektorer i ett kolli får inte överstiga 52 g.\n3. Fullständiga system av neutronstrålningsdetektorer bestående av detektorer som\nuppfyller villkoren i punkt (a) ska transporteras enligt följande:\ni. detektorerna ska inneslutas i ett förslutet kraftigt ytterhölje,\nii. ytterhöljet ska innehålla tillräckligt med absorberande eller adsorberande\nmaterial för att kunna absorbera eller adsorbera hela innehållet av gas,\niii. de fullständiga systemen ska förpackas i kraftiga ytterförpackningar som\nska klara ett fallprov på 1,8 meter utan läckage, såvida ett systems ytterhölje\ninte kan erbjuda motsvarande skydd.\n4. Förpackningen ska märkas med etikett 2.3 och 8\n5. Godsdeklarationen ska innehålla informationen ”SP62” under authorizations.\nNeutronstrålningsdetektorer som innehåller högst 1 g bortrifluorid, inklusive sådana\nmed lödda glasfogar, omfattas inte av HFFG under förutsättning att de uppfyller\nkraven i punkt (a) och är förpackade enligt punkt (b). Strålningsdetektorsystem som\ninnehåller sådana detektorer omfattas inte av HFFG under förutsättning att de är\nförpackade enligt punkt (c)."},"SP63":{"summary":"Uppgift om sekundärfara 6.1 krävs inte på godsdeklarationen eller genom etikett på kollit om föremålet innehåller mindre än 5 kg…","effects":["documentationRequirement","quantityCondition"],"fullText":"SP63\n(A191)\nUppgift om sekundärfara 6.1 krävs inte på godsdeklarationen eller genom etikett på\nkollit om föremålet innehåller mindre än 5 kg kvicksilver. Om denna särbestämmelse\ntillämpas ska godsdeklarationen innehålla uppgiften \"SP63\" under authorizations.\n184 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP64":{"summary":"Avseende dokumentation och märkning av kolli: Den officiella transportbenämningen “Paint related material” får användas för…","effects":["markingRequirement"],"fullText":"SP64\n(A192)\nAvseende dokumentation och märkning av kolli:\nDen officiella transportbenämningen “Paint related material” får användas för sändningar av kollin som innehåller både ”Paint” och ”Paint related material”.\nDen officiella transportbenämningen “Paint related material, corrosive, flammable” får\nanvändas för sändningar av kollin som innehåller både ”Paint, corrosive, flammable”\noch ”Paint related material, corrosive, flammable”.\nDen officiella transportbenämningen “Paint related material, flammable, corrosive” får\nanvändas för sändningar av kollin som innehåller både ”Paint, flammable, corrosive”\noch ”Paint related material, flammable, corrosive”.\nDen officiella transportbenämningen “Printing ink related material” får användas för\nsändningar av kollin som innehåller både ”Printing ink” och ”Printing ink related\nmaterial”."},"SP65":{"summary":"Denna benämning gäller även för föremål som innehåller ett litet tryckkärl med utsläppsanordning. Sådana föremål ska uppfylla…","effects":["quantityCondition","packingCondition"],"fullText":"SP65\n(A195)\nDenna benämning gäller även för föremål som innehåller ett litet tryckkärl med utsläppsanordning. Sådana föremål ska uppfylla följande krav:\n1. vattenvolymen hos tryckkärlet får inte överstiga 0,5 liter och arbetstrycket får inte\növerstiga 25 bar vid 15 °C,\n2. minsta sprängtrycket hos tryckkärlet ska vara åtminstone fyra gånger gasens\ntryck vid 15 °C,\n3. varje föremål ska vara tillverkat så att oavsiktlig avskjutning eller utsläpp undviks under normal hantering, förpackning, transport och användning. Detta får\nuppfyllas genom att en ytterligare låsningsanordning kopplas till aktivatorn,\n4. varje föremål ska vara tillverkat så att farliga projektiler från tryckkärlet eller\ndelar av tryckkärlet förhindras,\n5. varje tryckkärl ska vara tillverkad av ett material som inte splittras vid brott,\n6. föremålets konstruktionstyp ska genomgå en brandprovning. För denna provning\nska bestämmelserna i 16.6.1.2 förutom punkt (g), 16.6.1.3.1 till 16.6.1.3.6, 16.6.1.3.7\n(b) och 16.6.1.3.8 i testhandboken följas. Det ska kunna verifieras att föremålets\ntryck avlastas genom en smältsäkring eller annan tryckavlastningsanordning på\nett sådant sätt att tryckkärlet inte splittras och att föremålet eller splitter från\nföremålet inte slungas iväg mer än 10 meter,\n7. föremålets konstruktionstyp ska genomgå följande test: En mekanism för igångsättning ska användas för att initiera ett föremål i mitten av förpackningen. Det\nfår inte förekomma någon verkan på utsidan av kollit, till exempel så att kollit\nbrister eller så att metallsplitter eller kärl går igenom förpackningen.\n8. tillverkaren ska ta fram teknisk dokumentation för konstruktionstypen, över tillverkningsprocedur såväl som över provningarna och deras resultat. Tillverkaren\nska ha rutiner som säkerställer att föremål som tillverkas i serie är gjorda av bra\nkvalitet, motsvarar konstruktionstypen och uppfyller kraven i (a)-(g). Tillverkaren\nska kunna överlämna sådan information till FSI vid begäran."},"SP66":{"summary":"När dessa ämnen transporteras i enkelförpackningar eller sammansatta förpackningar med en nettomängd per enkel- eller…","effects":["quantityCondition","packingCondition"],"fullText":"SP66\n(A197)\nNär dessa ämnen transporteras i enkelförpackningar eller sammansatta förpackningar\nmed en nettomängd per enkel- eller innerförpackning av högst 5 l för vätskor eller\nen nettovikt per enkel- eller innerförpackning av högst 5 kg för fasta ämnen, omfattas\nde inte av några andra bestämmelser i HFFG under förutsättning att förpackningarna\nuppfyller de allmänna bestämmelserna i IATA-DGR, 5.0.2.4.1, 5.0.2.6.1.1 och 5.0.2.8."},"SP67":{"summary":"Item is not covered by the standard packing-instruction/quantity columns; governed entirely by this Special Provision (see full text).","effects":[],"fullText":"SP67\n(A199)\nUN 3496 är endast tillämpbar som farligt gods vid sjötransport. Nickel-metall hydrid\nbatterier eller utrustningar och fordon som drivs med sådana batterier och där det\nfinns en risk för farlig värmeutveckling omfattas inte av bestämmelserna i HFFG om\nde är skyddade mot:\n1. kortslutning, och\n2. mot oavsiktlig initiering."},"SP68":{"summary":"Neutronstrålningsdetektorer innehållande denna gas i ej återfyllningsbara tryckkärl vilka inte uppfyller kraven i IATA-DGR, 6.4…","effects":["documentationRequirement","quantityCondition","packingCondition"],"fullText":"SP68\n(A202)\nNeutronstrålningsdetektorer innehållande denna gas i ej återfyllningsbara tryckkärl\nvilka inte uppfyller kraven i IATA-DGR, 6.4 och förpackningsinstruktion 200 får transporteras under denna benämning under förutsättning att:\n1. Arbetstrycket i varje kärl inte överstiger 50 bar,\n2. Kärlets volym inte överstiger 12 liter,\n3. Varje kärl har ett minsta sprängtryck av minst 3 gånger arbetstrycket när en avlastningsanordning finns och minst 4 gånger arbetstrycket när ingen avlastningsanordning finns,\n4. Varje kärl är tillverkat av material som inte splittras vid brott,\n5. Varje detektor är tillverkad enligt ett dokumenterat kvalitetssystem,\n6. Detektorer transporteras i kraftiga ytterförpackningar. Det färdiga kollit ska kunna klara ett fallprov på 1,2 meter utan skada på detektorn eller att ytterförpackningen brister. Utrustning som innehåller en detektor ska förpackas i en kraftig\nytterförpackning om inte detektorn har ett likvärdigt skydd av utrustningen som\nden är inbyggd i, och\n7. Godsdeklarationen ska innehålla informationen ”SP68” under authorizations.\nStrålningsdetektorer, inklusive detektorer i strålningsdetektionssystem, omfattas inte\nav några andra bestämmelser i HFFG om detektorerna uppfyller kraven i (a) till (f)\novan och volymen hos detektorkärlen inte överstiger 50 ml.\n186 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP69":{"summary":"Cargo-aircraft-relevant condition (see full text).","effects":[],"fullText":"SP69\n(A208)\nDenna benämning gäller för motorer eller maskiner som drivs av bränsle klassificerat\nsom farligt gods via förbränningssystem eller bränsleceller (t.ex. förbränningsmotorer,\ngeneratorer, kompressorer, turbiner, värmesystem, etc.).\nMotorer och maskiner som innehåller bränslen som uppfyller klassificeringskriterierna för klass 3 ska tillordnas en av nedanstående benämningar beroende på vilken som\när tillämplig.\nUN 3528 Engine, internal combustion, flammable liquid powered,\nUN 3528 Engine, fuel cell, flammable liquid powered,\nUN 3528 Machinery, internal combustion, flammable liquid powered, eller\nUN 3528 Machinery, fuel cell, flammable liquid powered,\nMotorer och maskiner som innehåller bränslen som uppfyller klassificeringskriterierna för division 2.1 ska tillordnas en av nedanstående benämningar beroende på vilken\nsom är tillämplig.\nUN 3529 Engine, internal combustion, flammable liquid powered,\nUN 3529 Engine, fuel cell, flammable liquid powered,\nUN 3529 Machinery, internal combustion, flammable liquid powered, eller\nUN 3529 Machinery, fuel cell, flammable liquid powered,\nMotorer och maskiner som drivs av både en brandfarlig gas och en brandfarlig vätska\nska avsändas enligt lämpliga UN 3529.\nMotorer och maskiner som innehåller flytande bränslen som uppfyller klassificeringskriterierna i regelverket för vägtransport av farligt gods, ADR, 2.2.9.1.10 för miljöfarliga ämnen och som inte uppfyller klassificeringskriterierna för någon annan klass, ska\ntillordnas en av nedanstående benämningar beroende på vilken som är tillämplig.\nUN 3530 Engine, internal combustion, eller\nUN 3530 Machinery, internal combustion."},"SP70":{"summary":"Requires an FSI deviation (avsteg) with a packing condition (see full text).","effects":["requiresFSIDeviation","packingCondition"],"fullText":"SP70\n(A209)\nNär kemisk stabilisering används, ska den som överlämnar förpackningen för transport säkerställa att stabiliseringsnivån är tillräcklig för att förhindra att ämnet polymeriserar i förpackningen när bulklasten håller en medeltemperatur på 50 °C. Där kemisk\nstabilisering blir ineffektiv vid lägre temperaturer under den förväntade transporttiden krävs temperaturkontroll och ämnet får då endast transporteras efter avsteg från\nFSI."},"SP71":{"summary":"Cargo-aircraft marking, documentation and packing condition (see full text).","effects":["cargoAircraftRelevant","markingRequirement","documentationRequirement","packingCondition"],"fullText":"SP71\n(A211)\nGAS CARTRIDGES (toxic, oxidizing and corrosive) eller RECEPTACLES, SMALL,\nCONTAINING GAS (toxic, oxidizing and corrosive) som endast är avsedda att användas i steriliseringsanordningar och som innehåller UN1067 eller UN1660 får transporteras på passagerar- och fraktflygplan oavsett indikation på ”förbjudet” i kolumnerna\nI-L, under förutsättning att följande krav är uppfyllda:\n1. vattenkapaciteten för behållare eller gaspatroner får inte överstiga 30 ml,\n2. behållare eller gaspatroner är utformade så att sprängtrycket inte är mindre än\nfyra gånger trycket i patronen/behållaren vid 55°C,\n3. behållare eller gaspatroner är förpackade i en kompatibel, förseglad mellanförpackning som har adsorberande material tillräckligt för att innehålla allt innehållesom finns i gaspatronen/behållaren,\n4. mellanförpackningar är säkert förpackade i en ytterförpackning av den typ som\ntillåts enligt förpackningsinstruktion 203 och som uppfyller prestandakraven för\nförpackningsgrupp I enligt IATA-DGR, section 6.\n5. den sammanlagda vattenkapaciteten för alla behållare eller gaspatroner i en ytterförpacking får inte överstiga 300 ml;\n6. ytterförpackningen ska vara märkt med faroetiketter för \"giftig gas\" (2.3), \"oxiderande ämnen\" (5.1) samt \"frätande ämnen\" (8), och\n7. godsdeklarationen innehåller uppgiften \"SP71\" under authorizations.\nOm ovanstående villkor är uppfyllda gäller inte kraven i särbestämmelse SP3.\n188 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP72":{"summary":"Benämningar för UN 3166 gäller fordon med förbränningsmotor eller bränslecellsmotor med brandfarlig vätska eller gas som…","effects":["packingCondition"],"fullText":"SP72\n(A214)\nBenämningar för UN 3166 gäller fordon med förbränningsmotor eller bränslecellsmotor med brandfarlig vätska eller gas som drivmedel.\nFordon som drivs av en bränslecellsmotor ska tillordnas en av nedanstående benämningar beroende på vilken som är tillämplig.\nUN 3166 Vehicle, fuel cell, flammable gas powered, eller\nUN 3166 Vehicle, fuel cell, flammable liquid powered.\nDessa benämningar omfattar även hybridelektriska fordon som drivs med både en\nbränslecell och en förbränningsmotor med våta batterier, natriumbatterier, primära\nlitiumbatterier eller litiumjonbatterier och som transporteras med batterierna installerade.\nAndra fordon som innehåller en förbränningsmotor ska tillordnas en av nedanstående\nbenämningar beroende på vilken som är tillämplig.\nUN 3166 Vehicle, flammable gas powered, eller\nUN 3166 Vehicle, flammable liquid powered.\nDessa benämningar omfattar även hybridelektriska fordon som drivs med både en\nförbränningsmotor och våta batterier, natriumbatterier, primära litiumbatterier eller\nlitiumjonbatterier och som transporteras med batterierna installerade.\nOm ett fordon drivs av en brandfarlig vätska och en förbränningsmotor med brännbar\ngas ska den tilldelas UN 3166 Vehicle, flammable gas powered.\nUN 3171 ska endast tillämpas på fordon som drivs med våta batterier, natriummetallbatterier, primära litiumbatterier eller litiumjonbatterier och utrustning som drivs med\nvåta batterier eller natriumbatterier och som transporteras med batterierna installerade.\nI denna särbestämmelse anses fordon vara anordningar som är självgående och konstruerade att transportera en eller flera personer eller gods. Exempel på sådana fordon\när bilar, motorcyklar, skotrar, tre- eller fyrhjuliga fordon eller motorcyklar, lastbilar,\nlok, cyklar (cyklar med elmotor) och andra fordon av denna typ (t.ex. självbalanserande fordon eller fordon utan sittplats), rullstolar, åkgräsklippare, självgående jordbruksoch anläggningsmaskiner, båtar och luftfartyg. Detta inkluderar fordon som transporteras i en förpackning. I dessa fall får delar av fordonet demonteras för att det ska få\nplats i förpackningen.\nExempel på utrustning är gräsklippare, städmaskiner eller modellbåtar och modellflygplan. Utrustning som drivs av primära litiumbatterier eller litiumjonbatterier ska\ntillordnas en av nedanstående benämningar beroende på vilken som är tillämplig.\nUN 3091 Lithium metal batteries contained in equipment,\nUN 3529 Lithium metal batteries packed with equipment,\nUN 3529 Lithium ion batteries contained in equipment, eller\nUN 3529 Lithium ion batteries packed with equipment."},"SP73":{"summary":"I syfte att tillhandahålla stöd för vattenlevande djur under transport är det lämpligt myndigheterna i länderna där gods lastas…","effects":["quantityCondition","packingCondition"],"fullText":"SP73\n(A302)\nI syfte att tillhandahålla stöd för vattenlevande djur under transport är det lämpligt\nmyndigheterna i länderna där gods lastas samt FSI kan godkänna att gasflaskor som\ninnehåller UN 1072 Oxygen, compressed eller UN 1002 Air, compressed får transporteras med ventilerna öppna för att tillföra en kontrollerad mängd syre eller luft genom\nen regulator till vattnet i en behållare med vattenlevande djur. Gasflaskan eller dess\nventil måste vara försedd med en självtätande anordning för att förhindra okontrollerat utsläpp av gas om regulatorn skulle sluta fungera, vara trasig eller skadad. Gasflaskan måste uppfylla tillämpliga delar i förpackningsinstruktion 200, med undantag för\nkravet om att ventilerna ska vara stängda. Dessutom gäller följande villkor:\n1. vattenbehållaren med den tillhörande gasflaskan måste vara konstruerad för att\nmotstå alla förväntade påkänningar,\n2. vattenbehållaren med gastillförseln måste vipptestas i en vinkel på 45° i fyra riktningar från upprätt läge. Detta ska göras under minst 10 minuter i varje riktning,\nutan läckage av vatten,\n3. gasflaskan och regulatorn måste sitta fast i utrustningen och vara skyddad mot\nyttre påkänning,\n4. den använda regulatorn får ha en maximal flödeshastighet på högst 5 L per\nminut,\n5. flödeshastigheten till behållaren ska vara begränsad till vad som är tillräckligt för\natt ge tillräcklig syresättning för vattenlevande djur,\n6. mängden gas som tillhandahålls får inte överstiga 150% av det syre som krävs för\ndet normalt uppskattade tiden för flygtransporten, och\n7. endast en cylinder får lastas för varje 15 m3 av bruttolastvolym i lastutrymmet.\nDet får under inga omständigheter kunna ge upphov till ett gasflöde från cylindern som överstiger 1 liter per minut per 5 m3\n av bruttolastvolym i lastutrymmet\n190 Tillämpningsbestämmelser Militär luftfart - Hantering flygtransport av farligt gods"},"SP74":{"summary":"Requires FSI approval (see full text).","effects":["requiresFSIApproval"],"fullText":"SP74\n(A324)\nFör att transportera en symbolisk låga krävs godkännande från FSI samt behörig\nmyndighet i det land där lampan/facklan med lågan lastas.\nDessutom ska villkoren i denna särbestämmelse vara uppfyllda.\n1. Lampan/facklan får drivas av UN 1223 Kerosene eller UN 3295 Hydrocarbons,\nliquid, n.o.s. och ska bäras av en passagerare som bagage.\n2. Lampor måste vara av typen \"Davylampa\" eller liknande.\n3. Högst fyra lampor får transporteras ombord på luftfartyget.\n4. Lamporna får inte innehålla mer bränsle än den kvantitet som är tillräcklig under\nflygtransportens varaktighet och\n5. bränslebehållaren måste vara läckagetät.\n6. Lamporna måste vara tillräckligt säkrade,\n7. Under hela transporten ska lamporna vara under ständig övervakning av en\nmedföljande person, som inte får vara medlem av den operativa besättningen,\n8. Lampor får tändas av den medföljande personen, men får inte fyllas på med\nbränsle när de befinner sig ombord på luftfartyget,\n9. Minst en brandsläckare ska alltid finnas inom räckhåll för den medföljande personen när de befinner sig ombord samt vid på- och avstigning. Den medföljande\npersonen ska vara utbildad i hur brandsläckaren fungerar och hur den ska användas,\n10.Besättningen ombord ska ha fått muntlig information om transporten och befälhavaren ska ha fått en kopia av godkännandet från berörda myndigheter.\n11.Lampan ska vara upptagen på NOTOC."},"SP75":{"summary":"Denna benämning får inte användas för Disilane eller andra pyrofora gaser.","effects":[],"fullText":"SP75\n(A807)\nDenna benämning får inte användas för Disilane eller andra pyrofora gaser."}};
const PI_DATA = {"006":{"ref":"Tabell B7:2 (sida 194)","structured":{"subtitle":null,"blocks":[{"t":"para","text":"Följande förpackningar är tillåtna under förutsättning att de allmänna förpackningsbestämmelserna i IATA-DGR, section 5 är uppfyllda:"},{"t":"numbered","items":[{"text":"Typgodkända förpackningar av följande typer: Fat (1A2, 1B2, 1N2, 1H2, 1D, 1G) Lådor (4A, 4B, 4N, 4C1, 4C2, 4D, 4F, 4G, 4H1, 4H2) Dunkar (3A2, 3B2, 3H2). Förpackningar ska uppfylla provningskraven för förpackningsgrupp II."},{"text":"Dessutom är följande förpackningar tillåtna för robusta föremål: Kraftiga ytterförpackningar tillverkade av ändamålsenligt material med tillräcklig styrka och lämplig konstruktion i förhållande till förpackningens kapacitet och avsedda användningsområde. Förpackningarna ska uppnå ett skydd som åtminstone är likvärdigt med det som fås för typgodkända förpackningar enligt IATA-DGR, section 6. Föremål får transporteras oförpackade eller på pall om det farliga godset får ett likvärdigt skydd av föremålet som godset är inbyggt i."}]},{"t":"subhead","text":"Särskilda krav som ska vara uppfyllda:"},{"t":"numbered","items":[{"text":"Behållare med vätskor eller fasta ämnen i föremålen ska tillverkas av ändamålsenligt material och säkras i föremålet så att de, under normala transportförhållanden, inte går sönder, punkteras eller läcker ut innehåll i föremålet eller i ytterförpackningen."},{"text":"Behållare som har förslutningar och innehåller vätskor, ska förpackas så att förslutningarna är riktade uppåt. Behållarna ska dessutom kunna klara provningskraven i IATA-DGR, 6.1.5.5 om provning med invändigt tryck (vätsketryckprovning)."},{"text":"Behållare som lätt kan gå sönder eller punkteras, såsom kärl av glas, porslin eller stengods, vissa plastmaterial m.m. ska bäddas in i ytterförpackningen. Läcker innehållet ut får de skyddande egenskaperna hos föremålet eller ytterförpackningen inte försämras nämnvärt."},{"text":"Behållare med gas i föremålen, ska uppfylla kraven i IATA-DGR, 5.2 och 6.2 utifrån vad som är tillämpligt eller kunna ge ett skydd likvärdigt det som uppnås i IATA-DGR, förpackningsinstruktion 200 eller 208."},{"text":"När det inte finns någon behållare i föremålet, ska föremålet helt innesluta de farliga ämnena och förhindra att de läcker ut under normala transportförhållanden."},{"text":"Föremålen ska förpackas så att förskjutning och oavsiktlig aktivering förhindras under normala transportförhållanden."}]}]},"source":"Tabell B7:2 (sida 194)"},"351":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"657":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"101":{"ref":"Tabell B7:3 (sida 194)","structured":{"subtitle":null,"blocks":[{"t":"para","text":"Endast förpackningar som har godkänts av FSI får användas. Följande ska anges i godsdeklarationen \"Förpackning godkänd av FSI/Packaging approved by the competent military authority of Sweden\"."},{"t":"para","text":"Förpackningar som godkänds av civila myndigheter behöver inte godkännas av FSI. I sådana fall ska det i godsdeklarationen anges \"Förpackning godkänd av behörig myndighet i [Landets nationalitetsbeteckning för motorfordon i internationell trafik]/Packaging approved by the competent authority of [the country for which the authority acts]\"."}]},"source":"Tabell B7:3 (sida 194)"},"352":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"658":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"111":{"ref":"Tabell B7:4 (sida 195)","structured":{"subtitle":null,"blocks":[{"t":"para","text":"Följande förpackningar är tillåtna under förutsättning att de allmänna förpackningsbestämmelserna i IATA-DGR, section 5. Såvida inte annat anges i dessa bestämmelser ska kompletta förpackningar möta kraven för förpackningsgrupp II."},{"t":"field","label":"Innerförpackningar"," rupp II."},{"text":"Dessutom så tillåts följande förpackningar för celler eller batterier med en bruttovikt på 12 kg eller mer och som har ett motståndskraftigt, stöttåligt hölje:","sub":["kraftiga ytterförpackningar,","skyddsinneslutningar (t.ex. helt tillslutna skyddsförpackningar eller i spjälkorgar av trä), eller","pall eller andra hanteringsanordningar."]}]},{"t":"para","text":"Celler eller batterier ska vara säkrade mot oavsiktlig rörelse och polerna får inte belastas med vikten av ovanpå staplade element. Förpackningarna behöver inte vara typgodkända."},{"t":"subhead","text":"Särskilda krav som ska vara uppfyllda:"},{"t":"numbered","items":[{"text":"Celler eller batterier ska helt omslutas av icke-konduktivt material samt tillräckligt skydd mot stötar och påkänningar som kan uppstå under transport."},{"text":"Celler och batterier ska vara skyddade mot kortslutning."}]}]},"source":"Tabell B7:14 (sida 202)"},"141":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"559":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"903(b)":{"ref":"Tabell B7:15 (sida 202)","structured":{"subtitle":"Litiumbatterier förpackade med utrustning (UN 3091 och UN 3481)","blocks":[{"t":"para","text":"När \"utrustning\" används i denna förpackningsinstruktion avses utrustning där litiumcellerna eller -batterierna är elektrisk strömkälla för dess funktion."},{"t":"para","text":"För celler eller batterier förpackade med utrustning får följande förpackningar användas under förutsättning att de allmänna förpackningsbestämmelserna i IATA-DGR, section 5 är uppfyllda:"},{"t":"numbered","items":[{"text":"Celler eller batterier förpackas i typgodkända förpackningar av följande typer: Fat: 1A2, 1B2, 1N2, 1H2, 1D och 1G, Lådor: 4A, 4B, 4N, 4C1, 4C2, 4D, 4F, 4G, 4H1 och 4H2, Dunkar: 3A2, 3B2, 3H2. Förpackningar ska uppfylla provningskraven för förpackningsgrupp II. Dessa placeras sedan med utrustningen i en ytterförpackning tillverkade av ändamålsenligt material med tillräcklig styrka och lämplig konstruktion i förhållande till förpackningens kapacitet och avsedda användningsområde. Ytterförpackningen behöver inte vara typgodkänd."},{"text":"Alternativt får celler eller batterier förpackas i förpackningar som inte är typgodkända, men som helt omsluter cellen eller batteriet och är av ändamålsenligt material och med tillräcklig styrka. Dessa placeras sedan tillsammans med utrustningen i en typgodkända förpackningar av följande typer: Fat: 1A2, 1B2, 1N2, 1H2, 1D och 1G, Lådor: 4A, 4B, 4N, 4C1, 4C2, 4D, 4F, 4G, 4H1 och 4H2, Dunkar: 3A2, 3B2, 3H2. Förpackningar ska uppfylla provningskraven för förpackningsgrupp II."}]},{"t":"subhead","text":"Särskilda krav som ska vara uppfyllda:"},{"t":"numbered","items":[{"text":"Celler eller batterier ska helt omslutas av icke-konduktivt material samt tillräckligt skydd mot stötar och påkänningar som kan uppstå under transport."},{"text":"Celler och batterier ska vara skyddade mot kortslutning."},{"text":"Utrustningen ska vara säkrad så att den inte kan förskjutas i ytterförpackningen."}]}]},"source":"Tabell B7:15 (sida 202)"},"142":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"562":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"903(c)":{"ref":"Tabell B7:16 (sida 203)","structured":{"subtitle":"Litiumbatterier installerade i utrustning (UN 3091 och UN 3481)","blocks":[{"t":"para","text":"När \"utrustning\" används i denna förpackningsinstruktion avses utrustning där litiumcellerna eller -batterierna är elektrisk strömkälla för dess funktion."},{"t":"para","text":"Celler eller batterier som är installerade i utrustning får överlämnas för transport enligt nedanstående villkor och under förutsättning att de allmänna förpackningsbestämmelserna i IATA-DGR, section 5 är uppfyllda:"},{"t":"numbered","items":[{"text":"Kraftiga ytterförpackningar tillverkade av ändamålsenligt material med tillräcklig styrka och lämplig konstruktion i förhållande till förpackningens kapacitet och avsedda användningsområde. Ytterförpackningen behöver inte vara typgodkänd."},{"text":"Stor utrustning får överlämnas för transport oförpackade eller på pall om celler eller batterier får ett likvärdigt skydd av utrustningen som de är inbyggda i."}]},{"t":"subhead","text":"Särskilda krav som ska vara uppfyllda:"},{"t":"numbered","items":[{"text":"Förpackning och/eller utrustning ska vara konstruerad så att det förhindrar att utrustningen oavsiktligen driftsätts under transporten. Anordningar såsom RFID-transpondrar (RFID-taggar), klockor och temperaturlogger, som inte kan generera farlig värmeutveckling, får transporteras i avsiktligt aktivt tillstånd i kraftiga ytterförpackningar."}]}]},"source":"Tabell B7:16 (sida 203)"},"143":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"563":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"950":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"200":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"570":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"951":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"201":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"622":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"952":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"202":{"ref":"IATA-DGR","source":"IATA-DGR (external reference required – not contained in HFFG dataset)"},"650":{"ref":"IATA-DGR","source":"IATA- const CHAPTER_DATA = [{"num":"1","title":"Grundläggande bestämmelser","sections":[{"num":"1","title":"Grundläggande bestämmelser","level":1,"paras":[]},{"num":"1.1","title":"Tillämpning","level":2,"paras":[{"text":"Dessa bestämmelser gäller för:","note":false},{"text":"1. varje verksamhetsutövare som är godkänd för transport av farligt gods inom det militära luftfartssystemet,","note":false},{"text":"2. varje organisation som, till en verksamhetsutövare enligt nr. 1 (sida 11), lämnar in farligt gods för transport, samt","note":false},{"text":"3. passagerare som bär farligt gods ombord på luftfartyg tillhörande en verksamhetsutövare enligt nr. 1 (sida 11). Bestämmelserna ovan ska tillämpas för flygtransporter av farligt gods som utförs av svenska militära luftfartyg, såväl inom som utanför svenskt territorium, såvida inte bestämmelserna strider mot andra lagar eller överenskommelser (t.ex. OpO, MoU).","note":false}]},{"num":"1.1.1","title":"Relation till andra bestämmelser","level":3,"paras":[{"text":"Ämnen och föremål vilka klassificeras som farligt gods enligt HFFG, men som är undantagna från andra bestämmelser ska klassificeras, iordningsställas och överlämnas enligt bestämmelserna i HFFG. Farligt gods som iordningsställts och överlämnats enligt ICAO-TI/IATA-DGR eller AFMAN 24-204 får transporteras enligt HFFG under förutsättning att bestämmelserna i, kapitel 9 är uppfyllda.","note":false},{"text":"För att upprätthålla en god säkerhet vid transport av farligt gods inom civil luftfart har det utarbetats internationella regler inom ICAO (International Civil Aviation Organization). Dessa regler grundar sig i Förenta Nationernas (FN:s) rekommendationer om klassificering, förpackning, märkning och dokumentation av farligt gods. I Sverige har bestämmelserna implementerats genom Lagen (SFS 2006:263) om transport av farligt gods, vilken tillsammans med Luftfartslagen (2010:500) syftar till säkra transporter av farligt gods inom luftfarten. Försvarsmaktens militära luftfarttyg omfattas inte av dessa lagstiftningar, men för att upprätthålla en acceptabel säkerhetsnivå vid transporter av farligt gods har dessa bestämmelser utarbetats. För att ta vara på det säkerhetsarbete som genomförts inom farligt gods samt att kunna samverka med andra aktörer, såväl civila som utländska väpnade styrkor, har dessa bestämmelser utarbetats utifrån de internationella bestämmelserna som tillämpas för transporter av farligt gods inom civil luftfart (ICAO-TI), och de bestämmelser som tillämpas inom NATO, främst AMovP-61. Även Förenta staternas manual för militära transporter av farligt gods med flyg, AFMAN 24-2042, har beaktats. IATA-DGR3 är den standard som flygindustrin normalt tillämpar i transportkedjan för att uppfylla kraven i ICAO-TI. För att underlätta arbetet i Försvarsmaktens transportkedja, hänvisar därför dessa bestämmelser i tillämpliga delar till IATA-DGR.","note":true}]},{"num":"1.1.2","title":"Avsteg från bestämmelserna","level":3,"paras":[{"text":"FSI äger rätt att, i enskilda fall, besluta om avsteg från bestämmelserna i HFFG. Det är också FSI som motsvarar behörig myndighet (competent authority) i de avseenden IATA-DGR hänvisar till den behöriga myndigheten.","note":false}]},{"num":"1.2","title":"Undantag","level":2,"paras":[{"text":"Transport enligt detta avsnitt medges under förutsättning att befälhavaren har godkänt att godset får lastas ombord samt säkerställt att besättningen har informerats om vilka risker som finns med godset. Undantag enligt detta avsnitt får även tillämpas för de transporter som sker i samband med övning eller utveckling.","note":false}]},{"num":"1.2.1","title":"Undantag enligt andra bestämmelser","level":3,"paras":[{"text":"Bestämmelserna behöver inte tillämpas för transporter som omfattas av IATA-DGR, 1.2.7.","note":false},{"text":"1. Allied Movement Publication 6, Allied Multi-Modal Transport of Dangerous Goods Directive","note":false},{"text":"2. Air Force Interservice Manual 24-204","note":false},{"text":"3. IATA-DGR, International Air Transport Association Dangerous Goods Regulations, första gången utgiven 1956","note":false}]},{"num":"1.2.2","title":"Undantag vid transport av fordon med förbränningsmotor","level":3,"paras":[{"text":"Bestämmelserna behöver inte tillämpas vid transport av fordon som är försedd med förbränningsmotor och drivs med brandfarlig vätska (UN 3166 Vehicle, flammable liquid powered) om följande villkor är uppfyllda:","note":false},{"text":"1. Drivmedel för ombordlastade fordon få uppgå till högst ½ tank vid placering på lastramp och högst ¾ tank då de placeras på lastgolv.","note":false},{"text":"2. Högst 60 liter drivmedel får finnas lastat i reservdunk på fordonet. Reservdunken ska vara typgodkänd och märkt med UN-nummer och faroetikett. Dunken måste vara lastsäkrad och om tillämpligt, placerad i avsedd anordning (t.ex. rack)","note":false},{"text":"3. Eventuell övrig tilläggs- eller reservutrustning ska vara tömd på drivmedel.","note":false},{"text":"4. Om batterier frånkopplats ska dessa vara skyddade mot kortslutning.","note":false},{"text":"5. Övrig utrustning, klassificerad som farligt gods, som tillhör fordonet (t.ex. brandsläckare) ska vara fastsatt i avsedd anordning. Undantaget gäller inte fordon som är lastade med farligt gods (annat än det som anges ovan). Skadade eller i övrigt defekta fordon omfattas heller inte av ovanstående lättnad.","note":false}]},{"num":"1.2.3","title":"Undantag för övrig utrustning med förbränningsmotor","level":3,"paras":[{"text":"Bestämmelserna behöver inte tillämpas vid transport av utrustning som har en förbränningsmotor som drivs med brandfarlig vätska (UN 3528 engine, flammable liquid powered) eller förbränningsmotor som drivs med vätska (annan än brandfarlig) (UN 3530 engine, internal combustion), om följande villkor är uppfyllda:","note":false},{"text":"1. Om utrustningen hanteras i upprätt position och det inte föreligger risk för att den kan välta får tanken innehålla drivmedel upp till högst ¼ tank. Om det däremot föreligger risk att utrustningen hanteras liggande eller kan välta under transporten ska tank och bränslesystem vara helt tömda på drivmedel.","note":false},{"text":"2. Om batterier frånkopplats ska dessa vara skyddade mot kortslutning.","note":false}]},{"num":"1.2.4","title":"Undantag vid transport av batteridrivna fordon","level":3,"paras":[{"text":"Bestämmelserna behöver inte tillämpas vid transport av batteridrivna fordon (UN 3171 Battery powered vehicle) om följande villkor är uppfyllda:","note":false},{"text":"1. Batterier avsedda för fordonets drift ska vara oskadade och testade enligt UN manual Test and criteria, part III, chapter 38.3.","note":false},{"text":"2. Övrig utrustning, klassificerad som farligt gods, som tillhör fordonet (t.ex. brandsläckare) ska vara fastsatt i avsedd anordning. Undantaget gäller inte fordon som är lastade med farligt gods (annat än det som anges ovan). Skadade eller i övrigt defekta fordon omfattas heller inte av ovanstående lättnad.","note":false}]},{"num":"1.2.5","title":"Undantag gällande utrustning för personligt skydd","level":3,"paras":[{"text":"Bestämmelserna behöver inte tillämpas för farligt gods som ingår i utrustning för det personliga skyddet av besättningen. Besättningens personliga skyddsutrustning ska vara anpassad utifrån de förutsättningar som råder för varje enskild transport.","note":false}]},{"num":"1.2.6","title":"Undantag för utrustning installerad i luftfartyg","level":3,"paras":[{"text":"Bestämmelserna behöver inte tillämpas för farligt gods som ingår i utrustning som är installerad ombord på luftfartyget. Exempel på sådan utrustning är syrgas, brandsläckare, facklor, remsor, vapenutrustning som innehåller explosiva ämnen och föremål samt reservammunition som kan behövas under ett transportuppdrag. Undantag enligt ovanstående omfattar även de fall då extra utrustning krävs för luftfartyget under uppdragets genomförande. Verksamhetsutövaren ska då försäkra sig om att den extra utrust

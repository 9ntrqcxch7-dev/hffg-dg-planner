    <span class="text-dim" style="align-self:center; font-size:11px;">${total} match${total===1?'':'es'}</span>
  </div>
  <div class="panel">
    <div class="table-scroll">
    <table class="dtable">
      <thead><tr>${cols.map(([k,l])=>`<th data-action="dbSort" data-key="${k}">${l}${state.dbSort===k?(state.dbSortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
      <tbody>

          <tr data-action="openDgDrawerFromDb" data-un="${esc(d.un)}" data-cls="${esc(d.class||'')}" data-sub="${esc(d.subrisk||'')}" data-pg="${esc(d.pg||'')}">

            <td data-label="Name">${esc(d.psn)}</td>
            <td class="mono" data-label="Class">${esc(d.class||'—')}</td>

            <td class="mono" data-label="PG">${esc(d.pg||'—')}</td>

            <td class="mono" data-label="ERG">${esc(d.erg)}</td>

    </table>
    </div>
  </div>`;
}

    checkable++;

    if(v){ answered++; if(v === 'N') hasNo = true; }

  return `
  <div id="printArea">
    <div class="section__head" style="margin-bottom:10px;">
      <span class="section__title">${esc(CHECKLIST_DATA.formRef)} — ${esc(CHECKLIST_DATA.title)}</span>

      </span>
    </div>

    ${hasNo
      ? `<div class="chk-warning"><span>✕</span><span>${esc(CHECKLIST_DATA.footerNote)}</span></div>`
      : (answered === checkable ? `<div class="chk-ok"><span>✓</span><span>All items checked — no "No" answers recorded.</span></div>` : '')
    }

    <div class="panel panel--pad">
      <div class="chk-columns">
        ${CHECKLIST_DATA.columns.map(col => `
          <div>
            <div class="chk-col__heading">${esc(col.heading)}</div>
            ${col.items.map(it => renderChecklistRow(it, answers[it.id])).join('')}
          </div>
        `).join('')}

      <div class="chk-footer">
        <div class="note-box" style="font-weight:700;">${esc(CHECKLIST_DATA.footerNote)}</div>
        <div class="chk-field" style="margin-top:12px;">
          <label>Comments</label>
          <textarea data-action="checklistMeta" data-field="comments" placeholder="Remarks…">${esc(meta.comments)}</textarea>

            <button class="${meta.decision==='accepted'?'sel-accepted':''}" data-action="checklistDecision" data-val="accepted">Accepted</button>
            <button class="${meta.decision==='rejected'?'sel-rejected':''}" data-action="checklistDecision" data-val="rejected">Rejected</button>
          </div>
        </div>
        <div class="chk-field-grid">
          <div class="chk-field"><label>Checked by</label><input type="text" value="${esc(meta.checkedBy)}" data-action="checklistMeta" data-field="checkedBy"/></div>

          <div class="chk-field"><label>Time</label><input type="time" value="${esc(meta.time)}" data-action="checklistMeta" data-field="time"/></div>
        </div>
      </div>
    </div>
    <div class="note-box no-print" style="margin-top:10px;">${sourceTag('user')} Form state is saved on this device only (not shared/synced). ${sourceTag('calculated')} HFFG Annex 9, ${esc(CHECKLIST_DATA.formRef)} (FFS 2019:10).</div>
  </div>`;

            <th>PG<br/>(4)</th><th>PI<br/>(5)</th><th>CAO<br/>(6)</th><th>No of<br/>pcs (7)</th>

      <div class="chk-field" style="margin-top:12px;"><label>Additional information</label>
        <textarea data-action="notocMeta" data-field="additionalInfo">${esc(state.notoc.additionalInfo)}</textarea>

      <div class="notoc-accept">

    <div class="note-box no-print" style="margin-top:10px;">${sourceTag('user')} Form state is saved on this device only. Columns 1–6 and 12 are derived from the load and current aircraft mode; verify before flight. Boxes not applicable should be marked "-" or "N/A". ${sourceTag('calculated')} HFFG Annex 8, SE-MAA Form 553 (FFS 2019:10).</div>
  </div>`;
}

function renderReferenceView(){
  const chapters = CHAPTER_DATA.map(c => [c.num, c.title, chapterBlurb(c.num)]);
  const annexes = [
    ['1','Definitioner', 'glossary', `${GLOSSARY_DATA.length} terms — browsable glossary`],
    ['2','Farligt gods som får bäras ombord av passagerare eller besättning', 'annex2', `${ANNEX2_DATA.length} items — browsable list`],
    ['3','Ämnesförteckning sorterad efter UN-nummer (Table B3:1)', 'nav:database', 'Open DG Database (UN-number order) →'],
    ['4','Ämnesförteckning i alfabetisk ordning', 'dbAlpha', 'Open DG Database (alphabetical order) →'],
    ['5','ERG-koder', 'nav:erg', 'Open ERG →'],
    ['6','Särbestämmelser (Special Provisions)', 'nav:sp', 'Open Special Provisions →'],
    ['7','Förpackningsinstruktioner', 'nav:pi', 'Open Packing Instructions →'],
    ['8','NOTOC', 'external', null],
    ['9','Checklista för acceptanskontroll', 'external', null],
  ];
  return `
  <div class="grid-2">
    <div class="section">
      <div class="section__head"><span class="section__title">Chapters</span></div>
      <div class="panel">
        ${chapters.map(([n,t,blurb]) => `<div class="finding-row" style="padding:9px 12px; cursor:pointer;" data-action="openChapterDrawer" data-num="${n}"><div class="finding-row__icon mono" style="font-weight:800;">${n}</div><div class="finding-row__body"><div class="finding-row__title">${esc(t)}</div><div class="finding-row__desc">${esc(blurb)}</div></div></div>`).join('')}
      </div>
    </div>
    <div class="section">
      <div class="section__head"><span class="section__title">Annexes (Bilagor)</span></div>
      <div class="panel">
        ${annexes.map(([n,t,kind,sub]) => {
          const action = kind === 'glossary' ? 'openGlossaryDrawer' : kind === 'annex2' ? 'openAnnex2Drawer' : kind === 'external' ? 'openAnnexExternalDrawer' : kind === 'dbAlpha' ? 'openDbAlpha' : 'nav';

          return `<div class="finding-row" style="padding:9px 12px; cursor:pointer;" data-action="${action}" ${dataAttrs}><div class="finding-row__icon mono" style="font-weight:800;">B${n}</div><div class="finding-row__body"><div class="finding-row__title">${esc(t)}</div>${sub?`<div class="finding-row__desc">${esc(sub)}</div>`:''}</div></div>`;
        }).join('')}

      <div class="kv-row"><div class="kv-row__label">Class 1 internal compatibility</div><div class="kv-row__value" style="font-family:var(--sans);">HFFG 9.8.2, Table 9:4 (page 73)</div></div>
      <div class="kv-row"><div class="kv-row__label">Colour legend</div><div class="kv-row__value" style="font-family:var(--sans);">HFFG Table 9:2 (page 71)</div></div>
    </div>
  </div>
  <div class="note-box">Document: <em>Tillämpningsbestämmelser Militär luftfart – Hantering flygtransport av farligt gods (HFFG)</em>, Militära flyginspektionen, 1 Mars 2022 (FFS 2019:10).</div>
  `;
}
function chapterBlurb(num){
  const blurbs = {
    '1':'General provisions, application, deviations, exceptions, responsibilities.',
    '2':'Prohibited/approval-required goods, restrictions, excepted & limited quantities.',
    '3':'Classes, divisions, hazard grades, packing groups.',
    '4':'UN numbers, proper shipping names, the DG list, Special Provisions.',
    '5':'Packaging requirements, packing instructions.',
    '6':'Approved packagings, tanks, IBCs.',
    '7':'Marking and labelling.',
    '8':'Cargo declaration, NOTOC, acceptance checklist.',
    '9':'Handling, loading, separation (9.8), transport.',
  };
  return blurbs[num] || '';
}
// ============================================================================
// EVENT HANDLING
// ============================================================================
function attachEvents(){
  const app = document.getElementById('app');
  if(app.dataset.boundEvents) return; // bind exactly once — render() may be called many times
  app.dataset.boundEvents = '1';

  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    switch(action){
      case 'nav': state.activeView = el.dataset.view; state.drawer = null; state.mobileNavOpen = false; render(); break;
      case 'openDbAlpha': state.activeView = 'database'; state.dbSort = 'psn'; state.dbSortDir = 1; state.dbQuery = ''; state.drawer = null; state.mobileNavOpen = false; render(); break;
      case 'toggleMobileNav': state.mobileNavOpen = !state.mobileNavOpen; render(); break;
      case 'closeMobileNav': state.mobileNavOpen = false; render(); break;
      case 'setMode': state.aircraftMode = el.dataset.mode; saveLoadToStorage(); render(); break;
      case 'addToLoad': {
        const dg = findDgByFingerprint(el.dataset.un, el.dataset.cls, el.dataset.sub, el.dataset.pg);
        if(dg){
          const relevantMax = state.aircraftMode === 'passenger' ? dg.paxMax : dg.caoMax;
          const parsed = parseMaxQtyValue(relevantMax);
          state.load.push({uid: uid(), dg, qtyValue:null, qtyUnit: parsed ? parsed.unit : 'kg'});
          state.searchQuery='';
          saveLoadToStorage();
        }
        render();
        break;
      }
      case 'removeFromLoad': state.load = state.load.filter(l=>l.uid!==el.dataset.uid); saveLoadToStorage(); render(); break;
      case 'clearLoad': state.load = []; saveLoadToStorage(); render(); break;
      case 'openDgDrawer': {
        const li = state.load.find(l=>l.uid===el.dataset.uid);
        if(li){ state.drawer = {type:'dg', payload:{dg: li.dg}}; render(); }
        break;
      }
      case 'openDgDrawerFromDb': {
        const dg = findDgByFingerprint(el.dataset.un, el.dataset.cls, el.dataset.sub, el.dataset.pg);
        if(dg){ state.drawer = {type:'dg', payload:{dg}}; render(); }
        break;
      }
      case 'openSpDrawer': state.drawer = {type:'sp', payload: el.dataset.sp}; render(); break;
      case 'openPairDrawer': state.drawer = {type:'pair', payload:{a: el.dataset.a, b: el.dataset.b}}; render(); break;
      case 'openPiDrawer': state.drawer = {type:'pi', payload: el.dataset.pi}; render(); break;
      case 'openChapterDrawer': state.drawer = {type:'chapter', payload: el.dataset.num}; render(); break;
      case 'openGlossaryDrawer': state.drawer = {type:'glossary', payload:null}; render(); break;
      case 'openAnnex2Drawer': state.drawer = {type:'annex2', payload:null}; render(); break;
      case 'openAnnexExternalDrawer': state.drawer = {type:'annexExternal', payload: el.dataset.num}; render(); break;
      case 'openErgFromDrawer': state.activeView='erg'; state.ergExpand = 'n' + (el.dataset.erg.match(/^\d+/)||[''])[0]; state.drawer=null; render(); break;
      case 'closeDrawer': state.drawer = null; render(); break;
      case 'dbSort': {
        if(state.dbSort === el.dataset.key) state.dbSortDir *= -1; else { state.dbSort = el.dataset.key; state.dbSortDir = 1; }
        render();
        break;
      }
      case 'toggleErg': {
        state.ergExpand = state.ergExpand === el.dataset.erg ? null : el.dataset.erg;
        render();
        break;
      }
      case 'checklistAnswer': {
        const id = el.dataset.id, val = el.dataset.val;
        state.checklist.answers[id] = (state.checklist.answers[id] === val) ? null : val;
        saveChecklistToStorage();
        renderViewOnly();
        break;
      }
      case 'checklistDecision': {
        const val = el.dataset.val;
        state.checklist.meta.decision = (state.checklist.meta.decision === val) ? null : val;
        saveChecklistToStorage();
        renderViewOnly();
        break;
      }
      case 'checklistClear': {
        if(confirm('Clear all checklist answers and fields on this device?')){
          state.checklist = {answers:{}, meta:{comments:'', decision:null, checkedBy:'', signature:'', place:'', date:'', time:''}};
          saveChecklistToStorage();
          render();
        }
        break;
      }
      case 'checklistPrint': {
        window.print();
        break;
      }
      case 'notocRegenerate': {
        generateNotocFromLoad();
        renderViewOnly();
        break;
      }
      case 'notocPrint': {
        window.print();
        break;
      }
      case 'notocRemoveRow': {
        const idx = parseInt(el.dataset.idx, 10);
        state.notoc.rows.splice(idx, 1);
        saveNotocToStorage();
        renderViewOnly();
        break;
      }
      case 'notocGenerateFromPlanner': {
        generateNotocFromLoad();
        state.activeView = 'notoc';
        render();
        break;
      }
      case 'openChecklistForLoad': {
        const summary = state.load.map(li => `UN ${li.dg.un} ${li.dg.psn}`).join('; ');
        if(!state.checklist.meta.comments || state.checklist.meta.comments.trim() === ''){
          state.checklist.meta.comments = summary ? `Load: ${summary}` : '';
          saveChecklistToStorage();
        }
        state.activeView = 'checklist';
        render();
        break;
      }
    }
  });

  app.addEventListener('input', (e) => {
    const el = e.target;
    if(el.id === 'dgSearchInput'){ state.searchQuery = el.value; renderSearchOnly(); }
    else if(el.id === 'dbSearchInput'){ state.dbQuery = el.value; renderViewOnly(); }
    else if(el.id === 'spSearchInput'){ state.spQuery = el.value; renderViewOnly(); }
    else if(el.id === 'piSearchInput'){ state.piQuery = el.value; renderViewOnly(); }
    else if(el.dataset.action === 'setQtyValue'){
      const li = state.load.find(l=>l.uid===el.dataset.uid);
      if(li){ li.qtyValue = el.value === '' ? null : el.value; saveLoadToStorage(); renderFindingsOnly(); }
    }
    else if(el.dataset.action === 'checklistMeta'){
      state.checklist.meta[el.dataset.field] = el.value;
      saveChecklistToStorage();
      // no re-render needed — the input already reflects what the user typed
    }
    else if(el.dataset.action === 'notocHeader'){
      state.notoc.header[el.dataset.field] = el.value;
      saveNotocToStorage();
    }
    else if(el.dataset.action === 'notocMeta'){
      state.notoc[el.dataset.field] = el.value;
      saveNotocToStorage();
    }
    else if(el.dataset.action === 'notocRow'){
      const idx = parseInt(el.dataset.idx, 10);
      if(state.notoc.rows[idx]){ state.notoc.rows[idx][el.dataset.field] = el.value; saveNotocToStorage(); }
    }
  });
  app.addEventListener('change', (e) => {
    const el = e.target;
    if(el.dataset.action === 'setQtyUnit'){
      const li = state.load.find(l=>l.uid===el.dataset.uid);
      if(li){ li.qtyUnit = el.value; saveLoadToStorage(); renderFindingsOnly(); }
    }
    else if(el.dataset.action === 'checklistMeta'){
      state.checklist.meta[el.dataset.field] = el.value;
      saveChecklistToStorage();
    }
    else if(el.dataset.action === 'notocHeader'){
      state.notoc.header[el.dataset.field] = el.value;
      saveNotocToStorage();
    }
  });

  // keep focus on search input across partial re-renders
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && state.drawer){ state.drawer = null; render(); }
  });
}

// Lightweight partial re-renders to avoid losing input focus while typing
function renderSearchOnly(){
  const wrap = document.getElementById('dgSearchInput')?.parentElement;
  if(!wrap) return render();
  const existing = wrap.querySelector('.search-results');
  if(existing) existing.remove();
  if(state.searchQuery.trim()) wrap.insertAdjacentHTML('beforeend', renderSearchResults());
  // also refresh topbar meta counts silently (cheap) — skip for now
}
function renderViewOnly(){
  const content = document.querySelector('.content');
  const scrollTop = content.scrollTop;
  content.innerHTML = renderView();
  content.scrollTop = scrollTop;
  // re-focus filter input with caret at end
  const activeInputIds = ['dbSearchInput','spSearchInput','piSearchInput'];
  activeInputIds.forEach(id=>{
    const inp = document.getElementById(id);
    if(inp && document.activeElement !== inp && ((id==='dbSearchInput'&&state.dbQuery)||(id==='spSearchInput'&&state.spQuery)||(id==='piSearchInput'&&state.piQuery))){
      // only refocus the one matching current view
    }
  });
  const focusMap = {database:'dbSearchInput', sp:'spSearchInput', pi:'piSearchInput'};
  const fid = focusMap[state.activeView];
  if(fid){ const inp = document.getElementById(fid); if(inp){ inp.focus(); const v=inp.value; inp.value=''; inp.value=v; } }
}
function renderFindingsOnly(){
  const wrap = document.getElementById('findingsWrap');
  if(!wrap) return render();
  const loadEval = evaluateLoad(state.load.map(li=>({dg:li.dg, uid:li.uid})), state.aircraftMode);
  wrap.innerHTML = `${state.load.length >= 1 ? renderPlannerFindings(loadEval) : ''}${state.load.length >= 1 ? renderFinalAssessment(loadEval) : ''}`;
}

// ============================================================================
// INIT
// ============================================================================
loadChecklistFromStorage();
loadNotocFromStorage();
loadLoadFromStorage();
render();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>HFFG Dangerous Goods Load Planner</title>
<meta name="description" content="HFFG Dangerous Goods air-transport decision-support tool — offline-capable operational planning aid."/>

<!-- PWA / installability -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1f3a5f"/>
<meta name="background-color" content="#eef0f2"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="HFFG"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png"/>
<link rel="shortcut icon" href="icons/favicon.ico"/>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"/>
<link rel="mask-icon" href="icons/icon-512.png" color="#1f3a5f"/>

<style>
:root{
  --bg:#eef0f2; --panel:#ffffff; --panel-alt:#f6f7f8; --border:#d7dbe0; --border-strong:#b9c0c8;
  --text:#1a2027; --text-dim:#5b6470; --text-faint:#88919a;
  --accent:#1f3a5f; --accent-dim:#3a5a82; --accent-bg:#eaf0f7;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --green:#146c37; --green-bg:#e3f3e8; --green-bd:#b8dfc4;
  --yellow:#8a6a00; --yellow-bg:#fbf3d3; --yellow-bd:#e9d98a;
  --amber:#9a5300; --amber-bg:#fbe7cf; --amber-bd:#eec596;
  --orange:#a83c00; --orange-bg:#fbe0cf; --orange-bd:#eab08c;
  --red:#a92018; --red-bg:#f9e0dd; --red-bd:#eab3ac;
  --grey:#555e68; --grey-bg:#e9ebee; --grey-bd:#c7ccd2;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
#app{display:flex; height:100vh; overflow:hidden;}
button{font-family:inherit; font-size:inherit;}
input,select{font-family:inherit; font-size:inherit;}

/* ---------- Layout shell ---------- */
.shell{display:flex; width:100%; height:100%;}
.navrail{
  width:190px; flex:0 0 190px; background:var(--accent); color:#dbe6f2;
  display:flex; flex-direction:column; border-right:1px solid #14273f;
}
.navrail__brand{
  padding:14px 14px 12px; border-bottom:1px solid rgba(255,255,255,0.12);
  padding-top:calc(14px + env(safe-area-inset-top, 0px));
}
.navrail__brand .title{font-weight:700; font-size:13px; letter-spacing:.03em; color:#fff;}
.navrail__brand .subtitle{font-size:10.5px; color:#9db3c9; margin-top:2px; letter-spacing:.02em;}
.navrail__items{flex:1; padding:8px 0; overflow-y:auto;}
.navitem{
  display:flex; align-items:center; gap:8px; padding:8px 14px; cursor:pointer;
  font-size:12.2px; color:#c3d3e3; border-left:3px solid transparent; user-select:none;
}
.navitem:hover{background:rgba(255,255,255,0.06); color:#fff;}
.navitem.active{background:rgba(255,255,255,0.10); color:#fff; border-left-color:#6fa8dc; font-weight:600;}
.navitem__icon{width:15px; text-align:center; opacity:.85; font-size:12px;}
.navrail__footer{padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); font-size:10px; color:#84a0ba; border-top:1px solid rgba(255,255,255,0.12);}

.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%;}
.topbar{
  min-height:46px; flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 16px;
  padding-top:calc(8px + env(safe-area-inset-top, 0px));
  padding-left:calc(16px + env(safe-area-inset-left, 0px));
  padding-right:calc(16px + env(safe-area-inset-right, 0px));
}
.topbar__text{display:flex; flex-direction:column; flex:1; min-width:0;}
.topbar__title{font-size:13.5px; font-weight:700; color:var(--text);}
.topbar__meta{font-size:11px; color:var(--text-dim);}
.topbar__source{font-size:10.5px; color:var(--text-faint); text-align:right; white-space:nowrap;}
.hamburger{
  display:none; flex:0 0 auto; width:32px; height:32px; border:1px solid var(--border-strong); border-radius:var(--radius);
  background:var(--panel); font-size:16px; cursor:pointer; color:var(--text); align-items:center; justify-content:center;
}

.content{flex:1; overflow-y:auto; padding:14px 16px calc(40px + env(safe-area-inset-bottom, 0px));}

/* ---------- Section primitives ---------- */
.section{margin-bottom:16px;}
.section__head{
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom:6px; margin-bottom:8px; border-bottom:1px solid var(--border-strong);
}
.section__title{
  font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim);
}
.section__actions{display:flex; gap:6px; align-items:center;}

.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);}
.panel--pad{padding:12px 14px;}

.kv-row{display:flex; padding:3px 0; border-bottom:1px dashed var(--border); font-size:12.3px;}
.kv-row:last-child{border-bottom:none;}
.kv-row__label{flex:0 0 168px; color:var(--text-dim); font-weight:600; font-size:10.7px; letter-spacing:.03em; text-transform:uppercase; padding-top:1px;}
.kv-row__value{flex:1; font-family:var(--mono); color:var(--text);}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--border-strong); background:var(--panel); color:var(--text);
  padding:5px 10px; border-radius:var(--radius); cursor:pointer; font-size:12px; font-weight:600;
  display:inline-flex; align-items:center; gap:5px;
}
.btn:hover{background:var(--panel-alt); border-color:var(--accent-dim);}
.btn--primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn--primary:hover{background:var(--accent-dim);}
.btn--ghost{background:transparent; border-color:transparent; color:var(--accent);}
.btn--ghost:hover{background:var(--accent-bg);}
.btn--sm{padding:3px 7px; font-size:11px;}
.btn--danger{color:var(--red);}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.toggle-group{display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--radius); overflow:hidden;}
.toggle-group button{
  border:none; background:var(--panel); padding:6px 12px; font-size:12px; font-weight:600; color:var(--text-dim); cursor:pointer;
  border-right:1px solid var(--border-strong);
}
.toggle-group button:last-child{border-right:none;}
.toggle-group button.active{background:var(--accent); color:#fff;}

/* ---------- Status badges ---------- */
.status{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 6px; border-radius:2px;
  font-size:11px; font-weight:700; letter-spacing:.02em; white-space:normal; border:1px solid transparent;
  line-height:1.3; max-width:100%;
}
.kv-row__value .status{max-width:none;}
.status__sym{font-size:11px; line-height:1;}
.status--green{color:var(--green); background:var(--green-bg); border-color:var(--green-bd);}
.status--yellow{color:var(--yellow); background:var(--yellow-bg); border-color:var(--yellow-bd);}
.status--amber{color:var(--amber); background:var(--amber-bg); border-color:var(--amber-bd);}
.status--orange{color:var(--orange); background:var(--orange-bg); border-color:var(--orange-bd);}
.status--red{color:var(--red); background:var(--red-bg); border-color:var(--red-bd);}
.status--grey{color:var(--grey); background:var(--grey-bg); border-color:var(--grey-bd);}
.status--lg{font-size:13px; padding:6px 12px 6px 9px; border-radius:3px;}

.dot{width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 auto;}
.dot--green{background:var(--green);} .dot--yellow{background:var(--yellow);}
.dot--amber{background:var(--amber);} .dot--orange{background:var(--orange);}
.dot--red{background:var(--red);} .dot--grey{background:var(--grey);}

.legend-sym{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; font-size:12px; font-weight:700; margin-right:2px; flex:0 0 auto;}
.legend-sym--green{color:var(--green);} .legend-sym--yellow{color:var(--yellow);}
.legend-sym--red{color:var(--red);} .legend-sym--grey{color:var(--grey);}

/* ---------- Search ---------- */
.search-wrap{position:relative;}
.search-input{
  width:100%; padding:8px 10px; border:1px solid var(--border-strong); border-radius:var(--radius);
  font-size:13px; font-family:var(--mono); background:var(--panel); color:var(--text);
}
.search-input:focus{outline:none; border-color:var(--accent-dim); box-shadow:0 0 0 2px var(--accent-bg);}
.search-results{
  position:absolute; top:calc(100% + 2px); left:0; right:0; background:var(--panel);
  border:1px solid var(--border-strong); border-radius:var(--radius); max-height:340px; overflow-y:auto;
  z-index:40; box-shadow:0 6px 18px rgba(20,30,45,0.14);
}
.search-result{
  padding:7px 10px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;
}
.search-result:last-child{border-bottom:none;}
.search-result:hover{background:var(--accent-bg);}
.search-result__un{font-family:var(--mono); font-weight:700; font-size:11.5px; color:var(--accent); flex:0 0 46px;}
.search-result__name{flex:1; font-size:12px;}
.search-result__class{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); flex:0 0 auto;}

/* ---------- Load list ---------- */
.load-item{
  display:flex; flex-direction:column; gap:6px; padding:8px 10px; border:1px solid var(--border);
  border-radius:var(--radius); background:var(--panel); margin-bottom:6px;
}
/* Header row: UN, name/class, qty, remove — remove (✕) always pinned here so its
   position never depends on how many Special Provisions the item has. */
.load-item__header{
  display:flex; align-items:center; gap:10px; flex-wrap:nowrap;
}
.load-item__un{font-family:var(--mono); font-weight:700; font-size:12.5px; color:var(--accent); flex:0 0 50px;}
.load-item__info{flex:1 1 160px; min-width:0; overflow:hidden;}
.load-item__name{font-size:12.3px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.load-item__sub{font-size:10.7px; color:var(--text-dim); font-family:var(--mono); margin-top:1px;}
.load-item__qty{display:flex; align-items:center; gap:4px; flex:0 0 auto;}
.qty-input{width:56px; padding:4px 5px; border:1px solid var(--border-strong); border-radius:2px; font-family:var(--mono); font-size:11.5px; text-align:right;}
.unit-select{border:1px solid var(--border-strong); border-radius:2px; font-size:11px; padding:3px;}

/* Meta row: all Special Provision chips (wraps freely, none hidden/truncated)
   plus the status badge + info button, kept together as one group at the end. */
.load-item__meta{
  display:flex; align-items:center; gap:6px 10px; flex-wrap:wrap;
}
.load-item__badges{display:flex; gap:4px; flex-wrap:wrap; flex:1 1 auto; min-width:0;}
.load-item__status-group{display:flex; align-items:center; gap:6px; flex:0 0 auto; margin-left:auto;}

.iconbtn{
  border:1px solid var(--border-strong); background:var(--panel); border-radius:2px; width:22px; height:22px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim); font-size:12px; flex:0 0 auto;
}
.iconbtn:hover{background:var(--panel-alt); color:var(--text);}
.iconbtn--danger{color:var(--red); border-color:var(--red-bd);}
.iconbtn--danger:hover{background:var(--red-bg); color:var(--red); border-color:var(--red);}

.empty-state{
  padding:26px 14px; text-align:center; color:var(--text-faint); font-size:12px; border:1px dashed var(--border-strong);
  border-radius:var(--radius); background:var(--panel-alt);
}

/* ---------- Tables ---------- */
table.dtable{width:100%; border-collapse:collapse; font-size:12px;}
table.dtable thead th{
  text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim);
  padding:6px 8px; border-bottom:1px solid var(--border-strong); background:var(--panel-alt); position:sticky; top:0; cursor:pointer; white-space:nowrap;
}
table.dtable tbody td{padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
table.dtable tbody tr:hover{background:var(--accent-bg);}
table.dtable td.mono{font-family:var(--mono);}
table.dtable tbody tr{cursor:pointer;}

/* ---------- Compatibility matrix ---------- */
.matrix-scroll{overflow:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel);}
table.matrix{border-collapse:collapse; font-size:11px;}
table.matrix th, table.matrix td{border:1px solid var(--border); text-align:center; padding:0;}
table.matrix th{background:var(--panel-alt); font-family:var(--mono); font-weight:700; font-size:10.5px; color:var(--text-dim); padding:5px 7px; white-space:nowrap;}
table.matrix th.rowhead{text-align:right; padding-right:8px;}
.matrix-cell{width:34px; height:30px; cursor:pointer; position:relative;}
.matrix-cell:hover{outline:2px solid var(--accent); outline-offset:-2px;}
.matrix-cell.self{background:repeating-linear-gradient(45deg, #f1f2f4, #f1f2f4 4px, #e6e8eb 4px, #e6e8eb 8px);}
.matrix-cell .sym{font-size:13px; font-weight:700;}
.mc-green{background:var(--green-bg); color:var(--green);}
.mc-yellow{background:var(--yellow-bg); color:var(--yellow);}
.mc-amber{background:var(--amber-bg); color:var(--amber);}
.mc-orange{background:var(--orange-bg); color:var(--orange);}
.mc-red{background:var(--red-bg); color:var(--red);}
.mc-grey{background:var(--grey-bg); color:var(--grey);}

.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--text-dim); margin-top:8px;}
.legend__item{display:flex; align-items:center; gap:5px;}

/* ---------- Drawer ---------- */
.drawer-overlay{
  position:fixed; inset:0; background:rgba(15,22,32,0.32); z-index:90; display:none;
}
.drawer-overlay.open{display:block;}
.drawer{
  position:fixed; top:0; right:-460px; width:440px; max-width:92vw; height:100%; background:var(--panel);
  border-left:1px solid var(--border-strong); z-index:91; transition:right .18s ease; display:flex; flex-direction:column;
  box-shadow:-8px 0 24px rgba(20,30,45,0.18);
}
.drawer.open{right:0;}
.drawer__head{
  padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
}
.drawer__title{font-size:13.5px; font-weight:700;}
.drawer__subtitle{font-size:11px; color:var(--text-dim); margin-top:2px;}
.drawer__body{flex:1; overflow-y:auto; padding:12px 14px; padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));}
.drawer__close{border:none; background:none; font-size:16px; cursor:pointer; color:var(--text-dim); line-height:1;}
.drawer__close:hover{color:var(--text);}

.detail-block{margin-bottom:14px;}
.detail-block__label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700; margin-bottom:4px;}
.detail-block__text{font-size:12.3px; line-height:1.55; color:var(--text);}
.detail-block__text.mono{font-family:var(--mono);}

.source-tag{
  display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 6px; border-radius:2px;
  text-transform:uppercase; letter-spacing:.03em;
}
.source-tag--calculated{background:var(--green-bg); color:var(--green);}
.source-tag--external{background:var(--grey-bg); color:var(--grey);}
.source-tag--manual{background:var(--amber-bg); color:var(--amber);}
.source-tag--user{background:var(--accent-bg); color:var(--accent);}

.pill-row{display:flex; flex-wrap:wrap; gap:5px;}
.pill{
  font-family:var(--mono); font-size:10.8px; padding:2px 7px; border:1px solid var(--border-strong); border-radius:2px;
  background:var(--panel-alt); cursor:pointer; color:var(--text);
}
.pill:hover{background:var(--accent-bg); border-color:var(--accent-dim); color:var(--accent);}

.divider{height:1px; background:var(--border); margin:12px 0;}

.assessment-banner{
  border:1px solid; border-radius:var(--radius); padding:12px 14px; display:flex; align-items:center; gap:12px; margin-bottom:10px;
}
.assessment-banner__sym{font-size:22px; font-weight:800; flex:0 0 auto;}
.assessment-banner__text{flex:1;}
.assessment-banner__title{font-size:14px; font-weight:800; letter-spacing:.02em;}
.assessment-banner__sub{font-size:11.5px; margin-top:2px; opacity:.9;}

.finding-row{
  display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);
}
.finding-row:last-child{border-bottom:none;}
.finding-row__icon{flex:0 0 20px; padding-top:1px;}
.finding-row__body{flex:1;}
.finding-row__title{font-size:12.3px; font-weight:700;}
.finding-row__desc{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

.searchbar-row{display:flex; gap:8px; margin-bottom:10px;}
.filter-input{padding:6px 9px; border:1px solid var(--border-strong); border-radius:var(--radius); font-size:12px;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border-strong); margin-bottom:10px;}
.tab{padding:7px 12px; font-size:11.5px; font-weight:600; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}

.note-box{
  border:1px solid var(--border); background:var(--panel-alt); border-radius:var(--radius); padding:9px 11px; font-size:11.5px; color:var(--text-dim);
}
.note-box strong{color:var(--text);}

/* ---------- Packing instruction structured table ---------- */
.pi-box{border:1px solid var(--border-strong); border-radius:var(--radius); overflow:hidden;}
.pi-box__head{background:var(--accent-bg); border-bottom:1px solid var(--border-strong); padding:8px 12px; text-align:center;}
.pi-box__head-code{font-family:var(--mono); font-weight:800; font-size:12.5px; color:var(--accent);}
.pi-box__head-sub{font-size:11px; font-style:italic; color:var(--text-dim); margin-top:2px;}
.pi-box__body{padding:11px 13px;}
.pi-field{padding:9px 0; border-top:1px solid var(--border);}
.pi-field:first-child{border-top:none; padding-top:0;}
.pi-field__label{font-weight:700; font-size:11px; text-decoration:underline; text-underline-offset:2px; margin-bottom:5px; color:var(--text);}
.pi-field__label .note{font-weight:400; text-decoration:none; color:var(--text-dim); font-size:10.5px;}
.pi-field__empty{font-size:12px; color:var(--text-dim); font-style:italic;}
table.pi-groups{width:100%; border-collapse:collapse; font-size:12px;}
table.pi-groups td{padding:2px 0; vertical-align:top;}
table.pi-groups td.pi-groups__name{color:var(--text-dim); white-space:nowrap; padding-right:12px; width:1%; font-weight:600;}
.pi-pp-row{display:flex; gap:10px; padding:5px 0; border-top:1px dashed var(--border);}
.pi-pp-row:first-child{border-top:none;}
.pi-pp-row__code{flex:0 0 62px; font-family:var(--mono); font-weight:700; color:var(--accent); font-size:11.5px;}
.pi-pp-row__text{flex:1; font-size:12px;}
.pi-subhead{font-weight:700; font-size:11px; text-decoration:underline; text-underline-offset:2px; margin:11px 0 6px; color:var(--text);}
ol.pi-numbered{margin:0 0 4px; padding-left:19px; font-size:12.3px;}
ol.pi-numbered > li{margin-bottom:7px;}
ol.pi-numbered ol{margin:5px 0 0; padding-left:17px; list-style:lower-roman;}
ol.pi-numbered ol > li{margin-bottom:4px;}

/* ---------- Acceptance checklist ---------- */
.chk-columns{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:1100px){.chk-columns{grid-template-columns:1fr;}}
.chk-col__heading{font-size:11px; font-weight:800; letter-spacing:.03em; color:var(--accent); padding-bottom:6px; margin-bottom:8px; border-bottom:2px solid var(--accent);}
.chk-row{display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--border);}
.chk-row.header{border-bottom:none; padding-bottom:2px; padding-top:10px;}
.chk-row.header:first-child{padding-top:0;}
.chk-row.indent{padding-left:20px;}
.chk-row__n{flex:0 0 22px; font-family:var(--mono); font-size:11px; color:var(--text-dim); padding-top:3px;}
.chk-row__text{flex:1; font-size:12.3px; padding-top:2px; line-height:1.4;}
.chk-row.header .chk-row__text{font-weight:700; color:var(--text);}
.chk-row__opts{flex:0 0 auto; display:flex; gap:4px;}
.chk-opt{
  min-width:30px; height:26px; padding:0 8px; border:1px solid var(--border-strong); border-radius:2px;
  background:var(--panel); font-size:10.5px; font-weight:700; color:var(--text-dim); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.chk-opt:hover{background:var(--panel-alt);}
.chk-opt.sel-Y{background:var(--green-bg); border-color:var(--green-bd); color:var(--green);}
.chk-opt.sel-N{background:var(--red-bg); border-color:var(--red-bd); color:var(--red);}
.chk-opt.sel-NA{background:var(--grey-bg); border-color:var(--grey-bd); color:var(--grey);}

.chk-warning{
  display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--red-bd); background:var(--red-bg);
  color:var(--red); border-radius:var(--radius); font-size:12.5px; font-weight:700; margin-bottom:12px;
}
.chk-ok{
  display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--green-bd); background:var(--green-bg);
  color:var(--green); border-radius:var(--radius); font-size:12.5px; font-weight:700; margin-bottom:12px;
}
.chk-progress{font-size:11px; color:var(--text-dim); font-weight:600;}

.chk-footer{margin-top:16px; padding-top:14px; border-top:2px solid var(--border-strong);}
.chk-field-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:12px;}
@media(max-width:900px){.chk-field-grid{grid-template-columns:1fr 1fr;}}
.chk-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); font-weight:700; margin-bottom:4px;}
.chk-field input, .chk-field textarea{
  width:100%; padding:6px 8px; border:1px solid var(--border-strong); border-radius:var(--radius); font-size:12.5px; font-family:var(--sans); background:var(--panel);
}
.chk-field textarea{min-height:56px; resize:vertical;}
.chk-decision{display:flex; gap:8px; margin-top:6px;}
.chk-decision button{
  flex:1; padding:9px; border:1px solid var(--border-strong); border-radius:var(--radius); background:var(--panel); font-weight:700; font-size:12px; cursor:pointer; color:var(--text-dim);
}
.chk-decision button.sel-accepted{background:var(--green-bg); border-color:var(--green-bd); color:var(--green);}
.chk-decision button.sel-rejected{background:var(--red-bg); border-color:var(--red-bd); color:var(--red);}

@media print{
  body{background:#fff !important;}
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute; top:0; left:0; width:100%;}
  .navrail, .topbar, .drawer, .drawer-overlay, .no-print{display:none !important;}
  .chk-opt{border:1px solid #888 !important; color:#000 !important; background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .chk-opt.sel-Y, .chk-opt.sel-N, .chk-opt.sel-NA{background:#ddd !important; font-weight:800; border:1.5px solid #000 !important;}
  .chk-columns{grid-template-columns:1fr 1fr !important;}
  .chk-row, .chk-row__opts, .chk-opt{page-break-inside:avoid;}
  .chk-warning{background:#fff !important; border:1.5px solid #000 !important; color:#000 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .notoc-table th, .notoc-table td{border:1px solid #999 !important;}
  .notoc-table input{border:none !important; padding:1px !important;}
}

/* ---------- NOTOC ---------- */
.notoc-header-grid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px;}
@media(max-width:900px){.notoc-header-grid{grid-template-columns:1fr 1fr;}}
.notoc-table-scroll{overflow-x:auto; border:1px solid var(--border-strong); border-radius:var(--radius);}
table.notoc-table{border-collapse:collapse; width:100%; min-width:1100px; font-size:11px;}
table.notoc-table th{
  background:var(--panel-alt); border:1px solid var(--border); padding:5px 6px; text-align:left; font-size:9.5px;
  text-transform:uppercase; letter-spacing:.02em; color:var(--text-dim); white-space:nowrap; line-height:1.25;
}
table.notoc-table td{border:1px solid var(--border); padding:0; vertical-align:middle;}
table.notoc-table td.mono{font-family:var(--mono); font-size:11px; padding:5px 6px; white-space:nowrap;}
table.notoc-table td:nth-child(2){min-width:170px; padding:5px 6px;}
table.notoc-table input{
  width:100%; min-width:56px; border:none; padding:5px 6px; font-size:11px; font-family:inherit; background:transparent;
}
table.notoc-table input:focus{outline:2px solid var(--accent-dim); outline-offset:-2px; background:var(--accent-bg);}
.notoc-accept__title{font-size:12.5px; font-weight:800; margin-bottom:4px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
@media(max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr;}}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#c3c9d0; border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#a9b1ba;}

.small-caps{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700;}
.mono{font-family:var(--mono);}
.text-dim{color:var(--text-dim);}
.text-faint{color:var(--text-faint);}
.table-scroll{overflow-x:auto;}

/* ============================================================================
   RESPONSIVE: narrow screens (phones — both portrait and narrow landscape).
   Nothing here changes iPad/desktop layout; it only ADDS behaviour below the
   breakpoint. Nothing is hidden or removed — wide content that isn't turned
   into cards stays reachable via horizontal scroll (.table-scroll / .matrix-
   scroll / .notoc-table-scroll already provide this everywhere it's needed).
   ============================================================================ */
@media(max-width:700px){
  .hamburger{display:flex;}
  .navrail{
    position:fixed; top:0; left:0; height:100%; z-index:80; width:250px; max-width:82vw;
    transform:translateX(-100%); transition:transform .18s ease; box-shadow:4px 0 18px rgba(0,0,0,0.25);
  }
  .navrail.mobile-open{transform:translateX(0);}
  .nav-backdrop{
    position:fixed; inset:0; background:rgba(15,22,32,0.35); z-index:79; opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .nav-backdrop.open{opacity:1; pointer-events:auto;}
  .shell{position:relative;}
  .topbar__source{display:none;} /* low-value on a phone; keeps the header from wrapping to 3 lines */

  /* dense multi-column tables become stacked cards */
  table.dtable thead{display:none;}
  table.dtable, table.dtable tbody, table.dtable tr, table.dtable td{display:block; width:100%;}
  table.dtable tr{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; padding:8px 10px;}
  table.dtable tbody tr:hover{background:var(--panel);}
  table.dtable td{border-bottom:none; padding:3px 0; display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
  table.dtable td[data-label]::before{content:attr(data-label); font-weight:700; color:var(--text-dim); font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; flex:0 0 auto;}
  table.dtable td[data-label=""]::before{content:none;}
  table.dtable td:first-child{font-size:12.5px; font-weight:700;}

  .grid-2, .grid-3{grid-template-columns:1fr;}
  .searchbar-row{flex-wrap:wrap;}

  .section__head{flex-wrap:wrap; row-gap:8px;}
  .section__actions{flex-wrap:wrap; width:100%; justify-content:flex-start;}
  .section__actions .btn{flex:0 1 auto;}
  .chk-progress{width:100%; order:-1;}
}
</style>
